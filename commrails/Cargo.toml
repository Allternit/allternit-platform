[package]
name = "allternit-commrails"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "allternit_commrails"
path = "src/lib.rs"

[[bin]]
name = "allternit-commrails"
path = "src/bin/allternit-commrails.rs"

[[bin]]
name = "allternit-rails"
path = "src/bin/allternit-commrails.rs"

[[bin]]
name = "allternit-commrails-service"
path = "src/bin/allternit-commrails-service.rs"

[[bin]]
name = "allternit-rails-service"
path = "src/bin/allternit-commrails-service.rs"

[features]
default = []
dolt = ["sqlx/mysql", "sqlx/chrono"]

[dependencies]
serde = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
chrono-tz = "0.9"
tokio = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
sqlx = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
tempfile = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
axum = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tower-http = { workspace = true }
sha2 = { workspace = true }
ed25519-dalek = { workspace = true }
regex = { workspace = true }
serde_yaml = { workspace = true }
blake3 = { workspace = true }
reqwest = { workspace = true }
base64 = { workspace = true }
urlencoding = { workspace = true }
tonic = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
serde_bytes = { workspace = true }
worktree-manager = { path = "../worktree-manager" }

[target.'cfg(unix)'.dependencies]
# getuid() for the per-user 0700 peer-socket fallback dir.
libc = "0.2"

[build-dependencies]
tonic-build = { workspace = true }

# AllternitOS Stage 2: standalone workspace (PLAN.md decision 10).
# Not a member of the platform root workspace; the root Cargo.toml excludes `os`.
[workspace]
resolver = "2"
members = ["init", "authority-stub", "shell"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

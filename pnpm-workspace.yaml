packages:
  # Top-level command packages
  - 'bin/*'
  - 'cmd/*'
  - 'cmd/*/*'
  - 'cmd/*/*/*'

  # Domain packages (connectors, kernels, agents are nested)
  - 'domains/*'
  - 'domains/*/*'
  - 'domains/*/*/*'
  - 'domains/*/*/*/*'

  # MCP packages
  - 'mcp/*'
  - 'mcp/*/*'

  # Infrastructure packages
  - 'infrastructure/*'
  - 'infrastructure/*/*'
  - 'infrastructure/*/*/*'

  # Internal @allternit/* TS libraries (consolidated into platform/packages/, S3)
  - 'platform/packages/*'
  - 'platform/packages/*/*'

  # Platform packages
  - 'platform/*'
  - 'platform/*/*'
  - 'platform/*/*/*'

  # Public SDK packages
  - 'sdk/*'

  # Standalone MCP servers (share the pinned MCP SDK catalog)
  - 'tools/mcp-servers/*'

  # Services (heavily nested)
  - 'services/*'
  - 'services/*/*'
  - 'services/*/*/*'
  - 'services/*/*/*/*'

  # Web / desktop surfaces
  - 'surfaces/*'
  - 'surfaces/*/*'
  - 'surfaces/*/*/*'
  - 'surfaces/*/*/*/*'
  - 'surfaces/allternit-extensions/allternit-extension/packages/*'

  # Exclusions
  - '!cmd/*/sdks'
  # Vendored third-party project with its own npm lockfile/scripts — see
  # services/open-connector/PROVENANCE.md. Managed via plain npm, not pnpm.
  - '!services/open-connector'
  - '!services/open-connector/**'
  # Vendored Docmost wiki — fully gitignored local checkout, managed via its
  # own pnpm-lock. Excluded so root pnpm does not ingest it as a package.
  - '!services/docmost'
  - '!services/docmost/**'
  # Vendored mailflare fork (agent email rail) — own npm package-lock and
  # OpenNext/Cloudflare build. Managed via plain npm, not pnpm.
  - '!services/mailflare'
  - '!services/mailflare/**'
  # Embeddable live-computer widget (Phase 5) — dependency-light static
  # package served as-is; own npm lockfile (typescript/vitest/ws devDeps).
  # See surfaces/computer-embed/README.md.
  - '!surfaces/computer-embed'
  - '!surfaces/computer-embed/**'
  # Motion cloud renderer — runs on the cloud-api host, installed there with
  # `npm ci` from its own package-lock (deploy-contabo.sh). Managed via plain
  # npm, not pnpm; cmd/*/*/* would otherwise pull it in and break the root
  # --frozen-lockfile install.
  - '!cmd/allternit-cloud-api/render/motion'
  - '!cmd/allternit-cloud-api/render/motion/**'
  # Desktop build output: prepare-office-engine writes resources/office-engine/package.json,
  # which surfaces/*/*/* would pick up as a workspace package and add an importer to the lockfile.
  - '!surfaces/allternit-desktop/resources/**'
  # Vendored Stagehand fork (Allternit Browser Runtime, Phase P0) — Node >=22.18
  # with its own pnpm workspace/lock. MUST stay separate from the root
  # workspace: the sibling @allternit/browser package is Node 18 and the two
  # toolchains must never merge. See its VENDORED.md.
  - '!infrastructure/chrome-stream/agent-systems/allternit-browser-runtime'
  - '!infrastructure/chrome-stream/agent-systems/allternit-browser-runtime/**'

# One pinned MCP SDK for the whole repo (MCP 2026-07-28, dual-era with the
# legacy initialize handshake). Every package references these as
# "catalog:" so the version cannot drift per package again. Bump here only.
catalog:
  '@modelcontextprotocol/server': 2.3.1
  '@modelcontextprotocol/client': 2.3.1
  '@modelcontextprotocol/core': 2.3.1
  '@modelcontextprotocol/ext-apps': 2.0.3
  # SDK v2 needs Zod >= 4.2 for tool schemas; packages still on Zod 3 keep their own range.
  zod: ^4.2.0

# pnpm 10 reads overrides from this file, not from package.json.
overrides:
  # gizzi-code runs react@19 (its ink-app is the one place the real React 19
  # types are load-bearing); the rest of the workspace stays on 18 types.
  '@allternit/gizzi-code>@types/react': ^19.2.18
  '@allternit/gizzi-code>@types/react-dom': ^19.2.7
  '@types/react': ^18.3.28
  '@types/react-dom': ^18.3.1
  '@types/express-serve-static-core': ^4.19.8
  '@reduxjs/toolkit': ^2.2.7
  react-redux: ^9.1.2
  redux: ^5.0.1
  # wxt 0.20 uses Rollup hook filters, which require Vite >= 6.3. Vite 5
  # silently ignores them, so wxt's download plugin then runs on every module
  # and `wxt prepare` fails with "Failed to parse URL from <entrypoint>".
  'wxt>vite': ^8.0.0
  # better-sqlite3 12.x does not compile on Node 26; 13.x ships compatible
  # prebuilt binaries.
  better-sqlite3: 13.0.3

onlyBuiltDependencies:
  - '@whiskeysockets/baileys'
  - better-sqlite3
  - canvas
  - electron
  - protobufjs
  - sharp
  - sqlite3

patchedDependencies:
  follow-redirects@1.15.11: patches/follow-redirects@1.15.11.patch
  webpack@5.106.2: patches/webpack@5.106.2.patch

# Release builds cross-compile (bun --compile) for every target on every
# runner, so platform-conditional optional deps (e.g. @opentui/core-*) must
# be installed for ALL OS/arch combos, not just the host's.
supportedArchitectures:
  os: [darwin, linux, win32]
  cpu: [arm64, x64]

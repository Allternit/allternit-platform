<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gizzi media check</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 14px system-ui, sans-serif; margin: 16px; background: #111; color: #eee; }
  video { width: 320px; border: 1px solid #444; display: block; }
  pre { white-space: pre-wrap; }
</style>
</head>
<body>
<!-- Stands in for a meeting page: asks for camera + mic like Meet does, shows
     the video, and measures the mic with an AnalyserNode. run.ts loads it with
     the same init script join.ts uses and reads window.__result. -->
<video id="v" autoplay muted playsinline></video>
<pre id="log"></pre>
<script>
const log = (m) => { document.getElementById("log").textContent += m + "\n"; };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

function frameHash(video, c) {
  const g = c.getContext("2d", { willReadFrequently: true });
  g.drawImage(video, 0, 0, c.width, c.height);
  const d = g.getImageData(0, 0, c.width, c.height).data;
  let h = 0;
  for (let i = 0; i < d.length; i += 4) h = (h * 31 + d[i] + d[i + 1] * 3 + d[i + 2] * 7) >>> 0;
  return h;
}

async function rms(analyser, ms) {
  const buf = new Float32Array(analyser.fftSize);
  let peak = 0;
  const end = performance.now() + ms;
  while (performance.now() < end) {
    analyser.getFloatTimeDomainData(buf);
    let s = 0;
    for (const x of buf) s += x * x;
    peak = Math.max(peak, Math.sqrt(s / buf.length));
    await sleep(50);
  }
  return peak;
}

async function run() {
  const r = { overrideInstalled: Boolean(window.__gizziMedia) };
  const devices = await navigator.mediaDevices.enumerateDevices();
  r.devices = devices.filter((d) => d.kind !== "audiooutput").map((d) => `${d.kind}:${d.label}`);

  const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
  const [vt] = stream.getVideoTracks();
  const [at] = stream.getAudioTracks();
  r.videoTrack = { readyState: vt?.readyState, deviceId: vt?.getSettings().deviceId };
  r.audioTrack = { readyState: at?.readyState, deviceId: at?.getSettings().deviceId };

  const video = document.getElementById("v");
  video.srcObject = new MediaStream([vt]);
  await video.play();
  await sleep(500);
  r.videoSize = `${video.videoWidth}x${video.videoHeight}`;
  const c = document.createElement("canvas");
  c.width = 160; c.height = 90;
  const hashes = [];
  for (let i = 0; i < 4; i++) { hashes.push(frameHash(video, c)); await sleep(400); }
  window.__gizziSetState("Paused");
  await sleep(400);
  hashes.push(frameHash(video, c));
  r.distinctFrames = new Set(hashes).size;
  r.framesDrawn = window.__gizziMedia.framesDrawn;

  const ac = new AudioContext();
  await ac.resume();
  const analyser = ac.createAnalyser();
  analyser.fftSize = 2048;
  ac.createMediaStreamSource(new MediaStream([at])).connect(analyser);
  r.silentRms = await rms(analyser, 600);
  const speaking = window.__gizziSpeak("/tone.wav");
  r.speakingRms = await rms(analyser, 800);
  r.speak = await speaking;
  // The cross-context MediaStream path and the analyser window hold ~100 ms of
  // the tail; give it 300 ms before checking the mic went quiet again.
  await sleep(300);
  r.afterRms = await rms(analyser, 400);
  return r;
}

run().then(
  (r) => { window.__result = r; log(JSON.stringify(r, null, 2)); },
  (e) => { window.__result = { error: String(e) }; log("ERROR " + e); },
);
</script>
</body>
</html>

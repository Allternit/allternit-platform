# https://mx.allternit.com/relay/ → allternit-mail-relay (127.0.0.1:8025).
# The worker calls it with MAIL_RELAY_SECRET; /relay/health is public.
server {
    listen 443 ssl;
    server_name mx.allternit.com;
    ssl_certificate /etc/letsencrypt/live/mx.allternit.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mx.allternit.com/privkey.pem;
    client_max_body_size 40m;

    location /relay/ {
        proxy_pass http://127.0.0.1:8025;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }
    location / {
        return 404;
    }
}

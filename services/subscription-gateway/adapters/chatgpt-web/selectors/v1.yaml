# chatgpt-web selectors v1 — §A3.2 named keys, ordered fallbacks
# (semantic role/accessible-name and data-testid first, CSS last).
# *** v1-unverified: written from public knowledge of the ChatGPT web UI,
# *** NOT yet validated against a logged-in session (Phase 3 manual gate).
# *** The conformance fixtures are shaped to THESE selectors, so selector drift
# *** against the real UI will show up first as fixture/UI mismatch at the gate.
# 2026-09-27 P3 gate, live logged-in UI: data-testids are gone from the
# composer/buttons; composer is role=textbox "Ask ChatGPT" (ProseMirror);
# send is button[type=submit] "Send" and only renders once the composer has
# text (idle shows "Start Voice"), and after a reply it is back but DISABLED
# (empty composer) in temp chats, and absent (voice button) in regular chats
# — hence completion.ignoreSend in adapter.ts; stop
# is button "Stop"; profile is button "Open profile menu". Turns: assistant
# [data-conversation-role=assistant] > [data-markdown-text-style=
# assistant-message]; user [data-user-message-bubble=true] (no author-role
# attribute any more).

composer:
  critical: true
  strategies:
    - { testid: prompt-textarea }
    - { role: textbox, name: /ask chatgpt|ask anything|message/i }
    - { css: "div#prompt-textarea[contenteditable=true]" }
    - { css: "div[contenteditable=true][role=textbox]" }
send_button:
  critical: true
  strategies:
    - { testid: send-button }
    - { role: button, name: /send prompt|^send$/i }
    - { css: "button[data-testid='send-button']" }
stop_button:
  critical: false
  strategies:
    - { testid: stop-button }
    - { role: button, name: /stop streaming|^stop$/i }
response:
  critical: true # extraction target; idle pages legitimately lack it (probe criticalKeys excludes it)
  strategies:
    - { css: "[data-markdown-text-style='assistant-message']" }
    - { css: "[data-conversation-role='assistant']" }
    - { css: "[data-message-author-role='assistant']" }
    - { css: "article[data-testid^='conversation-turn'] .markdown" }
user_turn:
  critical: false
  strategies:
    - { css: "[data-user-message-bubble='true']" }
    - { css: "[data-message-author-role='user']" }
streaming:
  critical: false
  strategies:
    - { css: ".result-streaming" }
    - { css: "[data-message-author-role='assistant'][data-streaming='true']" }
logged_in_probe:
  critical: true
  strategies:
    - { testid: profile-button }
    - { role: button, name: /profile|account menu/i }
    - { css: "nav button[aria-label*='rofile']" }
temp_chat_toggle:
  critical: false
  strategies:
    - { testid: temporary-chat-toggle }
    - { role: button, name: /temporary chat/i }
model_picker:
  critical: false
  strategies:
    - { testid: model-switcher-dropdown-button }
    - { role: button, name: /model/i }
image_result:
  critical: false
  strategies:
    - { testid: generated-image-gallery }
    - { testid: image-result }
    - { css: "[data-message-author-role='assistant'] [data-image-result]" }
banner:
  critical: false
  strategies:
    - { testid: limit-banner }
    - { role: alert }
challenge:
  critical: false
  strategies:
    - { css: "iframe[src*='challenges.cloudflare.com']" }
    - { text: /verify you are human/i }

# D11 — native progress surfaces (step lists, counter badges, partial tiles)
progress:steps:
  critical: false
  strategies:
    - { testid: progress-step }
    - { css: "[data-progress-step]" }
progress:counter:
  critical: false
  strategies:
    - { testid: progress-counter }
    - { css: "[data-progress-counter]" }
progress:partial_artifacts:
  critical: false
  strategies:
    - { css: "[data-testid='generated-image-preview'] img" }
    - { css: "[data-testid='image-result'] img" }

# §A3.4 — capability entry points (non-critical probe checks)
capability:chat:
  critical: false
  strategies:
    - { testid: prompt-textarea }
    - { role: textbox, name: /ask chatgpt|ask anything|message/i }
capability:image_tool_toggle:
  critical: false
  strategies:
    - { testid: image-tool-toggle }
    - { role: button, name: /^create image$|^image$/i }
# Live UI (2026-09-27): image mode is a composer menu entry, not a toggle —
# "+" (Add files and more) → plain-text "Create image" → a composer chip
# "Remove Create image" shows the mode is on. Images render as blob: URLs
# inside [data-testid=generated-image-gallery].
image_mode_active:
  critical: false
  strategies:
    - { role: button, name: /remove create image/i }
composer_plus:
  critical: false
  strategies:
    - { role: button, name: /add files and more/i }
image_menu_item:
  critical: false
  strategies:
    - { text: /^create image$/i }

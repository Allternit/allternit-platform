<!doctype html>
<!-- fixture: complete — full assistant turn, send enabled, no stop/streaming -->
<html lang="en">
  <head><meta charset="utf-8"><title>chatgpt-web fixture — complete</title></head>
  <body data-state="complete">
    <nav>
      <button data-testid="profile-button" aria-label="Profile">Eoj</button>
    </nav>
    <main>
      <div id="thread">
        <div data-message-author-role="user">Summarize the migration plan.</div>
        <div data-message-author-role="assistant">
          <h3>Migration plan</h3>
          <p>The migration happens in three stages, each independently reversible.</p>
          <pre><code class="language-ts">const stages: string[] = ["freeze", "move", "cutover"];</code></pre>
          <ul>
            <li>freeze writes</li>
            <li>move state</li>
            <li>cut over reads</li>
          </ul>
        </div>
      </div>
      <button data-testid="model-switcher-dropdown-button">GPT</button>
      <button data-testid="image-tool-toggle" aria-pressed="false">Create image</button>
      <button data-testid="temporary-chat-toggle" aria-pressed="false">Temporary chat</button>
      <div
        id="prompt-textarea"
        data-testid="prompt-textarea"
        role="textbox"
        aria-label="Ask anything"
        contenteditable="true"
      ></div>
      <button data-testid="send-button" aria-label="Send prompt" type="button">Send</button>
    </main>
    <script>
      document
        .querySelector("[data-testid='temporary-chat-toggle']")
        .addEventListener("click", (e) => {
          e.currentTarget.setAttribute("aria-pressed", "true");
          document.body.dataset.tempChat = "on";
        });
      document.querySelector("[data-testid='send-button']").addEventListener("click", () => {
        document.body.dataset.submitted = "true";
        // Like ChatGPT: Send takes the prompt out of the composer.
        document.getElementById("prompt-textarea").textContent = "";
      });
    </script>
  </body>
</html>

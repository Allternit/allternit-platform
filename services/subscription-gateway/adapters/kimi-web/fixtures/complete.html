<!doctype html>
<!-- fixture: complete — full assistant turn, no stop/streaming -->
<html lang="en">
  <head><meta charset="utf-8"><title>kimi-web fixture — complete</title></head>
  <body data-state="complete">
    <aside class="sidebar">
      <div class="sidebar-footer"><div class="user-info"><img class="avatar" alt="" /><span>Eoj</span></div></div>
    </aside>
    <main>
      <div id="thread">
        <div class="segment segment-user"><div class="segment-content">Summarize the migration plan.</div></div>
        <div class="segment segment-assistant">
          <div class="segment-content">
            <div class="markdown-container">
              <h3>Migration plan</h3>
              <p>The migration happens in three stages, each independently reversible.</p>
              <pre><code class="language-ts">const stages: string[] = ["freeze", "move", "cutover"];</code></pre>
              <ul>
                <li>freeze writes</li>
                <li>move state</li>
                <li>cut over reads</li>
              </ul>
            </div>
          </div>
        </div>
      </div>
      <div class="chat-input-editor" role="textbox" aria-label="Ask Anything..." contenteditable="true"></div>
      <div class="send-button-container"><button class="send-button" type="button" aria-label="Send">➤</button></div>
    </main>
    <script>
      document.querySelector(".send-button").addEventListener("click", () => {
        const input = document.querySelector(".chat-input-editor");
        const prompt = input.textContent;
        document.body.dataset.submitted = "true";
        // Like Kimi: Send clears the composer and shows the user turn.
        input.textContent = "";
        const turn = document.createElement("div");
        turn.className = "segment segment-user";
        turn.innerHTML = "<div class=\"segment-content\"></div>";
        turn.firstChild.textContent = prompt;
        document.getElementById("thread").appendChild(turn);
      });
    </script>
  </body>
</html>

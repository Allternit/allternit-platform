# kimi-web — Kimi web UI adapter (ui_bridge_web), §S2 shape.
# v1-unverified: origins/selectors/cookie written from public knowledge of the
# international Kimi site (kimi.ai now serves from www.kimi.com); NOT yet
# validated against a logged-in session. Probe the live UI after the owner's
# first login (SURFACES_PLAN step 6), then fix selectors/v1.yaml and the
# fixtures together. Mainland-only flows (+86 phone login) are out of scope.
adapter_id: kimi-web
adapter_version: 0.1.0
provider: kimi
interface: ui_bridge_web
origins:
  - https://www.kimi.com # app surface (chat, composer, threads under /chat/<id>)
  - https://kimi.com
  - https://www.kimi.ai # legacy international domain (redirects to www.kimi.com)
  - https://kimi.ai
auth:
  login_url: https://www.kimi.com/
  logged_in_probe: logged_in_probe
  # Set once signed in; the login watcher finishes a login when it appears in
  # the login browser. (unverified)
  session_cookies: [kimi-auth]
plans:
  - plan_id: free
    label: Adagio (free)
  - plan_id: moderato
    label: Moderato
  - plan_id: allegretto
    label: Allegretto
  - plan_id: allegro
    label: Allegro
  - plan_id: vivace
    label: Vivace
capabilities:
  - id: chat.create
    min_capability_version: 1
    plans: [free, moderato, allegretto, allegro, vivace]
    pool_id: chat-msgs
    detachable: false
    export_formats: []
    status: beta
  - id: chat.continue
    min_capability_version: 1
    plans: [free, moderato, allegretto, allegro, vivace]
    pool_id: chat-msgs
    detachable: false
    export_formats: []
    status: beta
pacing: # §A5 — same conservative defaults as chatgpt-web until real signals are observed
  min_action_gap_ms: [1200, 3500]
  min_task_gap_s: 8
  max_tasks_per_hour: 30
  max_tasks_per_day: 150
selectors_version: v1

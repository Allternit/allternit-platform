# slashy-web — Slashy web app (ui_bridge_web), §S2 shape.
# Slashy is the AI work/inbox assistant at www.slashy.com: a Firebase-auth web
# app whose non-marketing routes are the signed-in app (checked 2026-10-14).
# Selectors are v1-unverified guesses until the owner's first login.
adapter_id: slashy-web
adapter_version: 0.1.0
provider: slashy
interface: ui_bridge_web
origins:
  - https://www.slashy.com # Slashy web app (Firebase sign-in; non-marketing routes are the signed-in app). Selectors still unverified.
auth:
  login_url: https://www.slashy.com/
  logged_in_probe: logged_in_probe
  # UNCONFIRMED: no session cookie name is known for Slashy; confirm live.
  session_cookies: []
plans:
  - plan_id: subscriber
    label: Slashy subscription
capabilities:
  - id: chat.create
    min_capability_version: 1
    plans: [subscriber]
    pool_id: slashy-web
    detachable: false
    export_formats: []
    status: beta
  - id: chat.continue
    min_capability_version: 1
    plans: [subscriber]
    pool_id: slashy-web
    detachable: false
    export_formats: []
    status: beta
pacing:
  min_action_gap_ms: [1200, 3500]
  min_task_gap_s: 8
  max_tasks_per_hour: 30
  max_tasks_per_day: 150
selectors_version: v1

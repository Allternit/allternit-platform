<!doctype html>
<!-- fixture: idle — logged in, new chat, composer ready (gemini-web v1 shape, unverified) -->
<html lang="en">
  <head><meta charset="utf-8"><title>gemini-web fixture — idle</title></head>
  <body data-state="idle">
    <header>
      <button type="button" class="model-picker">Gemini 3</button>
      <button type="button" class="account-avatar" aria-label="Google Account: Eoj (eoj@example.com)"><img alt="" /></button>
    </header>
    <main>
      <div id="chat-history"></div>
      <rich-textarea>
        <div class="ql-editor textarea" role="textbox" aria-label="Enter a prompt here" contenteditable="true"></div>
      </rich-textarea>
      <button class="send-button" type="button" aria-label="Send message">➤</button>
    </main>
    <script>
      document.querySelector(".send-button").addEventListener("click", () => {
        const input = document.querySelector(".ql-editor");
        const prompt = input.textContent;
        document.body.dataset.submitted = "true";
        // Like Gemini: Send clears the composer and shows the user prompt bubble.
        input.textContent = "";
        const turn = document.createElement("div");
        turn.className = "user-prompt";
        turn.textContent = prompt;
        document.getElementById("chat-history").appendChild(turn);
      });
    </script>
  </body>
</html>

# gemini-web — Gemini (Google) web UI adapter (ui_bridge_web), §S2 shape.
# v1-unverified: origins/selectors/cookies written from public knowledge of the
# gemini.google.com app (custom-element rich-textarea composer, /app/<id>
# conversation URLs); NOT yet validated against a logged-in session. Probe the
# live UI after the owner's first login (SURFACES_PLAN step 6), then fix
# selectors/v1.yaml and the fixtures together.
adapter_id: gemini-web
adapter_version: 0.1.0
provider: google
interface: ui_bridge_web
origins:
  - https://gemini.google.com # app surface (composer on /app, conversations under /app/<id>)
  - https://accounts.google.com # Google account sign-in; the account session cookies land on .google.com
auth:
  login_url: https://gemini.google.com/app
  logged_in_probe: logged_in_probe
  # INFERRED (unverified): the Google account session (SID family) is set on
  # .google.com when the account signs in at accounts.google.com; the login
  # watcher finishes a login when one of these appears in the login browser.
  # Google rotates cookie names, so confirm the exact set live.
  session_cookies: [SID, __Secure-1PSID]
plans:
  - plan_id: free
    label: Free
  - plan_id: ai_pro
    label: Google AI Pro
  - plan_id: ai_ultra
    label: Google AI Ultra
capabilities:
  - id: chat.create
    min_capability_version: 1
    plans: [free, ai_pro, ai_ultra]
    pool_id: chat-msgs
    detachable: false
    export_formats: []
    status: beta
  - id: chat.continue
    min_capability_version: 1
    plans: [free, ai_pro, ai_ultra]
    pool_id: chat-msgs
    detachable: false
    export_formats: []
    status: beta
pacing: # §A5 — same conservative defaults as chatgpt-web until real signals are observed
  min_action_gap_ms: [1200, 3500]
  min_task_gap_s: 8
  max_tasks_per_hour: 30
  max_tasks_per_day: 150
selectors_version: v1

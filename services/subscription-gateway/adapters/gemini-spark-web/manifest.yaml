# gemini-spark-web — Gemini Spark (Google's 24/7 agent, beta, Google AI Ultra/Pro)
# inside the gemini.google.com web app (ui_bridge_web). Same app, sign-in and
# selectors as gemini-web; the only difference is the entry point: the side
# panel's "Spark" tab instead of "Chat". Spark runs as tasks on cloud VMs.
# v1-unverified: the Spark tab name, the task composer and the reply shape
# were read from public help/press pages, NOT a logged-in session. Probe the
# live UI after the owner's first login, then fix selectors/v1.yaml and the
# fixtures together.
adapter_id: gemini-spark-web
adapter_version: 0.1.0
provider: gemini-spark
interface: ui_bridge_web
origins:
  - https://gemini.google.com # app surface (Spark tab in the side panel)
  - https://accounts.google.com # Google account sign-in; cookies land on .google.com
auth:
  login_url: https://gemini.google.com/app
  logged_in_probe: logged_in_probe
  # INFERRED (unverified), same account cookies as gemini-web.
  session_cookies: [SID, __Secure-1PSID]
plans:
  - plan_id: ai_ultra
    label: Google AI Ultra
  - plan_id: ai_pro
    label: Google AI Pro
capabilities:
  - id: chat.create
    min_capability_version: 1
    plans: [ai_ultra, ai_pro]
    pool_id: gemini-spark-web
    detachable: false
    export_formats: []
    status: beta
  - id: chat.continue
    min_capability_version: 1
    plans: [ai_ultra, ai_pro]
    pool_id: gemini-spark-web
    detachable: false
    export_formats: []
    status: beta
pacing: # Spark tasks are slow cloud runs; keep the gateway's conservative defaults
  min_action_gap_ms: [1200, 3500]
  min_task_gap_s: 8
  max_tasks_per_hour: 30
  max_tasks_per_day: 150
selectors_version: v1

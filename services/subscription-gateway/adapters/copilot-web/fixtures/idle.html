<!doctype html>
<!-- fixture: idle — logged in, new chat, composer ready (copilot-web v1 shape, unverified) -->
<html lang="en">
  <head><meta charset="utf-8"><title>copilot-web fixture — idle</title></head>
  <body data-state="idle">
    <header>
      <button type="button" class="mode-picker">Auto</button>
      <img id="mectrl_headerPicture" alt="Eoj" aria-label="Account manager for Eoj" />
    </header>
    <main>
      <cib-serp>
        <div id="chat-turns"></div>
        <cib-text-input>
          <textarea data-testid="composer-input" aria-label="Ask me anything…"></textarea>
          <button class="send-button" type="submit" aria-label="Send">➤</button>
        </cib-text-input>
      </cib-serp>
    </main>
    <script>
      document.querySelector(".send-button").addEventListener("click", () => {
        const input = document.querySelector("textarea");
        const prompt = input.value;
        document.body.dataset.submitted = "true";
        // Like Copilot: Send clears the composer and shows the user turn.
        input.value = "";
        const turn = document.createElement("div");
        turn.className = "turn turn-user";
        turn.innerHTML = "<div class=\"msg-content\"></div>";
        turn.firstChild.textContent = prompt;
        document.getElementById("chat-turns").appendChild(turn);
      });
    </script>
  </body>
</html>

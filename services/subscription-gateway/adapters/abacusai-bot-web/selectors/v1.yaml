# abacusai-bot-web selectors v1 — §A3.2 named keys, ordered fallbacks.
# *** v1-unverified: the composer shape (textarea / contenteditable="true") is
# *** taken from the Abacus.AI web app's own probes; the send/stop labels are the
# *** app's English strings; the reply markup is NOT verified. Validate on a
# *** logged-in session before trusting any of these.

composer:
  critical: true
  strategies:
    - { css: 'textarea[placeholder]' }
    - { css: '[contenteditable="true"]' }
    - { css: 'textarea' }
send_button:
  critical: true
  strategies:
    - { role: button, name: /^send$/i }
    - { css: 'button[aria-label="Send"]' }
stop_button:
  critical: false
  strategies:
    - { role: button, name: /^stop$/i }
    - { css: 'button[aria-label="Stop"]' }
response:
  critical: true # extraction target; idle pages legitimately lack it
  strategies:
    - { css: '[data-slot="assistant-message"]' }
    - { css: '[data-role="assistant"]' }
user_turn:
  critical: false
  strategies:
    - { css: '[data-slot="user-message"]' }
    - { css: '[data-role="user"]' }
streaming:
  critical: false
  strategies:
    - { css: '[data-streaming="true"]' }
logged_in_probe:
  critical: true
  # Unverified: a signed-in bot page renders the composer; the sign-in page does not.
  strategies:
    - { css: 'textarea, [contenteditable="true"]' }
logged_out_probe:
  critical: false
  strategies:
    - { role: button, name: /sign in|log in/i }

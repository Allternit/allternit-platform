# abacusai-bot-web — Abacus.AI bot web app adapter (ui_bridge_web), §S2 shape.
# v1-unverified: origins/selectors written from the public apps.abacus.ai web
# app and its source (composer is a textarea/contenteditable; sign-in is the
# apps.abacus.ai account). NOT yet validated against a logged-in session. Probe the
# live UI after the owner's first login, then fix selectors/v1.yaml and the
# fixtures together.
# Route: the user's own Abacus.AI account, signed in inside Allternit's login
# browser (never read from the user's normal browser). The bot's chat is the same
# page the Abacus.AI web client uses; the page's own session does the work.
adapter_id: abacusai-bot
adapter_version: 0.1.0
provider: abacusai
interface: ui_bridge_web
origins:
  - https://apps.abacus.ai # app surface: bot chat at /bot/, sign-in, same-origin host proxy /api/botHost/<id>
auth:
  login_url: https://apps.abacus.ai/bot/
  logged_in_probe: logged_in_probe
  # Cookie names unknown (not read from source); the login watcher finishes a
  # login when logged_in_probe matches in the login browser. Confirm live.
  session_cookies: []
plans:
  - plan_id: subscription
    label: Abacus.AI account
capabilities:
  - id: chat.create
    min_capability_version: 1
    plans: [subscription]
    pool_id: abacusai-bot-web
    detachable: false
    export_formats: []
    status: beta
  - id: chat.continue
    min_capability_version: 1
    plans: [subscription]
    pool_id: abacusai-bot-web
    detachable: false
    export_formats: []
    status: beta
pacing: # §A5 — same conservative defaults as kimi-web until real signals are observed
  min_action_gap_ms: [1200, 3500]
  min_task_gap_s: 8
  max_tasks_per_hour: 30
  max_tasks_per_day: 150
selectors_version: v1

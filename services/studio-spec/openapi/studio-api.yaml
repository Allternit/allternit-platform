openapi: 3.0.3
info:
  title: Freeweights Studio host API
  version: 1.0.0
  description: |
    Served by each computer's allternit-api under /api/v1/studio. One job runs
    per computer at a time. Job spec v1 is described in the allternit-studio-spec
    crate (src/spec.rs). Errors are always {error, message}.

    Host error codes (the `error` field), by status:
    - 401 unauthorized: no signed-in caller.
    - 404 not_found (no such job), unknown_engine (no such engine),
      no_output (the job has no output of that kind).
    - 409 job_running (another job runs on this computer), already_finished
      (cancel on a finished job), job_not_succeeded (register before success).
    - 422 the spec codes listed on POST /jobs, plus the hardware codes
      (hardware_not_supported, method_not_supported, backend_not_supported,
      output_not_supported), engine_not_installed and manifest_mismatch.
      The message of a hardware code is the host's reason, shown as is
      (never replaced by fixed client copy).
    - 503 hardware_unavailable: the computer's training device cannot be
      used right now (driver not loaded, device lost); the message says what
      the host saw.
    - 501 not_available: this build cannot install that engine.
    - 502 local_engine_unreachable, register_failed: the local-engine service
      did not take the output.
servers:
  - url: /api/v1/studio
paths:
  /engines:
    get:
      summary: List engines and their install state
      operationId: listEngines
      responses:
        '200':
          description: Engines
          content:
            application/json:
              schema:
                type: object
                required: [engines]
                properties:
                  engines:
                    type: array
                    items: { $ref: '#/components/schemas/EngineInfo' }
  /engines/{id}/install:
    post:
      summary: Install an engine (venv process), idempotent
      operationId: installEngine
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '202':
          description: Install started or already installed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EngineInfo' }
        '404':
          description: No such engine (error unknown_engine)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '422':
          description: This computer cannot run the engine (error hardware_not_supported; message is fit.reason)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '501':
          description: This build cannot install the engine (error not_available)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /jobs:
    post:
      summary: Create a job from a job spec v1
      operationId: createJob
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobSpec' }
      responses:
        '201':
          description: Job created (state queued)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '409':
          description: A job is already running on this computer (error job_running)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '503':
          description: |
            The training device cannot be used right now (error
            hardware_unavailable), e.g. the GPU driver did not load. The
            message says what the host saw.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '422':
          description: |
            Spec refused. error is one of rented_not_available,
            publish_not_available, unknown_engine, unknown_method,
            unsupported_spec_version, invalid_base, invalid_dataset,
            invalid_spec (spec checks); hardware checks with the reasons in
            the engine's fit: hardware_not_supported (this computer cannot
            train with the engine at all), method_not_supported (the method is
            in fit.methods_unavailable), backend_not_supported
            (resources.backend cannot be used here, e.g. mlx off a Mac),
            output_not_supported (an output in fit.outputs_unavailable, e.g.
            outputs.mlx off a Mac); or from the host: engine_not_installed
            (install it first), manifest_mismatch (base.manifest_sha256 is not the sha256
            of the signed Freeweights manifest the base model is fetched with,
            the repo has no signed manifest at that revision, or it could not
            be checked). A manifest that changes after the job is accepted
            fails the job while preparing, before any file downloads.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
    get:
      summary: List jobs, newest first
      operationId: listJobs
      responses:
        '200':
          description: Jobs
          content:
            application/json:
              schema:
                type: object
                required: [jobs]
                properties:
                  jobs:
                    type: array
                    items: { $ref: '#/components/schemas/Job' }
  /jobs/{id}:
    get:
      summary: One job
      operationId: getJob
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: Job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '404': { $ref: '#/components/responses/Error' }
  /jobs/{id}/events:
    get:
      summary: Events after a sequence number (polled)
      operationId: listJobEvents
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - name: after
          in: query
          description: Return events with seq greater than this. Default 0.
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Events in seq order, plus the current state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventsPage' }
        '404': { $ref: '#/components/responses/Error' }
  /jobs/{id}/cancel:
    post:
      summary: Cancel a job that has not finished
      operationId: cancelJob
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: Job now cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /jobs/{id}/outputs:
    get:
      summary: Files the job produced
      operationId: listJobOutputs
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: Outputs
          content:
            application/json:
              schema:
                type: object
                required: [outputs]
                properties:
                  outputs:
                    type: array
                    items: { $ref: '#/components/schemas/JobOutput' }
        '404': { $ref: '#/components/responses/Error' }
  /jobs/{id}/outputs/register:
    post:
      summary: Register one output as a local model (local-engine studio_output source)
      operationId: registerJobOutput
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind: { type: string, enum: [adapter, merged, gguf, mlx] }
                name: { type: string }
      responses:
        '200':
          description: Registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  model_id: { type: string }
        '404':
          description: No such job, or no output of that kind (error not_found, no_output)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          description: The job has not succeeded (error job_not_succeeded)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '502':
          description: local-engine did not take the output (error local_engine_unreachable, register_failed)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
  schemas:
    ApiError:
      type: object
      required: [error, message]
      properties:
        error: { type: string }
        message: { type: string }
    EngineInfo:
      type: object
      required: [id, name, license, version, methods, hardware, install_state]
      properties:
        id: { type: string }
        name: { type: string }
        license: { type: string }
        version: { type: string }
        methods: { type: array, items: { type: string, enum: [lora, qlora, full, dpo] } }
        hardware: { type: array, items: { $ref: '#/components/schemas/Hardware' } }
        install_state: { type: string, enum: [not_installed, installing, installed, failed] }
        limits: { type: object, additionalProperties: true }
        published: { type: boolean }
        source:
          type: object
          description: Where the host installs the engine's adapter from (third-party engines). The upstream engine itself is installed unmodified at `version`.
          required: [repo, sha]
          properties:
            repo: { type: string, description: Public git repository of the engine kit and adapter }
            sha: { type: string, description: Full commit sha the host installs }
        process: { type: string, enum: [embedded, separate_process] }
        default: { type: boolean }
        backends:
          type: array
          items:
            type: object
            required: [id, status]
            properties:
              id: { type: string }
              status: { type: string, enum: [planned, available, pending_decision] }
        notes: { type: string, description: Plain words shown on the card }
        fit:
          $ref: '#/components/schemas/Fit'
          description: Host only (GET /engines, install). What this computer can do with the engine.
    Hardware:
      type: string
      enum: [apple-silicon, cuda-linux, cuda-windows, rocm-linux, xpu-linux, xpu-windows, cpu]
      description: |
        Every computer maps to one id; the host detects it. AMD GPUs on
        Windows and Intel Macs map to cpu, with the reason in fit.reason.
    Fit:
      type: object
      required: [ok, hardware, reason, methods_unavailable, outputs_unavailable]
      properties:
        ok: { type: boolean, description: 'false = the engine does not run here at all (hardware_not_supported)' }
        hardware: { $ref: '#/components/schemas/Hardware' }
        backend:
          type: string
          enum: [mlx, torch-mps, torch-cuda, torch-rocm, torch-xpu, torch-cpu]
          description: Backend of the first method that runs here (resources.backend auto). On a Mac LoRA/QLoRA use mlx, full/DPO torch-mps.
        reason: { type: string, description: Plain words, shown as is }
        warning: { type: string, description: 'Shown before start when the job runs but slowly (cpu)' }
        methods_unavailable:
          type: object
          additionalProperties: { type: string }
          description: method -> reason (method_not_supported). On cpu only lora runs.
        outputs_unavailable:
          type: object
          additionalProperties: { type: string }
          description: output kind -> reason (output_not_supported). mlx is Apple Silicon only.
    JobSpec:
      type: object
      additionalProperties: false
      required: [spec_version, engine, base, dataset, method, resources]
      properties:
        spec_version: { type: integer, enum: [1] }
        engine: { type: string }
        engine_version: { type: string }
        base:
          type: object
          description: Exactly one of repo or path (invalid_base otherwise).
          properties:
            repo: { type: string }
            path: { type: string, description: 'Absolute path (or ~/...) to a model folder on the computer that runs the job' }
            revision: { type: string }
            manifest_sha256:
              type: string
              pattern: '^[0-9a-fA-F]{64}$'
              description: |
                Optional pin: sha256 of the signed Freeweights manifest bytes
                for base.repo. The host refuses a job whose base model is not
                fetched with exactly that manifest (error manifest_mismatch).
        dataset:
          type: object
          required: [format]
          description: Exactly one of repo or path.
          properties:
            repo: { type: string }
            path: { type: string }
            revision: { type: string }
            format: { type: string }
        method: { type: string, enum: [lora, qlora, full, dpo] }
        params: { type: object, additionalProperties: true }
        resources:
          type: object
          required: [place]
          properties:
            place: { type: string, enum: [local, paired, compute, rented], description: 'rented is refused (rented_not_available)' }
            gpu: { type: string }
            max_hours: { type: number }
            max_usd: { type: number }
            backend:
              type: string
              enum: [auto, torch, mlx]
              default: auto
              description: 'auto: on a Mac MLX for lora/qlora and PyTorch (MPS) for full/dpo; PyTorch elsewhere. mlx off a Mac, or for full/dpo, is refused (backend_not_supported).' 
        outputs:
          type: object
          properties:
            adapter: { type: boolean }
            merged: { type: boolean }
            gguf: { type: array, items: { type: string } }
            mlx: { type: boolean, description: 'Apple Silicon only (output_not_supported elsewhere)' }
        eval:
          type: object
          properties:
            sets: { type: array, items: { type: string } }
            baseline: { type: string }
        publish:
          type: object
          description: Any publish block is refused (publish_not_available).
    JobState:
      type: string
      enum: [queued, preparing, running, exporting, succeeded, failed, cancelled]
    JobOutput:
      type: object
      required: [kind, path]
      properties:
        kind: { type: string, enum: [adapter, merged, gguf, mlx] }
        path: { type: string, description: Absolute path on the computer that ran the job }
        bytes: { type: integer }
    Job:
      type: object
      required: [id, state, spec, created_at]
      properties:
        id: { type: string }
        state: { $ref: '#/components/schemas/JobState' }
        spec: { $ref: '#/components/schemas/JobSpec' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time, nullable: true }
        error: { type: string, nullable: true }
        last_seq: { type: integer }
        backend: { type: string, description: 'Backend the host picked for this job (from check_job), e.g. mlx, torch-mps, torch-cuda. Absent on jobs made by older hosts.' }
        outputs:
          type: array
          items: { $ref: '#/components/schemas/JobOutput' }
    JobEvent:
      type: object
      required: [seq, at, kind, message]
      properties:
        seq: { type: integer, minimum: 1, description: Strictly increasing per job }
        at: { type: string, format: date-time }
        kind: { type: string, enum: [state, log, progress, output, error] }
        message: { type: string }
        progress: { type: number, minimum: 0, maximum: 1 }
    EventsPage:
      type: object
      required: [state, events]
      properties:
        state: { $ref: '#/components/schemas/JobState' }
        events:
          type: array
          items: { $ref: '#/components/schemas/JobEvent' }

[package]
name = "voice-service"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { workspace = true }
axum = { workspace = true, features = ["multipart"] }
serde = { workspace = true }
serde_json = { workspace =true }
reqwest = { workspace = true, features = ["rustls-tls", "stream"] }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
chrono = { workspace = true, features = ["serde"] }
tower-http = { workspace = true, features = ["cors"] }
tempfile = { workspace = true }
sherpa-onnx = "1.13"
sha2 = "0.10"
tar = { workspace = true }
bzip2 = { version = "0.4", features = ["static"] }
tokio-stream = { workspace = true }
futures-util = { workspace = true }
# Voice Session Smart Turn: runs on sherpa-onnx's own onnxruntime (no second copy).
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "alternative-backend", "api-24"] }

[dev-dependencies]
tower = { workspace = true }
tokio-tungstenite = { workspace = true }

# The bench reads peak RSS via getrusage.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[[example]]
name = "voice_bench"
path = "examples/voice_bench.rs"

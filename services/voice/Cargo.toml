[package]
name = "voice-service"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { workspace = true }
axum = { workspace = true, features = ["multipart"] }
serde = { workspace = true }
serde_json = { workspace =true }
reqwest = { workspace = true, features = ["json", "rustls-tls", "multipart"] }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
chrono = { workspace = true, features = ["serde"] }
tower-http = { workspace = true, features = ["cors"] }
tempfile = { workspace = true }
futures-util = { workspace = true }
# Voice Session Smart Turn: runs on sherpa-onnx's own onnxruntime (no second copy).
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "alternative-backend", "api-24"], optional = true }
sha2 = { version = "0.10", optional = true }

[features]
# Voice Session engine over the Phase 1 sherpa-onnx engine (crate::stt/tts/models).
sherpa = ["dep:ort", "dep:sha2"]

[dev-dependencies]
tower = { workspace = true }
tokio-tungstenite = { workspace = true }

# Core dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
anyhow = "1.0"
thiserror = "1.0"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
tempfile = "3.8"
once_cell = "1.19"

# HTTP/Web
tower = { version = "0.5" }
tower-http = { version = "0.6", features = ["fs"] }
axum = { version = "0.7", features = ["ws", "http1", "http2"] }
reqwest = { version = "0.12", features = ["json", "stream", "blocking"] }
urlencoding = "2.1"
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-tungstenite = "0.21"
http = "1.0"
http-body-util = "0.1"
hyper = { version = "1.0", features = ["full"] }

# Docker
bollard = "0.15"

# Crypto/Security
base64 = "0.22"
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
blake3 = "1.5"
ed25519-dalek = { version = "2.0", features = ["std", "rand_core"] }
ring = "0.17"
data-encoding = "2.0"
hex = "0.4"

# Async/Futures
futures = "0.3"
futures-util = "0.3"
async-stream = "0.3"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "postgres"] }
redis = { version = "0.24", features = ["aio", "tokio-comp"] }

lru = "0.12"
qdrant-client = "1.9"

# WASM
wasmtime = "21.0"
wasmtime-wasi = "21.0"
wit-bindgen = "0.36"
wit-component = "0.21"

# Utils
semver = "1.0"
rand = "0.8"
regex = "1.0"
clap = { version = "4.0", features = ["derive", "env"] }
portable-pty = "0.8"
which = "6.0"
walkdir = "2.5"
dirs = "5.0"
bytes = "1.5"
lazy_static = "1.4"
serde_yaml = "0.9"
toml = "0.8"
tar = "0.4"
flate2 = "1.0"
indicatif = "0.17"
zstd = "0.13"

# Terminal
crossterm = "0.27"
ratatui = "0.26"

# Testing
tokio-test = "0.4"

# Scheduling
tokio-cron-scheduler = "0.10"
cron = "0.15"

# OpenTelemetry
# Consistent pre-1.0 set: tracing-opentelemetry 0.23 requires opentelemetry
# 0.22; opentelemetry_sdk and opentelemetry-http are pinned to match.
opentelemetry = { version = "0.22", features = ["trace"] }
opentelemetry_sdk = { version = "0.22", features = ["trace", "rt-tokio"] }
opentelemetry-http = "0.12"
tracing-opentelemetry = "0.23"

# API Documentation
utoipa = { version = "4.2", features = ["uuid", "chrono"] }

# Metrics
prometheus = "0.13"

# Validation
validator = { version = "0.18", features = ["derive"] }
serde_bytes = "0.11"

# Extism
extism = "1.0"
extism-convert = "1.0"
extism-convert-macros = "1.0"

# ACP
agent-client-protocol-schema = "0.10.8"
extism-manifest = "1.0"

# gRPC / Protocol Buffers
tonic = "0.12"
prost = "0.13"
prost-types = "0.13"
tonic-build = "0.12"
protoc-bin-vendored = "3"

# Vendored engine crates
# factory/pane (allternit-factory-pane, the herdr v0.9.0 fork) requires a patched
# portable-pty 0.9.0.
# Patches apply version-specifically: only dependents requesting portable-pty
# 0.9.x resolve to this; members pinned to 0.8 (allternit-mux, vps-node, ...)
# keep crates.io 0.8 and are unaffected.
[patch.crates-io]
portable-pty = { path = "factory/pane/vendor/portable-pty" }

# `allternit-bot` ships as one small static binary (.github/workflows/publish-allternit-bot.yml).
[profile.bot-dist]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

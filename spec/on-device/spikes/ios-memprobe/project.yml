name: MemProbe
options:
  bundleIdPrefix: com.allternit.spike
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: MQ85968PQP
    CODE_SIGN_STYLE: Automatic
targets:
  MemProbeBase:
    type: application
    platform: iOS
    sources: [Sources]
    entitlements:
      path: Base.entitlements
      properties: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.allternit.spike.memprobe
        PRODUCT_NAME: MemProbeBase
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: MemProbe Base
  MemProbeInc:
    type: application
    platform: iOS
    sources: [Sources]
    entitlements:
      path: Inc.entitlements
      properties:
        com.apple.developer.kernel.increased-memory-limit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.allternit.spike.memprobe.inc
        PRODUCT_NAME: MemProbeInc
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: MemProbe Inc
  MemProbeIncEva:
    type: application
    platform: iOS
    sources: [Sources]
    entitlements:
      path: IncEva.entitlements
      properties:
        com.apple.developer.kernel.increased-memory-limit: true
        com.apple.developer.kernel.extended-virtual-addressing: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.allternit.spike.memprobe.inceva
        PRODUCT_NAME: MemProbeIncEva
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: MemProbe Inc+EVA

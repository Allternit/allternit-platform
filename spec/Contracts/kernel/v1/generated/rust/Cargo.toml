[package]
name = "allternit-kernel-abi"
version = "1.0.0"
edition = "2021"
description = "Generated serde types for Allternit Kernel ABI Package 1.0.0 (frozen 2026-09-30). Normative source: spec/Contracts/kernel/v1/schemas."
license = "UNLICENSED"
publish = false

# Standalone: deliberately NOT a member of the repo root workspace (root Cargo.toml/Cargo.lock untouched).
[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regress = "0.10"  # typify emits pattern validation via regress


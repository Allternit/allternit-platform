{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sandboxes.serviceAccountName" . }}
  labels:
    {{- include "sandboxes.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Workers never call the Kubernetes API.
automountServiceAccountToken: false
{{- end }}

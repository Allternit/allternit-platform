{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "agents-server.serviceAccountName" . }}
  labels:
    {{- include "agents-server.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The server never calls the Kubernetes API.
automountServiceAccountToken: false
{{- end }}

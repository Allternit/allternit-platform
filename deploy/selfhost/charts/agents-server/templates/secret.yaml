{{- if .Values.secret.create }}
# Test convenience only (secret.create). Created as a hook so the migrate Job
# can read it before the release's normal resources exist.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agents-server.secretName" . }}
  labels:
    {{- include "agents-server.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation
type: Opaque
stringData:
  {{- range $k, $v := .Values.secret.values }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}

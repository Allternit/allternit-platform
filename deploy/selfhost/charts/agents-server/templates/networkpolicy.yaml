{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy }}
# Applies to the server and the migrate Job pods. Ingress: the API port from
# the sandboxes workers and ingressFrom; metrics from metricsFrom. Egress:
# DNS, the database, the model provider and the OTel collector only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agents-server.fullname" . }}
  labels:
    {{- include "agents-server.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "agents-server.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - port: {{ .Values.service.port }}
          protocol: TCP
      from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: allternit-selfhost
              app.kubernetes.io/component: worker
        {{- with $np.ingressFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    {{- if and .Values.metrics.enabled $np.metricsFrom }}
    - ports:
        - port: {{ .Values.metrics.port }}
          protocol: TCP
      from:
        {{- toYaml $np.metricsFrom | nindent 8 }}
    {{- end }}
  egress:
    {{- if $np.dns.enabled }}
    - to:
        {{- toYaml $np.dns.to | nindent 8 }}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- end }}
    {{- with $np.database.to }}
    - to:
        {{- toYaml . | nindent 8 }}
      ports:
        - port: {{ $np.database.port }}
          protocol: TCP
    {{- end }}
    {{- with $np.provider.to }}
    - to:
        {{- toYaml . | nindent 8 }}
      ports:
        {{- range $np.provider.ports }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
    {{- end }}
    {{- with $np.otel.to }}
    - to:
        {{- toYaml . | nindent 8 }}
      ports:
        {{- range $np.otel.ports }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
    {{- end }}
    {{- with $np.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}

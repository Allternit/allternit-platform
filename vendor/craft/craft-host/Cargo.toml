[package]
name = "craft-host"
version = "0.1.0"
edition = "2021"
description = "Allternit craft:1 host-page bridge for embedded craft editors (WASM postMessage protocol)"
license = "MIT OR Apache-2.0"

[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "Window",
  "MessageEvent",
  "Location",
] }

[dev-dependencies]
serde_json = "1"

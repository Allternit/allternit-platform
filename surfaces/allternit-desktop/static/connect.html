<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Allternit</title>
  <!--
    Where Allternit runs: the fallback shown only when the app can't load the
    workspace (main-window load failure, or tray > Connection Settings before
    the workspace is up). Otherwise the tray opens Settings > Computers in the
    app. Design: "Desktop pairing screens redesign" (2026-11-18).
    IPC: window.allternit.connection.{getBackend,test,setBackend}. This page is
    trusted by its file URL (security.ts getAppFileUrls).
  -->
  <style>
    :root {
      --bg: #FFFFFF;
      --elev: #FFFFFF;
      --text: #1F1E1D;
      --text-2: #6B6A68;
      --text-3: #8F8D8A;
      --fill: color-mix(in srgb, var(--text) 5%, transparent);
      --fill-strong: color-mix(in srgb, var(--text) 9%, transparent);
      --hair: color-mix(in srgb, var(--text) 12%, transparent);
      --success: #22c55e;
      --error: #ef4444;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #232322;
        --elev: #2C2C2B;
        --text: #ECECEB;
        --text-2: #A3A29F;
        --text-3: #7C7B78;
        --success: #4ade80;
        --error: #f87171;
      }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: 'Allternit Sans', Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }
    .panel {
      width: 440px;
      max-width: 100%;
      height: min(590px, 100vh);
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 28px 32px 24px;
    }
    .brand { display: flex; justify-content: center; margin-bottom: 16px; }
    .wordmark { width: 120px; height: auto; }
    .wordmark rect:not([fill="#D97757"]) { fill: var(--text); }
    .title { font-size: 15px; font-weight: 600; line-height: 1.4; }
    .hint { font-size: 12px; line-height: 1.5; color: var(--text-2); }
    .choice {
      display: flex; flex-direction: column; gap: 4px; width: 100%;
      border-radius: 12px; padding: 14px; cursor: pointer;
      background: var(--fill); border: 1.5px solid transparent;
    }
    .choice.on { background: var(--elev); border-color: var(--text); }
    .choice:has(.sr-only:focus-visible) { outline: 2px solid color-mix(in srgb, var(--text) 30%, transparent); outline-offset: 2px; }
    .choice-head { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; line-height: 1.4; }
    .radio { width: 16px; height: 16px; flex-shrink: 0; border-radius: 50%; border: 1.5px solid var(--hair); display: flex; align-items: center; justify-content: center; }
    .choice.on .radio { border-color: var(--text); }
    .choice.on .radio::after { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--text); }
    .choice-body { padding-left: 24px; font-size: 12px; line-height: 1.625; color: var(--text-2); }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    .server-url {
      display: none; margin: 4px 0 0 24px; height: 36px; border-radius: 8px; padding: 0 12px;
      background: var(--elev); color: var(--text); border: 1px solid var(--hair);
      font: inherit; font-size: 13px; outline: none;
    }
    .server-url:focus { border-color: var(--text-3); }
    .choice.on .server-url { display: block; }
    .result { font-size: 12px; line-height: 1.5; }
    .result[hidden] { display: none; }
    .result.checking { display: flex; align-items: center; gap: 8px; color: var(--text-2); }
    .result.ok { display: flex; align-items: center; gap: 8px; border-radius: 8px; background: var(--fill); padding: 8px 12px; }
    .result.fail {
      border-radius: 8px; padding: 8px 12px;
      background: color-mix(in srgb, var(--error) 7%, transparent);
      border: 1px solid color-mix(in srgb, var(--error) 35%, transparent);
    }
    .spinner { width: 12px; height: 12px; flex-shrink: 0; border-radius: 50%; border: 2px solid var(--text-3); border-top-color: var(--text); animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2.4s; } }
    .ok-dot { width: 8px; height: 8px; flex-shrink: 0; border-radius: 50%; background: var(--success); }
    .actions { margin-top: auto; display: flex; gap: 8px; }
    .btn {
      flex: 1; display: inline-flex; align-items: center; justify-content: center;
      height: 36px; border-radius: 9999px; border: 0; padding: 0 16px;
      font: inherit; font-size: 13px; cursor: pointer; transition: opacity 0.15s ease, background-color 0.15s ease;
    }
    .btn.primary { background: var(--text); color: var(--elev); font-weight: 500; }
    .btn.primary:hover { opacity: 0.9; }
    .btn.quiet { background: var(--fill); color: var(--text); padding: 0 14px; }
    .btn.quiet:hover { background: var(--fill-strong); }
    .btn:disabled, .btn:disabled:hover { cursor: default; opacity: 0.6; }
    .btn:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
    .footer { text-align: center; font-size: 11px; color: var(--text-3); }
    .footer a { color: inherit; text-decoration: underline; text-underline-offset: 2px; }
  </style>
</head>
<body>
  <main class="panel">
    <div class="brand"><svg class="wordmark" width="120" height="12" role="img" aria-label="Allternit" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 510 50" shape-rendering="geometricPrecision"><rect x="20.75" y="20.75" width="8.5" height="8.5" rx="1.5" fill="#D97757"/><rect x="20.75" y="0.75" width="8.5" height="8.5" rx="1.5" fill="#141413"/><rect x="10.75" y="10.75" width="8.5" height="8.5" rx="1.5" fill="#141413"/><rect x="30.75" y="10.75" width="8.5" height="8.5" rx="1.5" fill="#141413"/><rect x="0.75" y="20.75" width="8.5" height="8.5" rx="1.5" fill="#141413"/><rect x="10.75" y="20.75" width="8.5" height="8.5" rx="1.5" fill="#141413"/><rect x="30.75" y="20.75" width="8.5" height="8.5" rx="1.5" fill="#141413"/><rect x="40.75" y="20.75" width="8.5" height="8.5" rx="1.5" fill="#141413"/><rect x="0.75" y="30.75" width="8.5" height="8.5" rx="1.5" fill="#141413"/><rect x="40.75" y="30.75" width="8.5" height="8.5" rx="1.5" fill="#141413"/><rect x="0.75" y="40.75" width="8.5" height="8.5" rx="1.5" fill="#141413"/><rect x="40.75" y="40.75" width="8.5" height="8.5" rx="1.5" fill="#141413"/><rect x="60.75" y="10.75" width="8.5" height="8.5" rx="1.5" fill="#141413"/><rect x="60.75" y="30.75" width="8.5" height="8.5" rx="1.5" fill="#141413"/><rect x="80.75" y="30.75" width="8.5" height="8.5" rx="1.5" fill="#141413"/><rect x="80.75" y="40.75" width="8.5" height="8.5" rx="1.5" fill="#141413"/><rect x="90.75" y="20.75" width="8.5" height="8.5" rx="1.5" fill="#141413"/><rect x="100.75" y="0.75" width="8.5" height="8.5" rx="1.5" fill="#141413"/><rect x="100.75" y="10.75" width="8.5" height="8.5" rx="1.5" fill="#141413"/><rect x="120.75" y="30.75" width="8.5" height="8.5" rx="1.5" fill="#141413"/><rect x="120.75" y="40.75" width="8.5" height="8.5" rx="1.5" fill="#141413"/><rect x="130.75" y="20.75" width="8.5" height="8.5" rx="1.5" fill="#141413"/><rect x="140.75" y="0.75" width="8.5" height="8.5" rx="1.5" fill="#141413"/><rect x="140.75" y="10.75" width="8.5" height="8.5" rx="     <p class="title">Where Allternit runs</p>
    <p class="hint">Pick where this app gets its engine. Most people keep "On this computer".</p>
    <div role="radiogroup" aria-label="Where Allternit runs" style="display:flex;flex-direction:column;gap:12px">
      <label class="choice on" id="choice-here">
        <input class="sr-only" type="radio" name="mode" value="here" checked>
        <span class="choice-head"><span class="radio"></span>On this computer</span>
        <span class="choice-body">Uses the engine built into Allternit Desktop. Nothing to set up.</span>
      </label>
      <label class="choice" id="choice-server">
        <input class="sr-only" type="radio" name="mode" value="server">
        <span class="choice-head"><span class="radio"></span>On my Allternit server or cloud computer</span>
        <span class="choice-body">For an Allternit engine on a server you run, or on your Allternit cloud computer.</span>
        <input class="server-url" id="server-url" type="url" inputmode="url" spellcheck="false" autocomplete="off" placeholder="https://allternit.example.com" aria-label="Server address">
      </label>
    </div>
    <p class="result" id="result" hidden></p>
    <div class="actions">
      <button type="button" class="btn quiet" id="check-btn">Check</button>
      <button type="button" class="btn primary" id="save-btn">Save and restart</button>
    </div>
    <p class="footer"><a href="#" id="docs-link">How to run your own server</a></p>
  </main>

  <script>
    (function () {
      var connection = window.allternit && window.allternit.connection;
      var shell = window.allternit && window.allternit.shell;
      var mode = 'here';
      var busy = false;
      var hereChoice = document.getElementById('choice-here');
      var serverChoice = document.getElementById('choice-server');
      var urlInput = document.getElementById('server-url');
      var result = document.getElementById('result');
      var checkBtn = document.getElementById('check-btn');
      var saveBtn = document.getElementById('save-btn');

      function setMode(next) {
        mode = next;
        hereChoice.classList.toggle('on', mode === 'here');
        serverChoice.classList.toggle('on', mode === 'server');
        hereChoice.querySelector('input').checked = mode === 'here';
        serverChoice.querySelector('input[type=radio]').checked = mode === 'server';
        if (mode === 'server') urlInput.focus();
      }
      document.querySelectorAll('input[name=mode]').forEach(function (input) {
        input.addEventListener('change', function () { if (input.checked) setMode(input.value); });
      });

      function text(node, value) { node.textContent = value; return node; }
      function show(kind, build) {
        result.hidden = false;
        result.className = 'result ' + kind;
        result.setAttribute('role', kind === 'fail' ? 'alert' : 'status');
        result.textContent = '';
        build(result);
      }
      function showChecking() {
        show('checking', function (node) {
          var spin = document.createElement('span');
          spin.className = 'spinner';
          node.appendChild(spin);
          node.appendChild(document.createTextNode('Checking the engine…'));
        });
      }
      function showOk(label, ms) {
        show('ok', function (node) {
          var dot = document.createElement('span');
          dot.className = 'ok-dot';
          node.appendChild(dot);
          node.appendChild(document.createTextNode('Works · ' + label + (typeof ms === 'number' ? ' answered in ' + ms + ' ms' : ' answered')));
        });
      }
      function showFail(lead, rest) {
        show('fail', function (node) {
          node.appendChild(text(document.createElement('b'), lead));
          if (rest) node.appendChild(document.createTextNode(' ' + rest));
        });
      }
      function hostOf(url) {
        try { return new URL(url).host; } catch (e) { return url; }
      }
      function serverUrl() {
        var raw = urlInput.value.trim();
        if (!raw) return null;
        if (!/^https?:\/\//i.test(raw)) raw = 'https://' + raw;
        try {
          var parsed = new URL(raw);
          return parsed.hostname ? parsed.origin : null;
        } catch (e) { return null; }
      }
      function needsAddress() {
        showFail('Enter the server address.', 'Use the full address, like https://allternit.example.com.');
        urlInput.focus();
      }
      function cantReach(url) {
        if (mode === 'server') showFail("Can't reach " + hostOf(url) + '.', 'Check the address, and check that the server is on.');
        else showFail("Can't reach the engine on this computer.", 'Save and restart to start it again.');
      }
      function setBusy(value) {
        busy = value;
        checkBtn.disabled = value;
        saveBtn.disabled = value;
      }

      async function check() {
        if (busy || !connection) return;
        var url = null;
        if (mode === 'server') {
          url = serverUrl();
          if (!url) return needsAddress();
        }
        setBusy(true);
        showChecking();
        try {
          var res = await connection.test(url ? { remoteUrl: url } : undefined);
          if (res && res.status === 'connected') showOk(mode === 'here' ? 'this computer' : hostOf(res.url || url), res.latencyMs);
          else cantReach((res && res.url) || url || '');
        } catch (err) {
          console.error('[Connect] check failed', err);
          cantReach(url || '');
        } finally {
          setBusy(false);
        }
      }

      async function save() {
        if (busy || !connection) return;
        var config = { mode: 'bundled', restart: true };
        if (mode === 'server') {
          var url = serverUrl();
          if (!url) return needsAddress();
          config = { mode: 'remote', remoteUrl: url, restart: true };
        }
        setBusy(true);
        try {
          await connection.setBackend(config);
          show('checking', function (node) {
            var spin = document.createElement('span');
            spin.className = 'spinner';
            node.appendChild(spin);
            node.appendChild(document.createTextNode('Restarting Allternit…'));
          });
        } catch (err) {
          console.error('[Connect] save failed', err);
          showFail("Couldn't save this choice.", 'Restart Allternit and try again.');
          setBusy(false);
        }
      }

      checkBtn.addEventListener('click', check);
      saveBtn.addEventListener('click', save);
      urlInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') check(); });
      document.getElementById('docs-link').addEventListener('click', function (e) {
        e.preventDefault();
        if (shell) shell.openExternal('https://docs.allternit.com/self-hosted/quickstart');
      });

      if (!connection) {
        showFail('Allternit needs a restart.', 'Quit Allternit and open it again.');
        setBusy(true);
        return;
      }
      if (new URLSearchParams(location.search).get('reason') === 'load-failed') {
        showFail("Allternit couldn't open your workspace.", 'Check where it runs, then save and restart.');
      }
      connection.getBackend().then(function (backend) {
        if (backend && backend.mode === 'remote' && backend.url) {
          urlInput.value = backend.url;
          setMode('server');
          urlInput.blur();
        }
      }).catch(function (err) { console.error('[Connect] could not read the saved choice', err); });
    })();
  </script>
</body>
</html>

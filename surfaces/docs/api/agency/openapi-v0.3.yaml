        proposed_action:
          oneOf:
          - $ref: '#/components/schemas/ProposedAction'
          - type: 'null'
        response_options:
          type: array
          items:
            type: string
            enum:
            - approval
            - rejection
            - data
            - message
        requested_channel:
          type:
          - string
          - 'null'
        expires_at:
          type:
          - string
          - 'null'

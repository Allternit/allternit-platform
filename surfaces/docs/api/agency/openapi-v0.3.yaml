        seq:
          type: integer
          minimum: 1
          description: Gap-free per-run sequence.
        run_id:
          type: string
        type:
          $ref: '#/components/schemas/RunEventType'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        run_version:
          type: integer
    RunEvent:
      description: Discriminated on `type`. Unknown types must be ignored by clients.
      oneOf:
      - $ref: '#/components/schemas/RunStatusChangedEvent'
      - $ref: '#/components/schemas/RunProgressEvent'
      - $ref: '#/components/schemas/RunMessageEvent'
      - $ref: '#/components/schemas/AttentionRequestedEvent'
      - $ref: '#/components/schemas/AttentionResolvedEvent'
      - $ref: '#/components/schemas/InputAcceptedEvent'
      - $ref: '#/components/schemas/ArtifactCreatedEvent'
      - $ref: '#/components/schemas/ReceiptAppendedEvent'
      - $ref: '#/components/schemas/VerificationCompletedEvent'
      - $ref: '#/components/schemas/BudgetThresholdEvent'
      - $ref: '#/components/schemas/DebugTraceEvent'
      discriminator:
        propertyName: type
        mapping:
          run.status_changed: '#/components/schemas/RunStatusChangedEvent'
          run.progress: '#/components/schemas/RunProgressEvent'
          run.message: '#/components/schemas/RunMessageEvent'
          attention.requested: '#/components/schemas/AttentionRequestedEvent'
          attention.resolved: '#/components/schemas/AttentionResolvedEvent'
          input.accepted: '#/components/schemas/InputAcceptedEvent'
          artifact.created: '#/components/schemas/ArtifactCreatedEvent'
          receipt.appended: '#/components/schemas/ReceiptAppendedEvent'
          verification.completed: '#/components/schemas/VerificationCompletedEvent'
          budget.threshold: '#/components/schemas/BudgetThresholdEvent'
          debug.trace: '#/components/schemas/DebugTraceEvent'
    RunStatusChangedEvent:
      allOf:
      - $ref: '#/components/schemas/RunEventBase'
      - type: object
        required:
        - type
        - data
        properties:

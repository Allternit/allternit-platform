                type: string
                description: Plain-language step, e.g. "Running affected tests".
              completed_steps:
                type: integer
              estimated_steps:
                type:
                - integer
                - 'null'
    RunMessageEvent:
      allOf:
      - $ref: '#/components/schemas/RunEventBase'
      - type: object
        required:
        - type
        - data
        properties:
          type:
            const: run.message
          data:
            type: object
            required:
            - role
            - text

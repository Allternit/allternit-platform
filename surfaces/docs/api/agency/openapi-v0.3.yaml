      - type
      - resolved_at
      - receipt_id
      properties:
        type:
          type: string
          enum:
          - approval
          - rejection
          - data
          - message
          - expired
          - withdrawn
        resolved_by:
          type:
          - string
          - 'null'
        resolved_at:
          $ref: '#/components/schemas/Timestamp'
        receipt_id:
          type: string
        outcome:
          type: string
          enum:
          - approved
          - rejected
          - answered
          - none
          description: Expired approval => `rejected` (deny). Expired informational => `none`.
    AttentionResponse:
      type: object
      required:
      - type
      additionalProperties: false
      properties:
        type:
          type: string
          enum:
          - approval
          - rejection
          - data
          - message
        value: {}
        comment:
          type: string
    AttentionPage:
      allOf:
      - $ref: '#/components/schemas/PageBase'
      - properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/AttentionRequest'
    Artifact:
      description: Public view of NodeOutputV1. Immutable, content-addressed.
      type: object
      required:
      - id
      - object
      - run_id
      - name
      - mime_type
      - hash
      - verification_status
      - receipt_id
      - created_at
      properties:
        id:
          type: string
        object:
          const: artifact
        run_id:
          type: string
        name:
          type: string
        kind:
          type: string
          enum:
          - patch
          - file
          - report
          - dataset
          - log
          - other
        mime_type:
          type: string
        size_bytes:
          type: integer
        hash:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        trust_class:
          $ref: '#/components/schemas/TrustClass'
        verification_status:
          type: string
          enum:
          - unverified
          - pass
          - fail
          - inconclusive
          - error
        receipt_id:
          type: string
        content_url:
          type:
          - string
          - 'null'
          format: uri
          description: Short-lived download URL.
        created_at:
          $ref: '#/components/schemas/Timestamp'
        metadata:
          type: object
          additionalProperties: true
    ArtifactPage:
      allOf:
      - $ref: '#/components/schemas/PageBase'
      - properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/Artifact'
    ReceiptType:
      type: string
      enum:
      - run
      - tool
      - action
      - mutation
      - verification
      - policy
      - node_output
      - input
      - attention
      - control
      - spawn
    Receipt:
      description: "Append-only, content-addressed, hash-chained per run.\n`content_hash` = sha256 over the canonical\
        \ JSON (RFC 8785) of every field except\n`content_hash` and `signature`. `prev_hash` links to the previous\
        \ receipt in the run\nchain (null only at index 0). Corrections append a new receipt with `supersedes`.\n\
        \ Signing: per-run previous-hash chain; RFC 8785 JCS canonicalization, SHA-256, Ed25519. The signed\nmaterial\
        \ is the JCS-canonical object {`schema_id`, `schema_version`, `domain`, `content_hash`}, so signatures bind\
        \ schema id, schema version and the\ndomain-separation tag `allternit.receipt.v1`. Verification keys: `/.well-known/jwks.json`."
      type: object
      required:
      - id
      - object
      - run_id
      - type
      - index
      - content_hash
      - prev_hash
      - created_at
      - provenance
      - payload
      - schema_id
      - schema_version
      properties:
        id:
          type: string
          pattern: ^rcpt_
        object:
          const: receipt
        run_id:
          type: string
        type:
          $ref: '#/components/schemas/ReceiptType'
        index:
          type: integer
          minimum: 0
        content_hash:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        prev_hash:
          oneOf:
          - type: string
            pattern: ^sha256:[0-9a-f]{64}$
          - type: 'null'
        signature:
          oneOf:
          - $ref: '#/components/schemas/ReceiptSignature'
          - type: 'null'
        supersedes:
          type:
          - string
          - 'null'
        idempotency_key:
          type:
          - string
          - 'null'
          description: Required on action receipts for external or irreversible effects.
        summary:
          type: string
        provenance:
          type: array
          items:
            $ref: '#/components/schemas/Provenance'
        payload:
          type: object
          additionalProperties: true
          description: Type-specific body (e.g. tool exit class, verification result, policy decision). Open by
            design; component identities appear only with `view=debug`.
        created_at:
          $ref: '#/components/schemas/Timestamp'
        schema_id:
          type: string
          examples:
          - allternit.receipt
          description: Included in the signed payload.
        schema_version:
          type: string
          examples:
          - '1'
          description: Included in the signed payload.
    ReceiptSignature:
      type: object
      required:
      - alg
      - key_id
      - value
      - domain
      properties:
        alg:
          type: string
          enum:
          - ed25519
        key_id:
          type: string
        value:
          type: string
          description: base64url Ed25519 signature over JCS({schema_id, schema_version, domain, content_hash}).
        jwks_url:
          type: string
          format: uri
          description: Always `https://api.allternit.com/.well-known/jwks.json`.
        domain:
          const: allternit.receipt.v1
          description: Domain-separation tag included in the signed payload.
    Provenance:
      description: AbiEnvelope provenance.
      type: object
      required:
      - source_type
      - trust_class
      properties:
        source_type:
          type: string
          enum:
          - USER
          - FILE
          - TOOL
          - MODEL
          - POLICY
          - SYSTEM
          - CACHE
          - RETRIEVAL
        source_id:
          type: string
        trust_class:
          $ref: '#/components/schemas/TrustClass'
        content_hash:
          type:
          - string
          - 'null'
        observed_at:
          type:
          - string
          - 'null'
          format: date-time
    ReceiptChainVerification:
      type: object
      required:
      - run_id
      - receipt_count
      - head_hash
      - hash_chain_valid
      - signatures_valid
      - checked_at
      properties:
        run_id:
          type: string
        receipt_count:
          type: integer
        head_hash:
          type: string
        hash_chain_valid:
          type: boolean
        signatures_valid:
          type:
          - boolean
          - 'null'
          description: Null if any receipt is unsigned.
        first_invalid_index:
          type:
          - integer
          - 'null'
        checked_at:
          $ref: '#/components/schemas/Timestamp'
    ReceiptPage:
      allOf:
      - $ref: '#/components/schemas/PageBase'
      - properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/Receipt'
    GraphView:
      x-disclosure-tier: C
      type: object
      required:
      - graph_id
      - version
      - nodes
      - edges
      properties:
        graph_id:
          type: string
        version:
          type: integer
        template_id:
          type:
          - string
          - 'null'
        nodes:
          type: array
          items:
            type: object
            required:
            - node_id
            - primitive_id
            - lifecycle
            properties:
              node_id:
                type: string
              primitive_id:
                type: string
              lifecycle:
                type: string
                enum:
                - DECLARE
                - ADMIT
                - READY
                - LEASE
                - SPAWN
                - RUN
                - HEARTBEAT
                - OUTPUT
                - VERIFY
                - COMMIT
                - CONTINUE
                - REPLAN
                - NEEDS_HUMAN
                - CLOSE
                - VAULT
                - LEARN
              wait_gate:
                type:
                - string
                - 'null'
              output_ids:
                type: array
                items:
                  type: string
        edges:
          type: array
          items:
            type: object
            required:
            - from
            - to
            properties:
              from:
                type: string
              to:
                type: string
              when:
                type:
                - string
                - 'null'
    CampaignStatus:
      type: string
      enum:
      - active
      - sleeping
      - running
      - needs_attention
      - paused
      - completed
      - failed
      - cancelled
      description: "active = created, first wake pending; sleeping = waiting for next_wake; running = at\nleast\
        \ one child run non-terminal; needs_attention = a child run or the campaign itself\nhas an open AttentionRequest;\
        \ paused; completed = campaign completion criteria met by\nreceipts; failed; cancelled.\n Independent of\
        \ `scheduling`."
    CampaignCreate:
      type: object
      required:
      - objective
      additionalProperties: false
      patternProperties:
        ^x-[a-z0-9-]+$: {}
      properties:
        agent:
          type: string
          default: allternit-code
        objective:
          type: string
        workspace:
          $ref: '#/components/schemas/Workspace'
        authority:
          $ref: '#/components/schemas/Authority'
        budget:
          $ref: '#/components/schemas/CampaignBudget'
        completion_criteria:
          $ref: '#/components/schemas/CompletionCriteria'
        graph_template:
          type: string
          x-disclosure-tier: C
        wake_policy:
          $ref: '#/components/schemas/WakePolicy'
        attention_policy:
          $ref: '#/components/schemas/AttentionPolicy'
        metadata:
          $ref: '#/components/schemas/Metadata'
      description: 'Only `objective` is required. workspace, authority, budget, completion_criteria and wake_policy
        resolve from the agent/profile defaults and are returned explicitly on Campaign.resolved before any run
        is created. No hidden permissive defaults: if a safe value cannot be resolved the request fails with ERR_DEFAULTS_UNRESOLVABLE.'
    CampaignBudget:
      description: Whole-campaign caps plus a per-run budget applied to every child run.
      type: object
      required:
      - per_run
      additionalProperties: false
      anyOf:
      - required:
        - max_cost_usd
      - required:
        - max_runs
      properties:
        max_cost_usd:
          type: number
          minimum: 0
        max_runs:
          type: integer
          minimum: 1
        per_run:
          $ref: '#/components/schemas/Budget'
        on_exhaustion:
          type: string
          enum:
          - request_attention
          - stop
          default: request_attention
    WakePolicy:
      description: "When the campaign may consider waking. Triggers only make a wake *eligible*; the\ncampaign then\
        \ decides whether another check is useful (not cron).\n Wake triggers are accepted, but autonomous scheduled\
        \ waking is disabled until go-live: the Campaign reports `scheduling: disabled_pending_golive`. Limits are\
        \ versioned defaults (`defaults_version`)."
      type: object
      required:
      - triggers
      additionalProperties: false
      properties:
        triggers:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/WakeTrigger'
        min_interval_seconds:
          type: integer
          minimum: 60
          default: 900
        max_wakes_per_day:
          type: integer
          minimum: 1
          default: 24
        skip_if_run_active:
          type: boolean
          default: true
        until:
          type:
          - string
          - 'null'
          format: date-time
        defaults_version:
          type: string
          readOnly: true
    WakeTrigger:
      oneOf:
      - type: object
        required:
        - type
        - interval_seconds
        additionalProperties: false
        properties:
          type:
            const: interval
          interval_seconds:
            type: integer
            minimum: 60
          jitter_seconds:
            type: integer
            minimum: 0
            default: 0
      - type: object
        required:
        - type
        - cron
        - timezone
        additionalProperties: false
        properties:
          type:
            const: schedule
          cron:
            type: string
          timezone:
            type: string
      - type: object
        required:
        - type
        - source
        additionalProperties: false
        properties:
          type:
            const: event
          source:
            type: string
            description: Resource URI or connector event, e.g. `repo://acme/store#push`.
          filter:
            type: object
            additionalProperties:
              type: string
      - type: object
        required:
        - type
        additionalProperties: false
        properties:
          type:
            const: run_finished
      - type: object
        required:
        - type
        additionalProperties: false
        properties:
          type:
            const: manual
      discriminator:
        propertyName: type
    AttentionPolicy:
      type: object
      additionalProperties: false
      properties:
        channels:
          type: array
          items:
            type: string
            pattern: ^(in_app|email|push|webhook|connector:[a-z0-9_-]+)$
          default:
          - in_app
        quiet_hours:
          type:
          - object
          - 'null'
          required:
          - start
          - end
          - timezone
          properties:
            start:
              type: string
              pattern: ^[0-2][0-9]:[0-5][0-9]$
            end:
              type: string
              pattern: ^[0-2][0-9]:[0-5][0-9]$
            timezone:
              type: string
        interrupt_quiet_hours_at:
          type: string
          enum:
          - critical
          - never
          default: critical
        max_per_hour:
          type: integer
          minimum: 0
          default: 4
        max_per_day:
          type: integer
          minimum: 0
          default: 20
        dedupe_window_seconds:
          type: integer
          minimum: 0
          default: 3600
        escalate_after_seconds:
          type:
          - integer
          - 'null'
          minimum: 60
        defaults_version:
          type: string
          readOnly: true
          description: Versioned defaults for caps/dedupe/quiet-hours; not architecture constants.
    Campaign:
      type: object
      required:
      - agent
      - attention_policy
      - budget
      - budget_usage
      - completion_criteria
      - created_at
      - defaults_version
      - id
      - next_wake
      - object
      - objective
      - owner
      - resolved
      - scheduling
      - status
      - wake_policy
      properties:
        id:
          type: string
          pattern: ^cmp_
        object:
          const: campaign
        agent:
          type: string
        objective:
          type: string
        status:
          $ref: '#/components/schemas/CampaignStatus'
        owner:
          type: string
        budget:
          $ref: '#/components/schemas/CampaignBudget'
        budget_usage:
          allOf:
          - $ref: '#/components/schemas/BudgetUsage'
          - type: object
            properties:
              runs:
                type: integer
        wake_policy:
          $ref: '#/components/schemas/WakePolicy'
        attention_policy:
          $ref: '#/components/schemas/AttentionPolicy'
        completion_criteria:
          $ref: '#/components/schemas/CompletionCriteria'
        completion:
          $ref: '#/components/schemas/CompletionState'
        next_wake:
          type:
          - string
          - 'null'
          format: date-time
        last_wake:
          type:
          - string
          - 'null'
          format: date-time
        active_run_ids:
          type: array
          items:
            type: string
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
        metadata:
          $ref: '#/components/schemas/Metadata'
        scheduling:
          type: string
          enum:
          - disabled_pending_golive
          - enabled
          description: '`disabled_pending_golive` until Agency API alpha/conformance and an explicit go-live decision.
            While disabled, no wake fires and `next_wake` is null; manual runs still work.'
        defaults_version:
          type: string
          description: Version of campaign limit defaults.
        resolved:
          $ref: '#/components/schemas/ResolvedDefaults'
          description: Explicit workspace/authority/budget/completion the campaign's runs will use, recorded before
            the first run. Each run also carries its own Run.resolved.
      description: Campaigns can be created but autonomous scheduled waking is disabled until go-live; see `scheduling`.
    CampaignControlRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
        cascade:
          type: boolean
          default: true
    CampaignPage:
      allOf:
      - $ref: '#/components/schemas/PageBase'
      - properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/Campaign'
    ReplayRequest:
      type: object
      required:
      - source_run_id
      additionalProperties: false
      properties:
        source_run_id:
          type: string
        effects:
          const: recorded_only
          default: recorded_only
          description: The only allowed value. Replays never perform external effects.
        overrides:
          type: object
          additionalProperties: false
          description: What to vary. Anything not overridden is taken from the source run's recording.
          properties:
            authority_profile:
              type: string
            completion:
              $ref: '#/components/schemas/CompletionCriteria'
            models:
              $ref: '#/components/schemas/ModelConstraints'
            runtime:
              $ref: '#/components/schemas/RuntimeHints'
    ReplayStatus:
      type: string
      enum:
      - queued
      - running
      - completed
      - failed
      - cancelled
    Replay:
      type: object
      required:
      - id
      - object
      - source_run_id
      - status
      - effects
      - created_at
      properties:
        id:
          type: string
          pattern: ^rpl_
        object:
          const: replay
        source_run_id:
          type: string
        status:
          $ref: '#/components/schemas/ReplayStatus'
        effects:
          const: recorded_only
        verdict:
          type:
          - string
          - 'null'
          enum:
          - equivalent
          - diverged_expected
          - diverged_unexpected
          - null
        created_at:
          $ref: '#/components/schemas/Timestamp'
        finished_at:
          type:
          - string
          - 'null'
          format: date-time
        results_url:
          type: string
          format: uri-reference
        error:
          oneOf:
          - $ref: '#/components/schemas/Error'
          - type: 'null'
    ReplayResults:
      type: object
      required:
      - replay_id
      - verdict
      - decisions_total
      - decisions_matched
      - divergences
      - has_more
      - next_cursor
      properties:
        replay_id:
          type: string
        verdict:
          type: string
          enum:
          - equivalent
          - diverged_expected
          - diverged_unexpected
        decisions_total:
          type: integer
        decisions_matched:
          type: integer
        completion_matched:
          type: boolean
        divergences:
          type: array
          items:
            type: object
            required:
            - step_ref
            - kind
            properties:
              step_ref:
                type: string
              kind:
                type: string
                enum:
                - expected
                - unexpected
              description:
                type: string
              source_receipt_id:
                type:
                - string
                - 'null'
              replay_receipt_id:
                type:
                - string
                - 'null'
        has_more:
          type: boolean
        next_cursor:
          type:
          - string
          - 'null'
    DecisionRequest:
      type: object
      required:
      - operation
      - question
      - state
      additionalProperties: false
      properties:
        operation:
          type: string
          enum:
          - belief
          - choice
          - score
          - rank
          - subset
          - estimate
          - gate
          - verify
          - pair_score
        question:
          type: string
        state:
          description: Caller-supplied state (object or text).
        candidates:
          type: array
          description: Required for choice/rank/subset/gate/pair_score. The backend never invents options.
          items:
            type: object
            required:
            - id
            properties:
              id:
                type: string
              label:
                type: string
              value: {}
        scale:
          type: array
          items:
            type: string
          description: Ordered labels for score.
        range:
          type: object
          properties:
            min:
              type: number
            max:
              type: number
          description: Bounds for estimate.
        require_level:
          type: string
          enum:
          - L0
          - L1
          - L2
          - auto
          default: auto
          description: Minimum calibration level. Raw uncalibrated readouts are never served for action.
        max_latency_ms:
          type: integer
          minimum: 1
      allOf:
      - if:
          properties:
            operation:
              enum:
              - choice
              - rank
              - subset
              - gate
              - pair_score
        then:
          required:
          - candidates
    DecisionResult:
      type: object
      required:
      - operation
      - answer
      - confidence
      - calibration
      - evidence_refs
      properties:
        operation:
          type: string
        answer:
          description: Typed answer (candidate id, id list, number, or boolean).
        probabilities:
          type:
          - object
          - 'null'
          additionalProperties:
            type: number
        confidence:
          type: number
          minimum: 0
          maximum: 1
        calibration:
          type: object
          required:
          - level_served
          properties:
            level_served:
              type: string
              enum:
              - L0
              - L1
              - L2
            calibrated:
              type: boolean
            calibration_id:
              type:
              - string
              - 'null'
        threshold_action:
          type:
          - string
          - 'null'
          enum:
          - auto
          - review
          - escalate
          - reject
          - null
        evidence_refs:
          type: array
          items:
            type: string
        debug:
          description: Present only with `view=debug` (backend class, component identity, latency).
          type:
          - object
          - 'null'
          additionalProperties: true
    Capability:
      type: object
      required:
      - id
      - object
      - description
      - status
      properties:
        id:
          type: string
          pattern: ^cap\.
        object:
          const: capability
        description:
          type: string
        status:
          type: string
          enum:
          - available
          - degraded
          - unavailable
        trust_classes:
          type: array
          items:
            $ref: '#/components/schemas/TrustClass'
        localities:
          type: array
          items:
            type: string
            enum:
            - local
            - fabric
            - remote
    CapabilityPage:
      allOf:
      - $ref: '#/components/schemas/PageBase'
      - properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/Capability'
    Agent:
      type: object
      required:
      - id
      - object
      - versions
      - default_version
      properties:
        id:
          type: string
          examples:
          - allternit-code
        object:
          const: agent
        description:
          type: string
        versions:
          type: array
          items:
            type: string
        default_version:
          type: string
        capabilities:
          type: array
          items:
            type: string
        completion_criteria:
          type: array
          items:
            $ref: '#/components/schemas/CriterionRef'
          description: Built-in criteria this agent can verify.
        authority_profiles:
          type: array
          items:
            type: string
        templates:
          type: array
          items:
            type: string
    AgentPage:
      allOf:
      - $ref: '#/components/schemas/PageBase'
      - properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/Agent'
    ModelClass:
      description: Logical class only. Concrete models are interchangeable components and are never listed here.
        Logical capability/locality/trust classes only; never vendor identities in default responses. The first-party
        workspace UI may show model choice separately.
      type: object
      required:
      - id
      - object
      - trust_classes
      - locality
      properties:
        id:
          type: string
          pattern: ^mc\.[a-z0-9_.-]+$
          examples:
          - mc.local.small
          - mc.remote.deep
        object:
          const: model_class
        description:
          type: string
        trust_classes:
          type: array
          items:
            $ref: '#/components/schemas/TrustClass'
          description: Highest data trust class this class may receive.
        locality:
          type: string
          enum:
          - local
          - fabric
          - remote
        capabilities:
          type: array
          items:
            type: string
        latency_class:
          type: string
          enum:
          - interactive
          - normal
          - background
    ModelClassPage:
      allOf:
      - $ref: '#/components/schemas/PageBase'
      - properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/ModelClass'
    AuthorityProfile:
      type: object
      required:
      - id
      - object
      - version
      - description
      - capabilities
      - filesystem_scope
      - network
      - approval_requirements
      - grants
      properties:
        id:
          type: string
          enum:
          - read-only
          - code-safe
          - code-write
        object:
          const: authority_profile
        description:
          type: string
        grants:
          type: array
          items:
            $ref: '#/components/schemas/Grant'
        network:
          $ref: '#/components/schemas/NetworkPolicy'
        version:
          type: integer
          minimum: 1
          description: Profile version; runs record `id@version` in `Run.resolved.authority`.
        capabilities:
          type: array
          items:
            type: string
            pattern: ^cap\.
          description: Capabilities the profile grants (`cap.*`).
        denied_capabilities:
          type: array
          items:
            type: string
            pattern: ^cap\.
        filesystem_scope:
          $ref: '#/components/schemas/FilesystemScope'
        approval_requirements:
          type: array
          items:
            $ref: '#/components/schemas/ApprovalRequirement'
        defaults_version:
          type: string
          description: Version of platform limit defaults referenced.
      description: Exact typed semantics of a profile. Compiles into capabilities/policy. Only `read-only`, `code-safe`
        and `code-write` exist; no bypass equivalent is ever public.
    AuthorityProfilePage:
      allOf:
      - $ref: '#/components/schemas/PageBase'
      - properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/AuthorityProfile'
    FilesystemScope:
      type: object
      required:
      - read
      - write
      - execute
      additionalProperties: false
      properties:
        read:
          type: string
          enum:
          - none
          - workspace
          - workspace_and_declared_resources
        write:
          type: string
          enum:
          - none
          - scratch_only
          - workspace_paths_declared_writable
        execute:
          type: string
          enum:
          - none
          - sandboxed_workspace
        outside_workspace:
          type: string
          enum:
          - deny
          default: deny
    ApprovalRequirement:
      type: object
      required:
      - effect
      - mode
      additionalProperties: false
      properties:
        effect:
          type: string
          enum:
          - write
          - execute
          - network
          - spend
          - external
          - irreversible
        mode:
          type: string
          enum:
          - never_allowed
          - always_ask
          - ask_unless_granted
          - allowed
    ResolvedAuthority:
      type: object
      required:
      - profile
      - grants_summary
      additionalProperties: false
      properties:
        profile:
          type: object
          required:
          - id
          - version
          properties:
            id:
              type: string
            version:
              type: integer
        grants_summary:
          type: object
          required:
          - capabilities
          - filesystem_scope
          - network
          - approval_requirements
          description: Summary of the compiled grants.
          properties:
            capabilities:
              type: array
              items:
                type: string
            filesystem_scope:
              $ref: '#/components/schemas/FilesystemScope'
            network:
              $ref: '#/components/schemas/NetworkPolicy'
            approval_requirements:
              type: array
              items:
                $ref: '#/components/schemas/ApprovalRequirement'
            grant_count:
              type: integer
        interaction_mode:
          type: string
          enum:
          - autonomous
          - approval_gated
          - recommend_only
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
    ResolvedCompletion:
      type: object
      required:
      - contract_id
      - contract_version
      - require
      - allow_partial
      additionalProperties: false
      properties:
        contract_id:
          type: string
        contract_version:
          type: integer
        require:
          type: array
          items:
            type: object
            required:
            - id
            - version
            properties:
              id:
                type: string
              version:
                type: integer
        allow_partial:
          type: boolean
    ResolvedDefaults:
      description: 'Everything the server resolved before execution: explicit, safe, versioned and auditable. Populated
        before the run leaves `accepted`; the run cannot execute without it. Never contains a permissive fallback.'
      type: object
      required:
      - workspace
      - authority
      - budget
      - completion
      - defaults_source
      - enforcement
      - resolved_at
      additionalProperties: false
      properties:
        workspace:
          $ref: '#/components/schemas/Workspace'
        authority:
          $ref: '#/components/schemas/ResolvedAuthority'
        budget:
          $ref: '#/components/schemas/Budget'
        completion:
          $ref: '#/components/schemas/ResolvedCompletion'
        defaults_source:
          type: string
          examples:
          - agent:allternit-code@v1/profile:code-safe@1
          description: Which agent/profile defaults (with versions) filled omitted fields; `request` if all four
            were supplied.
        defaults_version:
          type: string
          description: Version of platform limit defaults.
        enforcement:
          type: object
          required:
          - judge_fail_closed
          - verifier_owned_completion
          additionalProperties: false
          description: Always true for runs created via this API; not client-disableable.
          properties:
            judge_fail_closed:
              const: true
            verifier_owned_completion:
              const: true
        resolved_at:
          $ref: '#/components/schemas/Timestamp'
    CompletionCriterion:
      type: object
      required:
      - id
      - object
      - version
      - description
      - verifier_semantics
      - verifier_kind
      properties:
        id:
          type: string
          pattern: ^[a-z0-9_.-]+$
        object:
          const: completion_criterion
        version:
          type: integer
          minimum: 1
        description:
          type: string
        verifier_semantics:
          type: string
          description: Precise text of what PASS means, including that INCONCLUSIVE is never PASS.
        verifier_kind:
          type: string
          enum:
          - parse
          - format
          - lint
          - typecheck
          - unit_test
          - integration_test
          - build
          - semantic_rule
          - requirement
          - security
          - regression
          - diff_review
          - human
        built_in:
          type: boolean
        deprecated:
          type: boolean
        blocking_default:
          type: boolean
    CompletionCriterionPage:
      allOf:
      - $ref: '#/components/schemas/PageBase'
      - properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/CompletionCriterion'
    Jwks:
      type: object
      required:
      - keys
      properties:
        keys:
          type: array
          items:
            type: object
            required:
            - kty
            - crv
            - x
            - kid
            properties:
              kty:
                const: OKP
              crv:
                const: Ed25519
              x:
                type: string
              kid:
                type: string
              use:
                const: sig
              alg:
                const: EdDSA

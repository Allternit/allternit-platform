          - string
          - 'null'
        status:
          $ref: '#/components/schemas/RunStatus'
    RunPage:
      allOf:
      - $ref: '#/components/schemas/PageBase'
      - properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/Run'
    RunEventType:
      type: string
      enum:
      - run.status_changed
      - run.progress
      - run.message
      - attention.requested
      - attention.resolved
      - input.accepted
      - artifact.created
      - receipt.appended
      - verification.completed
      - budget.threshold
      - debug.trace
    RunEventBase:
      type: object
      required:
      - id
      - seq
      - run_id
      - type
      - created_at
      properties:
        id:

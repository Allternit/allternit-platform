      - $ref: '#/components/schemas/RunEventBase'
      - type: object
        required:
        - type
        - data
        properties:
          type:
            const: debug.trace
          data:
            type: object
            additionalProperties: true
    RunEventPage:
      allOf:
      - $ref: '#/components/schemas/PageBase'
      - properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/RunEvent'
    AttentionStatus:
      type: string
      enum:
      - open
      - resolved
      - expired
      - withdrawn
    AttentionRequest:
      description: 'Public view of AttentionRequestV1. Agents request attention; the

        AttentionController owns delivery, quiet hours, dedupe and quotas. Only policy ASK

        outcomes become approval requests; hard DENY outcomes never do.

        '
      type: object
      required:
      - id
      - object
      - run_id
      - reason
      - urgency
      - topic
      - status
      - response_options
      - created_at
      - kind
      properties:
        id:
          type: string
          pattern: ^att_
        object:
          const: attention_request
        run_id:
          type: string
        campaign_id:
          type:
          - string
          - 'null'
        reason:
          type: string
          enum:
          - approval_required
          - clarification_needed
          - budget_exhausted
          - verification_inconclusive
          - low_confidence
          - unsafe_resume
          - review_requested
        urgency:
          type: string
          enum:
          - low
          - normal
          - high
          - critical
        topic:
          type: string
        summary:
          type: string
        expected_loss:
          type:
          - string
          - 'null'

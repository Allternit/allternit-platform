appId: ${APP_ID}
---
# Verifies tapping "New loop" opens the loop creation sheet.
- launchApp:
    appId: ${APP_ID}
    clearState: true
    arguments:
      skip-auth: true
      sidebar: true
- tapOn:
    id: "drawerRowautomation-tasks"
- tapOn:
    id: "automationTabloop"
- tapOn:
    id: "loopsNew"
- assertVisible:
    id: "createLoopTitle"
- assertVisible:
    id: "createLoopCommand"
- assertVisible:
    id: "createLoopSubmit"
- takeScreenshot: automation_loop_new
- tapOn:
    id: "createLoopClose"
- stopApp

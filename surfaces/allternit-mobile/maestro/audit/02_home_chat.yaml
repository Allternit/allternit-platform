appId: ${APP_ID}
---
- launchApp:
    appId: ${APP_ID}
    clearState: true
    arguments:
      skip-auth: true
# iOS-only: system notification prompt. TODO(android step N): POST_NOTIFICATIONS dialog (grant via adb or Android branch).
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: "Dismiss notifications prompt"
          optional: true
- assertVisible: "Message Allternit..."
- takeScreenshot: home_chat
- tapOn: "Open sidebar"
- takeScreenshot: sidebar_open
- tapOn: "New chat"
- takeScreenshot: home_chat_new
- stopApp

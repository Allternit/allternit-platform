appId: ${APP_ID}
---
# Verifies the composer agent/bot selection sheet opens.
- launchApp:
    appId: ${APP_ID}
    clearState: true
    arguments:
      skip-auth: true
      -enable-agent-mode: true
      -open-agent-sheet: true
# iOS-only: system notification prompt. TODO(android step N): POST_NOTIFICATIONS dialog (grant via adb or Android branch).
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: "Dismiss notifications prompt"
          optional: true
- assertVisible: "CHOOSE AGENT | BOT"
- takeScreenshot: chat_agent_selection
- tapOn: "Done"
- stopApp

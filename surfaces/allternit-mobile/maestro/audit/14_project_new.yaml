appId: ${APP_ID}
---
# Verifies the New Project sheet renders its form.
- launchApp:
    appId: ${APP_ID}
    clearState: true
    arguments:
      skip-auth: true
      -open-projects: true
      -open-new-project: true
# iOS-only: system notification prompt. TODO(android step N): POST_NOTIFICATIONS dialog (grant via adb or Android branch).
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: "Dismiss notifications prompt"
          optional: true
- assertVisible:
    id: "newProjectTitle"
- assertVisible:
    id: "newProjectName"
- assertVisible:
    id: "newProjectCreate"
- takeScreenshot: project_new_sheet
- tapOn:
    id: "newProjectClose"
- stopApp

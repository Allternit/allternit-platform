appId: ${APP_ID}
---
# Verifies the composer "+" attachment/options sheet renders all sections.
- launchApp:
    appId: ${APP_ID}
    clearState: true
    arguments:
      skip-auth: true
      -open-plus-sheet: true
# iOS-only: system notification prompt. TODO(android step N): POST_NOTIFICATIONS dialog (grant via adb or Android branch).
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: "Dismiss notifications prompt"
          optional: true
- assertVisible:
    id: "plusSheetCamera"
- assertVisible:
    id: "plusSheetPhotos"
- assertVisible:
    id: "plusSheetAddFiles"
- assertVisible:
    id: "plusSheetGithub"
- assertVisible:
    id: "plusSheetConnectors"
- takeScreenshot: composer_plus_sheet
- tapOn:
    id: "plusSheetClose"
- stopApp

appId: ${APP_ID}
---
# Verifies Platform settings opens from the Settings root.
- launchApp:
    appId: ${APP_ID}
    clearState: true
    arguments:
      skip-auth: true
      -open-settings: true
      -open-settings-platform: true
# iOS-only: system notification prompt. TODO(android step N): POST_NOTIFICATIONS dialog (grant via adb or Android branch).
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: "Dismiss notifications prompt"
          optional: true
- assertVisible:
    id: "platformLanguage"
- assertVisible:
    id: "platformTimezone"
- takeScreenshot: settings_platform
- stopApp

appId: ${APP_ID}
---
# Verifies the composer model picker sheet opens and shows its header.
- launchApp:
    appId: ${APP_ID}
    clearState: true
    arguments:
      skip-auth: true
      -open-model-picker: true
# iOS-only: system notification prompt. TODO(android step N): POST_NOTIFICATIONS dialog (grant via adb or Android branch).
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: "Dismiss notifications prompt"
          optional: true
- assertVisible:
    id: "modelPickerSearch"
- takeScreenshot: chat_model_picker
- stopApp

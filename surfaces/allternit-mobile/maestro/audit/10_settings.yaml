appId: ${APP_ID}
---
- launchApp:
    appId: ${APP_ID}
    clearState: true
    arguments:
      skip-auth: true
      sidebar: true
# iOS-only: system notification prompt. TODO(android step N): POST_NOTIFICATIONS dialog (grant via adb or Android branch).
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: "Dismiss notifications prompt"
          optional: true
- tapOn:
    id: "drawerSettings"
- assertVisible: "Settings"
- takeScreenshot: settings_root
- stopApp

appId: ${APP_ID}
---
# Verifies Brain Spike settings opens.
- launchApp:
    appId: ${APP_ID}
    clearState: true
    arguments:
      skip-auth: true
      -open-settings-brain-spike: true
# iOS-only: system notification prompt. TODO(android step N): POST_NOTIFICATIONS dialog (grant via adb or Android branch).
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: "Dismiss notifications prompt"
          optional: true
- assertVisible:
    id: "brainSpikeList"
- takeScreenshot: settings_brain_spike
- stopApp

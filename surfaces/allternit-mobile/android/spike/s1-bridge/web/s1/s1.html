<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S1 bridge test</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; padding: 16px; font: 14px/1.4 system-ui, sans-serif; background: Canvas; color: CanvasText; }
  h1 { font-size: 16px; margin: 0 0 8px; }
  pre { white-space: pre-wrap; word-break: break-word; font: 12px/1.35 ui-monospace, monospace; }
  button { font: inherit; padding: 8px 12px; margin: 0 8px 8px 0; }
</style>
<!-- The client must be listening before Chrome posts the port, so it loads in <head>. -->
<script src="/s1-client.js"></script>
</head>
<body>
<h1>S1 Android bridge spike (debug build only)</h1>
<button onclick="S1.reset(); location.reload()">Start over</button>
<button onclick="location.reload()">Reload</button>
<pre id="out"></pre>
<script>
  // s1-client.js ran before #out existed; its first line is only in the console.
  document.getElementById('out').textContent +=
    'Page loaded from ' + location.href + ' (online=' + navigator.onLine + '). Waiting for the TWA port...\n';
</script>
</body>
</html>

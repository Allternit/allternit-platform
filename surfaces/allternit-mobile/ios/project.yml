name: Allternit
options:
  bundleIdPrefix: com.allternit
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
packages:
  clerk-ios:
    url: https://github.com/clerk/clerk-ios
    exactVersion: "1.6.2"
  MarkdownView:
    url: https://github.com/LiYanan2004/MarkdownView
    exactVersion: "3.0.0"
  Runestone:
    url: https://github.com/simonbs/Runestone
    from: "0.5.2"
  # Per-language Tree-sitter parsers + Runestone bindings for the Workspace
  # File Editor's syntax highlighting (Core/API/CodeLanguage.swift). Pinned
  # exact like the other packages above — no newer tag verified yet.
  TreeSitterLanguages:
    url: https://github.com/simonbs/TreeSitterLanguages
    exactVersion: "0.1.10"
  # Terminal emulator for the code thread's pty flip. Pinned: `from: 1.2.0`
  # resolves to 1.99.x (pre-2.0, adds a build plugin Xcode must trust).
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: "1.15.0"
  # In-app bot calls: the web carries call audio over LiveKit
  # (Core/Calls/CallAudio.swift).
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift
    exactVersion: "2.19.0"
targets:
  Allternit:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
      - path: Core
      - path: Features
      - path: Assets.xcassets
      - path: Config
      # App phone pairing, keychain and envelope code, also compiled into
      # AllternitScreen (the broadcast extension) so the two can't drift.
      - path: Shared
    configFiles:
      Debug: Config/Secrets.xcconfig
      Release: Config/Secrets.xcconfig
    settings:
      base:
        INFOPLIST_FILE: Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.allternit.mobile
        PRODUCT_NAME: Allternit
        SWIFT_VERSION: "6.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "8"
        CODE_SIGN_ENTITLEMENTS: Allternit.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: Core/Voice/Voice-Bridging-Header.h
        # Clerk publishable key (client-public by design) — the production
        # instance, same value the web ships in .env.production.
        CLERK_PUBLISHABLE_KEY: pk_live_Y2xlcmsuYWxsdGVybml0LmNvbSQ
        # Clerk publishable key is injected via Config/Secrets.xcconfig (which
        # is gitignored; copy from Config/Secrets.xcconfig.example). This keeps
        # the production key out of version control while letting contributors
        # plug in their own Clerk instance.
        CLERK_PUBLISHABLE_KEY: $(CLERK_PUBLISHABLE_KEY)
        # Placeholder — set your team for device builds.
        DEVELOPMENT_TEAM: MQ85968PQP
        CODE_SIGN_STYLE: Automatic
        # Headscale control plane for the embedded mesh (tsnet) node. Same
        # value in debug+release; AppConfig falls back to this URL when the
        # plist key is missing.
        ALLTERNIT_MESH_CONTROL_URL: https://mail.news.allternit.com:8444
      configs:
        debug:
          # Point Debug simulator builds at the hosted gateway so chats work
          # out-of-the-box; local dev can override via the `api-url` default.
          ALLTERNIT_API_BASE_URL: https://api.allternit.com/api/v1
          ALLTERNIT_GIZZI_CODE_URL: http://127.0.0.1:4096
          # Xcode 16's debug dylib is intermittently unsigned when installed via
          # simctl, causing launch crashes. Disable it for Debug simulator builds;
          # Previews still work without it in this project.
          ENABLE_DEBUG_DYLIB: NO
        release:
          # Same public gateway the PWA uses (cloud-api).
          ALLTERNIT_API_BASE_URL: https://api.allternit.com/api/v1
          # Empty on purpose: Release reaches the user's computer through the
          # cloud-api runtime relay (InstanceConnection), not a fixed gizzi host.
          ALLTERNIT_GIZZI_CODE_URL: ""
    dependencies:
      # Embedded tsnet node (static xcframework — no embed phase, linked
      # into the binary). Vendored copy of infrastructure/mesh/tsnet-ios.
      - framework: Frameworks/Mesh.xcframework
        embed: false
      # D3 spike: embedded git client. Prebuilt libgit2 v1.3.1 (OpenSSL,
      # libssh2, pcre statically merged; fetch via Frameworks/fetch-libgit2.sh).
      # Static like Mesh — linked in, no embed phase. Swift imports it as
      # `Clibgit2` via the injected module map.
      - framework: Frameworks/libgit2.xcframework
        embed: false
      # Voice: sherpa-onnx 1.13.8 (same version as the native engine,
      # services/voice) — Silero VAD + Moonshine STT run on-device. Dynamic
      # framework with onnxruntime statically inside; fetch via
      # Frameworks/fetch-sherpa-onnx.sh. No espeak-ng/Kokoro on iOS (GPL-3).
      - framework: Frameworks/SherpaOnnxC.xcframework
        embed: true
      # bzip2 for unpacking `.tar.bz2` voice model packs (Core/Voice/Bz2Tar).
      - sdk: libbz2.tbd
      # libgit2 was built against system zlib (crc32/inflateReset …).
      - sdk: libz.tbd
      # … and system iconv (git_path_iconv for unicode path handling).
      - sdk: libiconv.tbd
      # Document import / preview support.
      - package: LiveKit
        product: LiveKit
      - sdk: QuickLook.framework
      - sdk: UniformTypeIdentifiers.framework
      - package: clerk-ios
        product: ClerkKit
      - package: clerk-ios
        product: ClerkKitUI
      - package: MarkdownView
        product: MarkdownView
      - package: Runestone
        product: Runestone
      - package: TreeSitterLanguages
        product: TreeSitterJSONRunestone
      - package: TreeSitterLanguages
        product: TreeSitterMarkdownRunestone
      - package: TreeSitterLanguages
        product: TreeSitterPythonRunestone
      - package: TreeSitterLanguages
        product: TreeSitterJavaScriptRunestone
      - package: TreeSitterLanguages
        product: TreeSitterTypeScriptRunestone
      - package: TreeSitterLanguages
        product: TreeSitterYAMLRunestone
      - package: TreeSitterLanguages
        product: TreeSitterBashRunestone
      - package: TreeSitterLanguages
        product: TreeSitterSwiftRunestone
      - package: SwiftTerm
        product: SwiftTerm
      - target: AllternitWidgets
        embed: true
      - target: AllternitScreen
        embed: true
  # Gap 4 (Live Activities): local (non-push) ActivityKit widget for a
  # running Loop's iteration progress — see LoopLiveActivityManager.swift
  # (main target) and AllternitWidgets/LoopLiveActivity.swift (here).
  AllternitWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AllternitWidgets
      # Shared ActivityAttributes type only — NOT the whole Core/ tree.
      - path: Core/LiveActivity
      - path: Assets.xcassets
    settings:
      base:
        INFOPLIST_FILE: AllternitWidgets/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.allternit.mobile.widgets
        PRODUCT_NAME: AllternitWidgets
        SWIFT_VERSION: "6.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "8"
        # Same placeholder as the main app — set your team for device builds.
        DEVELOPMENT_TEAM: MQ85968PQP
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: true
  # Live screen for the owner's bots: a ReplayKit broadcast upload extension
  # that sends the screen + app sound, sealed, to the paired Desktop
  # (Shared/AppPhone, SPEC-iphone-app-screen §3). Ported from iCTRL, whose
  # code was written for Swift 5 mode — kept there rather than retrofitted
  # for strict concurrency. iOS kills it past ~50 MB, so it links nothing
  # but system frameworks.
  AllternitScreen:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AllternitScreen
      - path: Shared
    dependencies:
      - sdk: ReplayKit.framework
      - sdk: VideoToolbox.framework
      - sdk: AudioToolbox.framework
    settings:
      base:
        INFOPLIST_FILE: AllternitScreen/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.allternit.mobile.screen
        PRODUCT_NAME: AllternitScreen
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "8"
        CODE_SIGN_ENTITLEMENTS: AllternitScreen/AllternitScreen.entitlements
        # Same placeholder as the main app — set your team for device builds.
        DEVELOPMENT_TEAM: MQ85968PQP
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: true
  # Unit tests for the iOS app. Hosts the app so tests can `@testable import Allternit`.
  AllternitTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
    dependencies:
      - target: Allternit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.allternit.mobile.tests
        PRODUCT_NAME: AllternitTests
        SWIFT_VERSION: "6.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "8"
        DEVELOPMENT_TEAM: MQ85968PQP
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES

appId: com.allternit.mobile
---
- launchApp:
    appId: com.allternit.mobile
    clearState: true
    arguments:
      skip-auth: true
      sidebar: true
- tapOn:
    id: "modeDial"
- tapOn:
    id: "modeDialOptioncode"
- takeScreenshot: code_list
- tapOn: "Open sidebar"
- takeScreenshot: code_sidebar_open
- stopApp

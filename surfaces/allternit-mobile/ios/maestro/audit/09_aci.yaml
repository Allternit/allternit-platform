appId: com.allternit.mobile
---
- launchApp:
    appId: com.allternit.mobile
    clearState: true
    arguments:
      skip-auth: true
      sidebar: true
- tapOn:
    id: "modeDial"
- tapOn:
    id: "modeDialOptionaci"
- takeScreenshot: aci_landing
- tapOn: "Open sidebar"
- takeScreenshot: aci_sidebar_open
- stopApp

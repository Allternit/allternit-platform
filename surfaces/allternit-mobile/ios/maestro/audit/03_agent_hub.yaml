appId: com.allternit.mobile
---
- launchApp:
    appId: com.allternit.mobile
    clearState: true
    arguments:
      skip-auth: true
      sidebar: true
- tapOn:
    id: "modeDial"
- tapOn:
    id: "modeDialOptionbots"
- takeScreenshot: agent_hub_home
# Point taps are used for the tab bar because the HStack of SwiftUI Buttons
# maps accessibility ids to the wrong tappable regions under Maestro's
# id-based tapper (the Sessions button consistently triggered Config).
- tapOn:
    point: "38%,16%"
- assertVisible: "Couldn't load bot sessions"
- takeScreenshot: agent_hub_sessions
- tapOn:
    point: "62%,16%"
- assertVisible: "Couldn't load workspace agents"
- takeScreenshot: agent_hub_workspace
- tapOn:
    point: "87%,16%"
- assertVisible: "Response style"
- takeScreenshot: agent_hub_config
- stopApp

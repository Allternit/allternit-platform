[package]
name = "herdr"
version = "0.9.0"
edition = "2021"
build = "build.rs"
description = "terminal workspace manager for AI coding agents"
license = "Apache-2.0"
repository = "https://github.com/herdrdev/herdr"
homepage = "https://herdr.dev"
keywords = ["terminal", "tui", "ai", "agents", "multiplexer"]
categories = ["command-line-utilities"]
include = [
    "src/**/*",
    "assets/sounds/*",
    "docs/next/api/herdr-api.schema.json",
    "skills/herdr/SKILL.md",
    "distribution/install.ps1",
    "README.md",
    "LICENSE",
    "Cargo.toml",
]

# Internal crate name stays `herdr` (upstream mergeability); the user-facing
# binary target is `ao` per the ao v3 engine fork plan (P0).
[[bin]]
name = "ao"
path = "src/main.rs"

[dependencies]
base64 = "0.22.1"
bincode = { version = "2", features = ["serde"] }
bytes = "1"
clap = { version = "4.5", default-features = false, features = ["std", "help", "usage"] }
clap_complete = "4.5"
crossterm = "0.29"
ctrlc = { version = "3", features = ["termination"] }
interprocess = "2.4.2"
jsonc-parser = { version = "0.33.1", default-features = false, features = ["cst", "serde_json"] }
libc = "0.2"
portable-pty = "=0.9.0"
png = "0.17"
# Pin to the exact upstream-resolved versions: ratatui patch releases changed
# wide-cell/spacer rendering (ratatui-core 0.1.2 broke
# pane::terminal::tests::render_keeps_halfwidth_katakana_voiced_tail_empty;
# verified by bisection against upstream's lockfile).
ratatui = { version = "=0.30.0", features = ["unstable-rendered-line-info"] }
ratatui-core = "=0.1.0"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_ignored = "0.1.14"
serde_json = "1"
sha2 = "0.10"
time = { version = "0.3.47", features = ["formatting", "parsing"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util"] }
toml = "0.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-width = "0.2"
schemars = { version = "1.2.1", features = ["derive"] }
# P3 fabric-node modules (src/ao/fabric/*): cloud pairing lifecycle, WSS relay
# client, and the loopback HTTP+WS shim. All additive to the ao binary.
axum = { workspace = true }
reqwest = { workspace = true }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
ed25519-dalek = { workspace = true }
rand = "0.8"
futures-util = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }

# P5 visibility panel (src/ao/peers/*, src/ao/visibility/*) and P6a Bus mailbox
# (src/ao/mailbox.rs): durable SQLite Bus + Ledger shim crate.
allternit-commrails = { workspace = true }

# P6a UHP gateway (src/ao/serve.rs): `ao serve` mounts the UHP HTTP surface
# in-process (not a sidecar); the gateway drives the engine over the socket API.
uhp-gateway = { path = "../uhp-gateway" }

# NOTE: cargo only honors [patch] in the WORKSPACE ROOT manifest. The
# portable-pty patch was ported to the workspace root Cargo.toml
# ([patch.crates-io] portable-pty = { path = "infrastructure/executor/ao-engine/vendor/portable-pty" }).
# It applies only to dependents requesting portable-pty 0.9.x (this crate pins =0.9.0);
# other workspace members requesting 0.8 are unaffected.

[target.'cfg(windows)'.dependencies]
# UTF-16 SDDL input for interprocess security descriptors.
widestring = "1.2"
wmi = { version = "0.18.4", default-features = false }
windows-sys = { version = "0.61.2", features = [
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Kernel",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# P5 visibility panel tests (src/ao/native, src/ao/visibility): fixture dirs.
tempfile = { workspace = true }

# Nightly Audit campaign: PARKED.
#
# status: paused on purpose. Eoj must enable it explicitly
# (`allternit-factory workspace campaign resume nightly-audit`); no agent resumes it
# on its own. The Nightly Audit Engineer bot is roster-noted as
# "parked, routine off".
#
# The executor is a bot, so even when resumed a sweep never spawns it: each
# due check becomes a needs-you item (through the attention gate: quiet hours,
# dedupe, hourly cap) until the drive runner's spawn gating lands.
id: nightly-audit
objective: >-
  Nightly read-only audit of the workspace (stale branches, orphaned builds,
  failing checks) with a short report to Eoj; no fixes without approval.
owner: eoj
status: paused
executor: bot:nightly-audit-engineer
budget:
  unit: audit-run
  limit: 30
  mode: additive
  per_wake: 1
rearm:
  weekdays: [mon, tue, wed, thu, fri, sat, sun]
  at: "02:30"
  timezone: America/Chicago

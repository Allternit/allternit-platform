# Research-pipeline mechanical sweep, expressed as a CommRails campaign.
#
# DISABLED BY DEFAULT (status: paused). The live schedule is still the launchd
# job `com.allternit.research-pipeline-sweep` (Mon-Fri 09:05 America/Chicago:
# export -> ingest -> integrity -> dashboard). This file does not replace,
# change or unload that job. Running both would sweep twice: the campaign is
# only meant to take over after Eoj unloads the launchd job himself.
#
# To trial it (in a scratch root, or after unloading launchd):
#   allternit-factory workspace campaign new --file factory/engine/docs/examples/campaigns/research-pipeline-sweep.yaml
#   allternit-factory workspace campaign resume research-pipeline-sweep   # arms the next weekday 09:05
# and, for a sweep to run the command itself, allowlist it in
# .allternit/rails/automation.yaml:
#   wake:
#     enabled_executors: [command]
#     command_allowlist:
#       - /bin/bash "/Users/joe/Desktop/Allternit/Allternit Brain/Ops/scripts/research-pipeline-sweep.sh"
# Without that, each due check becomes a needs-you item instead of a run.
# Something still has to call `wake run-due` (e.g. a launchd/cron tick);
# that tick is Eoj's call and is not installed by this file.
#
# The script is the mechanical stages only; agent pre-gate stages still need
# an interactive /research-pipeline or AGENT_SWEEP=1 (see the skill).
id: research-pipeline-sweep
objective: >-
  Run the research-pipeline mechanical sweep each weekday morning
  (export, ingest, integrity, dashboard) and stop at the human gate.
owner: eoj
status: paused
executor: command
command: /bin/bash "/Users/joe/Desktop/Allternit/Allternit Brain/Ops/scripts/research-pipeline-sweep.sh"
budget:
  # Declared unit, not interpreted. One sweep run per fired check; about five
  # weeks of weekday runs before the campaign pauses and asks for a new limit.
  # This bounds recorded runs only. It does not cap any provider bill.
  unit: sweep-run
  limit: 25
  mode: additive
  per_wake: 1
rearm:
  weekdays: [mon, tue, wed, thu, fri]
  at: "09:05"
  timezone: America/Chicago

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "allternit-computer-use"
version = "0.1.0"
description = "Computer use domain with browser and desktop automation support"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Allternit Team", email = "team@allternit.dev"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Testing",
    "Topic :: Desktop Environment",
]

dependencies = [
    "pillow>=10.0.0",
    "numpy>=1.24.0",
    # Already used repeatedly via lazy import (vision_providers.py,
    # firecracker_sandbox.py, receipts/__init__.py, cloud_provisioning.py) but never actually declared -- drive-by fix.
    "httpx>=0.27.0",
]

[project.scripts]
allternit-computer = "gateway.daemon:main"

[project.optional-dependencies]
# The engine's Claude path: computer_toolset_20260801 / browser_toolset_20260801
# driver classes (anthropic.tools.computer / anthropic.tools.browser).
claude = [
    "anthropic>=1.12.0; python_version >= '3.10'",
]
# Browser automation dependencies
browser = [
    "playwright>=1.40.0",
    "websocket-client>=1.6.0",
    "requests>=2.31.0",
]

gateway = [
    "fastapi>=0.110.0",
    "pydantic>=2.0.0",
    "uvicorn[standard]>=0.27.0",
]

# Desktop automation dependencies
desktop = [
    "Pillow>=10.0.0",
    "mss>=9.0.0",
    # RFB/VNC client for VmGuiBackend (Firecracker guest display, tunneled
    # over vsock) -- see research/FIRECRACKER-GUEST-AGENT-VNC-SPEC.md
    "asyncvnc>=1.1.0",
]

desktop-macos = [
    "allternit-computer-use[desktop]",
    "pyobjc>=10.0",
    "pyobjc-framework-Quartz>=10.0",
    "pyobjc-framework-ApplicationServices>=10.0",
]

desktop-windows = [
    "allternit-computer-use[desktop]",
    "pywin32>=306; platform_system=='Windows'",
]

desktop-linux = [
    "allternit-computer-use[desktop]",
]

# All platform-specific desktop dependencies (auto-detects current platform)
desktop-all = [
    "allternit-computer-use[desktop]",
    "pyobjc>=10.0; platform_system=='Darwin'",
    "pyobjc-framework-Quartz>=10.0; platform_system=='Darwin'",
    "pyobjc-framework-ApplicationServices>=10.0; platform_system=='Darwin'",
    "pywin32>=306; platform_system=='Windows'",
]

# BYOC cloud credential SDKs -- not installed by default (they're heavy and
# only needed once an org actually connects a cloud account). Imported lazily
# inside cloud_provisioning.py's credential validators, gated by an
# importlib.util.find_spec check that raises a clear, actionable error
# rather than an opaque ImportError if this extra isn't installed.
byoc = [
    "boto3>=1.34.0",
    "google-cloud-compute>=1.19.0",
    "azure-identity>=1.15.0",
]

# Shadow-mode local policy head (core/decision_head.py): mlx-lm direct-logit
# head (Qwen3.5-4B class). Optional and lazily imported — the package imports
# and the full test suite pass without it (MockHead covers tests/evals).
# mlx is Apple-silicon only, matching the shadow head's fully-local target.
shadow-head = [
    "mlx-lm>=0.24.0; platform_machine=='arm64' and platform_system=='Darwin'",
]

# SemIf shadow head (core/semif_head.py): the community open-weights System
# One reproduction (github.com/TheoLeeCJ/SemIf, MIT) measured as a local-tier
# DecisionHead candidate. Installed from the SemIf git repo because it is not
# published to PyPI; its [mlx] extra pins mlx/mlx-lm (the mlx-lm pin carries
# SemIf's required upstream Qwen3.5 normalization fix, and supersedes the
# >=0.24.0 floor of [shadow-head] when both extras are installed). Optional
# and lazily imported, same contract as [shadow-head].
semif = [
    "allternit-computer-use[shadow-head]",
    # SemIf requires Python >= 3.10 (mlx); the project still supports 3.9
    # elsewhere, so the 3.9 split must not try to resolve this direct ref.
    "semif-phase1[mlx] @ git+https://github.com/TheoLeeCJ/SemIf ; python_version >= '3.10'",
]

# All dependencies (browser + desktop)
all = [
    "playwright>=1.40.0",
    "websocket-client>=1.6.0",
    "requests>=2.31.0",
    "mss>=9.0.0",
    "aiohttp>=3.8.0",
    "pyobjc>=10.0; platform_system=='Darwin'",
    "pyobjc-framework-Quartz>=10.0; platform_system=='Darwin'",
    "pyobjc-framework-ApplicationServices>=10.0; platform_system=='Darwin'",
    "pywin32>=306; platform_system=='Windows'",
]

dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[project.urls]
Homepage = "https://github.com/allternit/computer-use"
Repository = "https://github.com/allternit/computer-use"

[tool.setuptools.packages.find]
where = ["."]
include = ["adapters*", "contracts*", "core*", "gateway*", "observability*", "sandbox*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.yaml", "*.yml"]

[tool.setuptools.data-files]
"share/allternit-computer/launchd" = ["packaging/launchd/*.plist"]
"share/allternit-computer/systemd" = ["packaging/systemd/*.service"]
"share/allternit-computer/windows" = ["packaging/windows/*.xml"]
"share/allternit-computer" = ["packaging/README.md"]
"share/allternit-computer/evaluation" = ["evaluation/datasets/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.setuptools.cmdclass]
# Custom post-install hook would go here
# For now, users should run setup manually after install

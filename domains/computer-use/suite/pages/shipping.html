<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><style>body{font:16px -apple-system,system-ui,sans-serif;max-width:560px;margin:40px auto;padding:0 16px}label{display:block;margin:12px 0 4px}input,select{font:inherit;padding:6px;width:100%;box-sizing:border-box}input[type=checkbox]{width:auto}button{font:inherit;margin-top:16px;padding:8px 16px}.note{background:#fff7d6;padding:12px;border:1px solid #e0c96a}</style><title>Suite Shipping</title></head><body><h1>Shipping details</h1>
<form method="post" action="/submit/shipping">
<label for="n">Full name</label><input id="n" name="full_name"><label for="s">Street</label><input id="s" name="street">
<label for="c">City</label><input id="c" name="city"><label for="z">ZIP code</label><input id="z" name="zip">
<label for="co">Country</label><select id="co" name="country"><option value="">Choose…</option><option>United States</option><option>Canada</option><option>Mexico</option></select>
<label><input type="checkbox" name="express" value="yes"> Express delivery</label>
<button type="submit">Place order</button></form></body></html>

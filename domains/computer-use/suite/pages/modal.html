<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><style>body{font:16px -apple-system,system-ui,sans-serif;max-width:560px;margin:40px auto;padding:0 16px}label{display:block;margin:12px 0 4px}input,select{font:inherit;padding:6px;width:100%;box-sizing:border-box}input[type=checkbox]{width:auto}button{font:inherit;margin-top:16px;padding:8px 16px}.note{background:#fff7d6;padding:12px;border:1px solid #e0c96a}</style><title>Suite Drafts</title></head><body><h1>Drafts</h1><p>Draft #12: "Quarterly notes"</p>
<button id="del" onclick="document.getElementById('dlg').showModal()">Delete draft</button><p id="status" role="status"></p>
<dialog id="dlg" aria-labelledby="dt"><h2 id="dt">Delete draft #12?</h2>
<label><input type="checkbox" id="ok" onchange="document.getElementById('confirm').disabled=!this.checked"> I understand this can't be undone</label>
<button id="cancel" onclick="document.getElementById('dlg').close()">Cancel</button>
<button id="confirm" disabled onclick="fetch('/submit/modal',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'delete_draft',draft:'12',understood:document.getElementById('ok').checked})}).then(()=>{document.getElementById('dlg').close();document.getElementById('status').textContent='Draft deleted'})">Confirm delete</button></dialog></body></html>

name: Build hosted workspace UI
description: Checkout Allternit/allternit-ai and copy dist into desktop resources/platform. Never use the cloud console.

inputs:
  token:
    description: PAT that can read private Allternit/allternit-ai (ALLTERNIT_AI_CHECKOUT_TOKEN)
    required: true

runs:
  using: composite
  steps:
    - name: Checkout ai.allternit.com UI
      uses: actions/checkout@v4
      with:
        repository: Allternit/allternit-ai
        path: .hosted-ui
        token: ${{ inputs.token }}

    - name: Link this public repo as OSS package source
      shell: bash
      # Windows git-bash `ln -s` has no native symlink privileges on runners
      # and fails with "cannot overwrite directory". Use an NTFS junction
      # (no admin needed; Node/pnpm traverse junctions transparently).
      run: |
        rm -rf .hosted-ui/.oss-platform
        if [ "$RUNNER_OS" = "Windows" ]; then
          WIN_WS=$(cygpath -w "$GITHUB_WORKSPACE")
          (cd .hosted-ui && cmd //c "mklink /J .oss-platform \"$WIN_WS\"")
        else
          ln -sfn "$GITHUB_WORKSPACE" .hosted-ui/.oss-platform
        fi

    - name: Build workspace static export
      shell: bash
      working-directory: .hosted-ui
      env:
        NODE_OPTIONS: --max-old-space-size=8192
        NEXT_PUBLIC_ALLTERNIT_DESKTOP_AUTH: '1'
        VITE_ALLTERNIT_GATEWAY_URL: 'http://127.0.0.1:8013'
        NEXT_PUBLIC_ALLTERNIT_GATEWAY_URL: 'http://127.0.0.1:8013'
        NEXT_PUBLIC_ALLTERNIT_CLOUD_API_URL: 'https://api.allternit.com'
        VITE_CLOUD_API_URL: 'https://api.allternit.com'
      run: |
        corepack enable
        corepack prepare pnpm@10.28.0 --activate
        pnpm install --no-frozen-lockfile --ignore-scripts
        pnpm build

    - name: Copy static export into desktop resources
      shell: bash
      run: |
        DEST=surfaces/allternit-desktop/resources/platform
        rm -rf "$DEST"
        mkdir -p "$DEST"
        cp -r .hosted-ui/dist/. "$DEST/"
        test -f "$DEST/index.html"

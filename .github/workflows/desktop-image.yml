name: Build Allternit Desktop Image

on:
  push:
    branches: [main]
    paths:
      - 'cmd/allternit-computer-cloud/guest/**'
      - 'cmd/allternit-factory/**'
      - 'factory/**'
      - '.github/workflows/desktop-image.yml'
  workflow_dispatch:
    inputs:
      image_name:
        description: 'Incus image alias to publish'
        required: true
        default: 'allternit-desktop'
      import_to_vps:
        description: 'Import the built image into the VPS Incus daemon'
        required: true
        default: 'false'

jobs:
  build-linux-desktop:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Incus
        # Incus isn't in the Snap Store ("snap incus not found" since 2026-09-19);
        # Ubuntu 24.04 ships it in its archive. Commands run through sudo: a group
        # added with usermod doesn't reach later steps. Docker on the runner sets
        # FORWARD to DROP, which cuts Incus guests off the network.
        # protobuf-compiler + libssl-dev: allternit-factory's build (tonic-build, openssl-sys).
        run: |
          sudo apt-get update
          sudo apt-get install -y incus protobuf-compiler libssl-dev pkg-config
          sudo incus admin init --auto
          sudo iptables -P FORWARD ACCEPT

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Zig 0.15.2
        # The Factory pane engine links libghostty-vt, built by Zig 0.15.2
        # (factory/pane/build.rs). Pinned by checksum.
        run: |
          curl -fsSL https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz -o /tmp/zig.tar.xz
          echo "02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239  /tmp/zig.tar.xz" | sha256sum -c -
          sudo mkdir -p /opt/zig
          sudo tar -xJf /tmp/zig.tar.xz -C /opt/zig --strip-components=1
          echo "ZIG=/opt/zig/zig" >> "$GITHUB_ENV"
          /opt/zig/zig version

      - name: Build allternit-factory
        # The guest's terminals run on the Factory pane engine
        # (allternit-factory pane server; allternit-factory pane tty).
        run: cargo build --release -p allternit-factory

      - name: Build desktop image
        env:
          FACTORY_BIN: ${{ github.workspace }}/target/release/allternit-factory
          IMAGE_NAME: ${{ github.event.inputs.image_name || 'allternit-desktop' }}
        run: |
          sudo -E bash cmd/allternit-computer-cloud/guest/build-image.sh

      - name: Export image artifact
        run: |
          mkdir -p artifacts
          sudo incus image export "${{ github.event.inputs.image_name || 'allternit-desktop' }}" \
            "artifacts/allternit-desktop-${{ github.run_id }}"

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: allternit-desktop-image
          path: artifacts/*
          retention-days: 7

  import-to-vps:
    needs: build-linux-desktop
    runs-on: ubuntu-24.04
    if: github.event.inputs.import_to_vps == 'true'
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: allternit-desktop-image
          path: artifacts

      - name: Install SSH key
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps.key
          chmod 600 ~/.ssh/vps.key
          cat >> ~/.ssh/config <<EOF
          Host vps
            HostName $VPS_HOST
            User root
            IdentityFile ~/.ssh/vps.key
            StrictHostKeyChecking no
          EOF

      - name: Import image into VPS Incus
        env:
          IMAGE_NAME: ${{ github.event.inputs.image_name || 'allternit-desktop' }}
        run: |
          IMAGE_TAR=$(find artifacts -name '*.tar.gz' | head -n1)
          if [ -z "$IMAGE_TAR" ]; then
            echo "No exported image tarball found" >&2
            exit 1
          fi
          scp "$IMAGE_TAR" vps:/tmp/allternit-desktop-image.tar.gz
          ssh vps "incus image import /tmp/allternit-desktop-image.tar.gz --alias $IMAGE_NAME && rm -f /tmp/allternit-desktop-image.tar.gz"
          echo "Imported $IMAGE_NAME from $IMAGE_TAR"

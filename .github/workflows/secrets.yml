name: Secrets scan (gitleaks)

# Scans pull requests and new pushes for committed secrets.
# NOTE: this scans the diff (new/changed commits only). Git history before
# 2026-09-03 contains revoked secrets (see reports/2026-09-03-production-
# readiness-gap-analysis.md §Step 4) — history rewriting (BFG/git-filter-repo)
# and credential rotation are tracked there; this gate exists so no NEW
# secret lands.
#
# Runs the open-source gitleaks CLI (MIT) directly. The gitleaks-action
# wrapper needs a paid license key for repositories owned by an organization,
# and failed on every run after these repos moved to the Allternit org. The
# scanner itself is free; only that wrapper is licensed. Same .gitleaks.toml
# and .gitleaksignore as before.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks (verified release binary)
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "${base}/${tarball}"
          curl -fsSLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${tarball}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "${tarball}" gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan new commits
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            range="${PR_BASE}..HEAD"
          elif [ -n "${PUSH_BEFORE}" ] && [ "${PUSH_BEFORE}" != "0000000000000000000000000000000000000000" ]; then
            range="${PUSH_BEFORE}..HEAD"
          else
            range="HEAD~1..HEAD"
          fi
          echo "Scanning ${range}"
          gitleaks git --log-opts="${range}" --config .gitleaks.toml --redact --verbose --exit-code 1 .

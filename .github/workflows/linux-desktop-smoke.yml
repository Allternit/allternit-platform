name: Linux Desktop smoke

# Gates every Linux Desktop release. Installs the .deb in six clean distros
# (Ubuntu 18.04 / Debian 10 are the glibc 2.27 / 2.28 floor end),
# starts the bundled engine for real, then starts the app and checks that the
# startup window rendered. No sign-in and no secrets: see
# scripts/linux-desktop-lab/README.md.

on:
  workflow_call:
    inputs:
      deb_artifact:
        description: 'Name of an artifact (in this run) that holds the .deb'
        required: false
        type: string
        default: ''
      deb_url:
        description: 'URL of a .deb, used when deb_artifact is empty'
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      deb_url:
        description: 'URL of the .deb to test'
        required: true
        type: string
        default: 'https://github.com/Allternit/desktop/releases/download/v1.1.15/Allternit-Desktop-1.1.15-amd64.deb'

permissions:
  contents: read

jobs:
  smoke:
    name: smoke (${{ matrix.image }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:18.04', 'debian:10', 'debian:12', 'debian:13', 'ubuntu:22.04', 'ubuntu:24.04']
    env:
      LAB: scripts/linux-desktop-lab
      RES: /opt/Allternit Desktop/resources
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Get the .deb from the run's artifact
        if: ${{ inputs.deb_artifact != '' }}
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: ${{ inputs.deb_artifact }}
          path: deb-in

      - name: Get the .deb from a URL
        if: ${{ inputs.deb_artifact == '' }}
        env:
          DEB_URL: ${{ inputs.deb_url }}
        run: |
          [ -n "$DEB_URL" ] || { echo "::error::give deb_artifact or deb_url"; exit 1; }
          mkdir -p deb-in
          curl -fsSL -o deb-in/allternit.deb "$DEB_URL"

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'

      - name: Start a clean ${{ matrix.image }} container
        run: |
          set -euo pipefail
          deb=$(find deb-in -name "*.deb" | head -1)
          cp "$deb" /tmp/allternit.deb
          echo "testing $(basename "$deb")"
          slug="${{ matrix.image }}"; echo "SLUG=${slug//[:.]/}" >> "$GITHUB_ENV"
          # --network host: the runner's node drives the app's CDP port directly.
          docker run -d --name lab --network host \
            -v "$PWD/$LAB:/lab:ro" -v /tmp/allternit.deb:/tmp/allternit.deb:ro \
            "${{ matrix.image }}" sleep infinity
          # Debian 10 (buster) is end of life: its packages moved to archive.debian.org,
          # whose Release files are past Valid-Until.
          docker exec lab bash -c 'if grep -q "VERSION_CODENAME=buster" /etc/os-release; then
              printf "deb http://archive.debian.org/debian buster main\ndeb http://archive.debian.org/debian-security buster/updates main\n" > /etc/apt/sources.list
              rm -f /etc/apt/sources.list.d/*.list
              echo "Acquire::Check-Valid-Until \"false\";" > /etc/apt/apt.conf.d/99archive
            fi'
          docker exec lab bash -c 'apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq curl ca-certificates xvfb xauth dbus-x11 gnome-keyring libsecret-tools fonts-dejavu-core >/dev/null'

      - name: 1. apt-get install ./deb (its own Depends only)
        run: |
          docker exec lab bash -c 'cp /tmp/allternit.deb /tmp/a.deb && chmod 644 /tmp/a.deb && cd /tmp && DEBIAN_FRONTEND=noninteractive apt-get install -y ./a.deb 2>&1 | tail -5; exit ${PIPESTATUS[0]}' || { echo "::error::deb does not install on ${{ matrix.image }}"; exit 1; }
          docker exec lab bash -c 'dpkg -s allternit-desktop | grep -E "^(Package|Version)"'

      - name: 2. ELF glibc floor (whole app, Electron shell included)
        run: |
          if [ ! -f scripts/check-elf-floor.mjs ]; then
            echo "::notice::scripts/check-elf-floor.mjs is not on this ref (arrives with PR #2587); skipping"
            exit 0
          fi
          rm -rf /tmp/debx && mkdir /tmp/debx && dpkg-deb -x /tmp/allternit.deb /tmp/debx
          node scripts/check-elf-floor.mjs --dir "/tmp/debx/opt/Allternit Desktop" --shell allternit

      - name: 3. allternit-api starts and answers /health/live
        run: docker exec lab bash /lab/smoke-api.sh

      - name: 4. App starts and the startup window renders
        run: |
          set -uo pipefail
          mkdir -p shots
          docker exec lab bash /lab/smoke-app.sh tester
          mkdir -p /tmp/pw && (cd /tmp/pw && npm init -y >/dev/null && npm i --no-audit --no-fund playwright-core@1.49.1 >/dev/null)
          node "$LAB/smoke-cdp.cjs" /tmp/pw/node_modules/playwright-core 9222 shots
          cdp_rc=$?
          docker cp "lab:/home/tester/.config/@allternit/desktop/main.log" shots/main.log 2>/dev/null || echo "no main.log" > shots/main.log
          docker cp lab:/tmp/app.out shots/app.out 2>/dev/null || true
          docker cp lab:/tmp/smoke-api.log shots/smoke-api.log 2>/dev/null || true
          rc=$cdp_rc
          docker exec lab bash /lab/smoke-logs.sh tester || { echo "::error::app logs show a failed start"; rc=1; }
          [ "$cdp_rc" = 0 ] || echo "::error::startup window did not render"
          exit $rc

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: linux-smoke-${{ strategy.job-index }}-${{ env.SLUG }}
          path: shots
          if-no-files-found: warn
          retention-days: 14

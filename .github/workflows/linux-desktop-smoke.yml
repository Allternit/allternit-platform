name: Linux Desktop smoke

# Gates every Linux Desktop release. Installs the .deb in six clean distros
# (Ubuntu 18.04 / Debian 10 are the glibc 2.27 / 2.28 floor end), the .rpm in
# Fedora, and runs the AppImage on Ubuntu 24.04 (extract-and-run: no FUSE in
# docker). arch: arm64 runs the same legs on GitHub's ubuntu-24.04-arm runner
# (free for this public repo), so the distro images are their arm64 builds and
# nothing is emulated. Each leg starts the bundled engine for real, then starts the app
# and checks that the startup window rendered. No sign-in and no secrets: see
# scripts/linux-desktop-lab/README.md.

on:
  workflow_call:
    inputs:
      deb_artifact:
        description: 'Name of an artifact (in this run) that holds the .deb'
        required: false
        type: string
        default: ''
      deb_url:
        description: 'URL of a .deb, used when deb_artifact is empty'
        required: false
        type: string
        default: ''
      rpm_artifact:
        description: 'Name of an artifact (in this run) that holds the .rpm; empty skips the rpm leg'
        required: false
        type: string
        default: ''
      appimage_artifact:
        description: 'Name of an artifact (in this run) that holds the AppImage; empty skips the AppImage leg'
        required: false
        type: string
        default: ''
      arch:
        description: 'CPU of the packages: x64 or arm64 (picks the runner)'
        required: false
        type: string
        default: 'x64'
  workflow_dispatch:
    inputs:
      deb_url:
        description: 'URL of the .deb to test'
        required: true
        type: string
        default: 'https://github.com/Allternit/desktop/releases/download/v1.1.15/Allternit-Desktop-1.1.15-amd64.deb'
      arch:
        description: 'CPU of the .deb: x64 or arm64'
        required: false
        type: choice
        options: [x64, arm64]
        default: 'x64'

permissions:
  contents: read

jobs:
  smoke:
    name: smoke ${{ inputs.arch }} (${{ matrix.image }})
    runs-on: ${{ inputs.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:18.04', 'debian:10', 'debian:12', 'debian:13', 'ubuntu:22.04', 'ubuntu:24.04']
    env:
      LAB: scripts/linux-desktop-lab
      RES: /opt/Allternit Desktop/resources
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Get the .deb from the run's artifact
        if: ${{ inputs.deb_artifact != '' }}
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: ${{ inputs.deb_artifact }}
          path: deb-in

      - name: Get the .deb from a URL
        if: ${{ inputs.deb_artifact == '' }}
        env:
          DEB_URL: ${{ inputs.deb_url }}
        run: |
          [ -n "$DEB_URL" ] || { echo "::error::give deb_artifact or deb_url"; exit 1; }
          mkdir -p deb-in
          curl -fsSL -o deb-in/allternit.deb "$DEB_URL"

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'

      - name: Start a clean ${{ matrix.image }} container
        run: |
          set -euo pipefail
          deb=$(find deb-in -name "*.deb" | head -1)
          cp "$deb" /tmp/allternit.deb
          echo "testing $(basename "$deb")"
          slug="${{ matrix.image }}"; echo "SLUG=${slug//[:.]/}" >> "$GITHUB_ENV"
          # --network host: the runner's node drives the app's CDP port directly.
          docker run -d --name lab --network host \
            -v "$PWD/$LAB:/lab:ro" -v /tmp/allternit.deb:/tmp/allternit.deb:ro \
            "${{ matrix.image }}" sleep infinity
          # Debian 10 (buster) is end of life: its packages moved to archive.debian.org,
          # whose Release files are past Valid-Until.
          docker exec lab bash -c 'if grep -q "VERSION_CODENAME=buster" /etc/os-release; then
              printf "deb http://archive.debian.org/debian buster main\ndeb http://archive.debian.org/debian-security buster/updates main\n" > /etc/apt/sources.list
              rm -f /etc/apt/sources.list.d/*.list
              echo "Acquire::Check-Valid-Until \"false\";" > /etc/apt/apt.conf.d/99archive
            fi'
          docker exec lab bash -c 'apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq curl ca-certificates xvfb xauth dbus-x11 gnome-keyring libsecret-tools fonts-dejavu-core >/dev/null'

      - name: 1. apt-get install ./deb (its own Depends only)
        run: |
          docker exec lab bash -c 'cp /tmp/allternit.deb /tmp/a.deb && chmod 644 /tmp/a.deb && cd /tmp && DEBIAN_FRONTEND=noninteractive apt-get install -y ./a.deb 2>&1 | tail -5; exit ${PIPESTATUS[0]}' || { echo "::error::deb does not install on ${{ matrix.image }}"; exit 1; }
          docker exec lab bash -c 'dpkg -s allternit-desktop | grep -E "^(Package|Version)"'

      - name: 2. ELF glibc floor (whole app, Electron shell included)
        run: |
          if [ ! -f scripts/check-elf-floor.mjs ]; then
            echo "::notice::scripts/check-elf-floor.mjs is not on this ref (arrives with PR #2587); skipping"
            exit 0
          fi
          rm -rf /tmp/debx && mkdir /tmp/debx && dpkg-deb -x /tmp/allternit.deb /tmp/debx
          node scripts/check-elf-floor.mjs --dir "/tmp/debx/opt/Allternit Desktop" --shell allternit --arch "${{ inputs.arch || 'x64' }}"

      - name: 3. allternit-api starts and answers /health/live
        run: docker exec lab bash /lab/smoke-api.sh

      - name: 4. App starts and the startup window renders
        run: |
          set -uo pipefail
          mkdir -p shots
          docker exec lab bash /lab/smoke-app.sh tester
          mkdir -p /tmp/pw && (cd /tmp/pw && npm init -y >/dev/null && npm i --no-audit --no-fund playwright-core@1.49.1 >/dev/null)
          node "$LAB/smoke-cdp.cjs" /tmp/pw/node_modules/playwright-core 9222 shots
          cdp_rc=$?
          docker cp "lab:/home/tester/.config/@allternit/desktop/main.log" shots/main.log 2>/dev/null || echo "no main.log" > shots/main.log
          docker cp lab:/tmp/app.out shots/app.out 2>/dev/null || true
          docker cp lab:/tmp/smoke-api.log shots/smoke-api.log 2>/dev/null || true
          rc=$cdp_rc
          docker exec lab bash /lab/smoke-logs.sh tester || { echo "::error::app logs show a failed start"; rc=1; }
          [ "$cdp_rc" = 0 ] || echo "::error::startup window did not render"
          exit $rc

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: linux-smoke-${{ inputs.arch || 'x64' }}-${{ strategy.job-index }}-${{ env.SLUG }}
          path: shots
          if-no-files-found: warn
          retention-days: 14

  smoke-rpm:
    name: smoke rpm ${{ inputs.arch }} (${{ matrix.image }})
    if: ${{ inputs.rpm_artifact != '' }}
    runs-on: ${{ inputs.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        image: ['fedora:41']
    env:
      LAB: scripts/linux-desktop-lab
      RES: /opt/Allternit Desktop/resources
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Get the .rpm from the run's artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: ${{ inputs.rpm_artifact }}
          path: rpm-in

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'

      - name: Start a clean ${{ matrix.image }} container
        run: |
          set -euo pipefail
          rpm=$(find rpm-in -name "*.rpm" | head -1)
          cp "$rpm" /tmp/allternit.rpm
          echo "testing $(basename "$rpm")"
          slug="${{ matrix.image }}"; echo "SLUG=${slug//[:.]/}" >> "$GITHUB_ENV"
          docker run -d --name lab --network host \
            -v "$PWD/$LAB:/lab:ro" -v /tmp/allternit.rpm:/tmp/allternit.rpm:ro \
            "${{ matrix.image }}" sleep infinity
          docker exec lab bash -c 'dnf install -y -q curl xorg-x11-server-Xvfb xauth dbus-x11 gnome-keyring libsecret util-linux shadow-utils dejavu-sans-fonts >/dev/null'

      - name: 1. dnf install ./rpm (its own Requires only)
        run: |
          docker exec lab bash -c 'cp /tmp/allternit.rpm /tmp/a.rpm && chmod 644 /tmp/a.rpm && dnf install -y /tmp/a.rpm 2>&1 | tail -5; exit ${PIPESTATUS[0]}' || { echo "::error::rpm does not install on ${{ matrix.image }}"; exit 1; }
          docker exec lab bash -c 'rpm -q allternit-desktop; ls -l "/opt/Allternit Desktop/chrome-sandbox" /usr/bin/allternit; echo "package-type: $(cat "/opt/Allternit Desktop/resources/package-type")"'
          [ "$(docker exec lab cat '/opt/Allternit Desktop/resources/package-type')" = rpm ] || { echo "::error::post-install did not set package-type=rpm"; exit 1; }

      - name: 2. allternit-api starts and answers /health/live
        run: docker exec lab bash /lab/smoke-api.sh

      - name: 3. App starts and the startup window renders
        run: |
          set -uo pipefail
          mkdir -p shots
          docker exec lab bash /lab/smoke-app.sh tester
          mkdir -p /tmp/pw && (cd /tmp/pw && npm init -y >/dev/null && npm i --no-audit --no-fund playwright-core@1.49.1 >/dev/null)
          node "$LAB/smoke-cdp.cjs" /tmp/pw/node_modules/playwright-core 9222 shots
          cdp_rc=$?
          docker cp "lab:/home/tester/.config/@allternit/desktop/main.log" shots/main.log 2>/dev/null || echo "no main.log" > shots/main.log
          docker cp lab:/tmp/app.out shots/app.out 2>/dev/null || true
          rc=$cdp_rc
          docker exec lab bash /lab/smoke-logs.sh tester || { echo "::error::app logs show a failed start"; rc=1; }
          [ "$cdp_rc" = 0 ] || echo "::error::startup window did not render"
          exit $rc

      - name: 4. Upgrade in place keeps the command (rpm %postun runs after %post)
        run: |
          docker exec lab bash -c 'rpm -Uvh --replacepkgs /tmp/a.rpm >/dev/null 2>&1 || dnf reinstall -y /tmp/a.rpm >/dev/null; ls -l /usr/bin/allternit && test -e /usr/bin/allternit' || { echo "::error::/usr/bin/allternit missing after reinstall"; exit 1; }

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: linux-smoke-rpm-${{ inputs.arch || 'x64' }}-${{ env.SLUG }}
          path: shots
          if-no-files-found: warn
          retention-days: 14

  smoke-appimage:
    name: smoke AppImage ${{ inputs.arch }} (ubuntu:24.04)
    if: ${{ inputs.appimage_artifact != '' }}
    runs-on: ${{ inputs.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 25
    env:
      LAB: scripts/linux-desktop-lab
      RES: /opt/appx/squashfs-root/resources
      ALLTERNIT_BIN: /opt/Allternit.AppImage --appimage-extract-and-run
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Get the AppImage from the run's artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: ${{ inputs.appimage_artifact }}
          path: appimage-in

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'

      - name: Start a clean ubuntu:24.04 container
        run: |
          set -euo pipefail
          img=$(find appimage-in -name "*.AppImage" | head -1)
          cp "$img" /tmp/Allternit.AppImage && chmod 755 /tmp/Allternit.AppImage
          echo "testing $(basename "$img")"
          docker run -d --name lab --network host \
            -v "$PWD/$LAB:/lab:ro" -v /tmp/Allternit.AppImage:/opt/Allternit.AppImage:ro \
            ubuntu:24.04 sleep infinity
          # Only what a stock Ubuntu desktop already has (the AppImage brings the rest),
          # plus the test harness (Xvfb, dbus, keyring).
          docker exec lab bash -c 'apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq curl ca-certificates xvfb xauth dbus-x11 gnome-keyring libsecret-tools fonts-dejavu-core libgtk-3-0t64 libnss3 libgbm1 libasound2t64 libxss1 libxtst6 libnotify4 libsecret-1-0 xdg-utils >/dev/null'
          docker exec lab bash -c 'mkdir -p /opt/appx && cd /opt/appx && /opt/Allternit.AppImage --appimage-extract >/dev/null && ls /opt/appx/squashfs-root/allternit'

      - name: 1. allternit-api from the AppImage starts and answers /health/live
        run: docker exec -e RES="$RES" lab bash /lab/smoke-api.sh

      - name: 2. AppImage starts and the startup window renders
        run: |
          set -uo pipefail
          mkdir -p shots
          docker exec -e ALLTERNIT_BIN="$ALLTERNIT_BIN" lab bash /lab/smoke-app.sh tester
          mkdir -p /tmp/pw && (cd /tmp/pw && npm init -y >/dev/null && npm i --no-audit --no-fund playwright-core@1.49.1 >/dev/null)
          node "$LAB/smoke-cdp.cjs" /tmp/pw/node_modules/playwright-core 9222 shots
          cdp_rc=$?
          docker cp "lab:/home/tester/.config/@allternit/desktop/main.log" shots/main.log 2>/dev/null || echo "no main.log" > shots/main.log
          docker cp lab:/tmp/app.out shots/app.out 2>/dev/null || true
          rc=$cdp_rc
          docker exec lab bash /lab/smoke-logs.sh tester || { echo "::error::app logs show a failed start"; rc=1; }
          docker exec lab bash -c 'grep -h "appimageSandbox\|linuxUpdater" /home/tester/.config/@allternit/desktop/main.log 2>/dev/null | tail -4' || true
          [ "$cdp_rc" = 0 ] || echo "::error::startup window did not render"
          exit $rc

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: linux-smoke-appimage-${{ inputs.arch || 'x64' }}-ubuntu2404
          path: shots
          if-no-files-found: warn
          retention-days: 14

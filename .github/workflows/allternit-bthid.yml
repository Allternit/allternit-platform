name: Mac Bluetooth keyboard helper

# Plan step 10 done check: the shared AllternitBTHID package and
# cmd/allternit-bthid pass their unit tests (report map and report encoding,
# command parsing, state JSON), and the tool builds as a universal binary
# (arm64 + x86_64). The shipped copy is built in release-desktop.yml
# (build-macos). Nothing here advertises or touches Bluetooth: device checks
# are the owner's (plan check P2).
# Not on every push or PR: the build train dispatches or calls it.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  bthid:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - name: Package unit tests
        run: swift test --package-path surfaces/allternit-mobile/ios/Packages/AllternitBTHID
      - name: Tool unit tests
        run: swift test --package-path cmd/allternit-bthid
      - name: Universal release build
        run: |
          swift build -c release --arch arm64 --arch x86_64 --package-path cmd/allternit-bthid
          bin=cmd/allternit-bthid/.build/apple/Products/Release/allternit-bthid
          lipo -info "$bin"
          lipo -info "$bin" | grep -q 'x86_64 arm64\|arm64 x86_64'
          # The Bluetooth usage string is linked in (macOS kills a Bluetooth client without one).
          launchctl plist __TEXT,__info_plist "$bin" | grep -q NSBluetoothAlwaysUsageDescription

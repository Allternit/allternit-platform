name: Release Allternit Desktop

# Workspace UI is built from private Gizziio/allternit-ai via
# .github/actions/build-hosted-ui. Repo secret ALLTERNIT_AI_CHECKOUT_TOKEN
# must be a PAT (or GitHub App token) with read access to that repo.
# Do not package surfaces/platform.allternit.com — that is the cloud console.

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:
    inputs:
      draft:
        description: 'Publish as draft'
        required: false
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # Gate: unit tests must pass before any build job starts, so a release
  # can never be cut with failing unit tests.
  unit-tests:
    name: Desktop unit tests (vitest)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm
        run: npm install -g pnpm@10.28.0

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run desktop unit tests
        # vitest.config.ts scopes this to src/main/**/*.test.ts —
        # Playwright e2e specs in tests/ are NOT run here.
        run: pnpm --filter @allternit/desktop test

  # Preflight: catch packaging/configuration errors (missing sidecar build
  # steps, wrong toolchain pins, missing script paths, notarize hard-fail)
  # BEFORE the 40-60 minute per-platform builds start. See
  # scripts/release-preflight.mjs for the check list and the desktop-v1.1.1
  # incident it guards against.
  release-preflight:
    name: Release preflight
    needs: unit-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run release preflight checks
        run: node scripts/release-preflight.mjs

  # Build macOS .dmg (arm64 + x64, universal)
  build-macos:
    name: Build macOS
    needs: [unit-tests, release-preflight]
    runs-on: macos-latest
    permissions:
      contents: read
    env:
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # Release artifacts keep clean version-only names; the local build
      # wrapper (scripts/build-local.cjs) is what stamps -b<rev-count> and it
      # skips CI. Setting this explicitly keeps the artifactName env macro
      # deterministic on jobs that invoke electron-builder directly.
      ALLTERNIT_BUILD_SUFFIX: ""

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm
        run: npm install -g pnpm@10.28.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.1
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: allternit-api-macos

      # ── Step 1: Build workspace UI from private Gizziio/allternit-ai ────────
      - name: Build workspace UI (ai.allternit.com)
        uses: ./.github/actions/build-hosted-ui
        with:
          token: ${{ secrets.ALLTERNIT_AI_CHECKOUT_TOKEN }}

      # ── Step 2: Build gizzi-code (AI runtime — the brain) ───────────────────
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install gizzi-code dependencies
        # Root-level pnpm install (same pattern as publish-gizzi-code-npm.yml):
        # gizzi-code's @allternit/* workspace deps resolve via the root install.
        # A bare `bun install` in cmd/gizzi-code reads the committed bun.lock,
        # whose workspace paths were recorded from a foreign checkout layout,
        # and fails with "Workspace dependency not found" on a fresh clone.
        run: pnpm install --frozen-lockfile

      - name: Build gizzi-code workspace dependencies
        # Nested workspace packages ship gitignored dist/ output; build them
        # before bundling (orchestrator, request-scorer, gizzi-sdk, ...).
        run: |
          pnpm --filter "@allternit/gizzi-code^..." run build
          pnpm --filter "@allternit/gizzi-sdk" run build

      - name: Build gizzi-code (arm64)
        run: bun run script/build-production.js --target=darwin-arm64
        working-directory: cmd/gizzi-code

      - name: Build gizzi-code (x64)
        run: bun run script/build-production.js --target=darwin-x64
        working-directory: cmd/gizzi-code

      - name: Create universal gizzi-code binary
        run: |
          mkdir -p surfaces/allternit-desktop/resources/bin
          lipo -create \
            cmd/gizzi-code/dist/gizzi-code-darwin-arm64 \
            cmd/gizzi-code/dist/gizzi-code-darwin-x64 \
            -output surfaces/allternit-desktop/resources/bin/gizzi-code
          chmod +x surfaces/allternit-desktop/resources/bin/gizzi-code
          lipo -info surfaces/allternit-desktop/resources/bin/gizzi-code
          # gizzi-code does not statically link ripgrep; Glob/Grep need the
          # vendored rg next to the sidecar (<bin>/vendor/ripgrep/<arch>-<os>/).
          # Universal app: ship both arches, the runtime picks process.arch.
          for layout in arm64-darwin x64-darwin; do
            mkdir -p surfaces/allternit-desktop/resources/bin/vendor/ripgrep/$layout
            cp cmd/gizzi-code/vendor/ripgrep/$layout/rg surfaces/allternit-desktop/resources/bin/vendor/ripgrep/$layout/rg
            chmod +x surfaces/allternit-desktop/resources/bin/vendor/ripgrep/$layout/rg
          done

      # ── Step 3: Build Rust allternit-api for both architectures ─────────────
      - name: Install protobuf compiler
        # prost-build (allternit-agent-system-rails) shells out to protoc.
        run: brew install protobuf

      - name: Build allternit-api (x86_64)
        run: cargo build --release --target x86_64-apple-darwin --manifest-path cmd/allternit-api/Cargo.toml

      - name: Build allternit-api (aarch64)
        run: cargo build --release --target aarch64-apple-darwin --manifest-path cmd/allternit-api/Cargo.toml

      - name: Create universal allternit-api binary
        run: |
          mkdir -p surfaces/allternit-desktop/resources/bin
          lipo -create \
            target/x86_64-apple-darwin/release/allternit-api \
            target/aarch64-apple-darwin/release/allternit-api \
            -output surfaces/allternit-desktop/resources/bin/allternit-api
          chmod +x surfaces/allternit-desktop/resources/bin/allternit-api
          lipo -info surfaces/allternit-desktop/resources/bin/allternit-api

      # ── Step 3: Bundle Lima (universal limactl binary) ───────────────────────
      - name: Download Lima and create universal binary
        run: |
          mkdir -p resources/lima/darwin
          node scripts/download-lima.cjs arm64
          mv resources/lima/darwin/limactl resources/lima/darwin/limactl-arm64
          node scripts/download-lima.cjs x86_64
          mv resources/lima/darwin/limactl resources/lima/darwin/limactl-x86_64
          lipo -create resources/lima/darwin/limactl-arm64 resources/lima/darwin/limactl-x86_64 \
               -output resources/lima/darwin/limactl
          chmod +x resources/lima/darwin/limactl
          rm resources/lima/darwin/limactl-arm64 resources/lima/darwin/limactl-x86_64
          lipo -info resources/lima/darwin/limactl
        working-directory: surfaces/allternit-desktop

      # ── Step 3b: Stage mesh-node sidecar ─────────────────────────────────
      - name: Setup Go
        # Needed to build the mesh-node sidecar from source (the vendor tree
        # is gitignored, so prepare-mesh-node.cjs builds it via
        # infrastructure/mesh/tsnet-ios/build-sidecar.sh).
        uses: actions/setup-go@v5
        with:
          go-version-file: infrastructure/mesh/tsnet-ios/go.mod
          cache: false

      - name: Stage mesh-node sidecar
        # tsnet sidecar that gives the packaged app tailnet reachability
        # (src/main/mesh-manager.ts resolves resources/bin/mesh-node).
        # Stages into resources/bin/ ahead of electron-builder's
        # extraResources packing.
        run: node scripts/prepare-mesh-node.cjs
        working-directory: surfaces/allternit-desktop

      # ── Step 3c: Build voice service sidecar (Rust, sherpa-onnx) ────────────
      - name: Build voice service sidecar
        # Voice is a Rust crate (services/voice, bin name voice-service). STT
        # (Moonshine/Parakeet) and TTS (Kokoro) run inside the binary via
        # sherpa-onnx with statically-linked native libs — no whisper-cli,
        # no shared onnxruntime to ship. Model files download on first use
        # at runtime into ~/.allternit/models/voice/.
        # prepare-platform-static hard-requires resources/bin/allternit-voice-service.
        # Both apple targets are already installed for the allternit-api build.
        run: |
          cargo build --release -p voice-service --target x86_64-apple-darwin
          cargo build --release -p voice-service --target aarch64-apple-darwin
          mkdir -p surfaces/allternit-desktop/resources/bin
          lipo -create \
            target/x86_64-apple-darwin/release/voice-service \
            target/aarch64-apple-darwin/release/voice-service \
            -output surfaces/allternit-desktop/resources/bin/allternit-voice-service
          chmod +x surfaces/allternit-desktop/resources/bin/allternit-voice-service
          lipo -info surfaces/allternit-desktop/resources/bin/allternit-voice-service

      # ── Step 3d: Build local-engine sidecar (Rust) ──────────────────────────
      - name: Build local-engine sidecar
        # prepare-platform-static also hard-requires resources/bin/allternit-local-engine
        # (services/local-engine; cargo bin name is local-engine). Both macOS
        # targets are already installed for the allternit-api build above.
        run: |
          cargo build --release --target x86_64-apple-darwin --manifest-path services/local-engine/Cargo.toml
          cargo build --release --target aarch64-apple-darwin --manifest-path services/local-engine/Cargo.toml
          mkdir -p surfaces/allternit-desktop/resources/bin
          lipo -create             target/x86_64-apple-darwin/release/local-engine             target/aarch64-apple-darwin/release/local-engine             -output surfaces/allternit-desktop/resources/bin/allternit-local-engine
          chmod +x surfaces/allternit-desktop/resources/bin/allternit-local-engine
          lipo -info surfaces/allternit-desktop/resources/bin/allternit-local-engine

      # ── Step 3e: Build allternit-mux (PTY daemon) ───────────────────────────
      - name: Build allternit-mux sidecar
        # gizzi auto-spawns this for /pty. GizziManager resolves
        # resources/bin/allternit-mux first. Universal lipo matches api/gizzi.
        run: |
          cargo build --release -p allternit-mux --target x86_64-apple-darwin
          cargo build --release -p allternit-mux --target aarch64-apple-darwin
          mkdir -p surfaces/allternit-desktop/resources/bin
          lipo -create \
            target/x86_64-apple-darwin/release/allternit-mux \
            target/aarch64-apple-darwin/release/allternit-mux \
            -output surfaces/allternit-desktop/resources/bin/allternit-mux
          chmod +x surfaces/allternit-desktop/resources/bin/allternit-mux
          lipo -info surfaces/allternit-desktop/resources/bin/allternit-mux

      # ── Step 3f: Stage CUA Lume (Apple Virtualization) ──────────────────────
      - name: Stage Lume virtualization helper
        # allternit-api looks for Resources/bin/lume next to itself. The CUA
        # tarball is a launcher + lume.app; prepare-lume.cjs downloads both
        # darwin archs so electron-builder extraResources ${arch} overlays
        # the matching bundle into bin/.
        run: node scripts/prepare-lume.cjs arm64 x64
        working-directory: surfaces/allternit-desktop

      # ── Step 4: Patch checksums into manifest.ts ─────────────────────────────
      - name: Patch manifest.ts checksums
        run: |
          BINARY=surfaces/allternit-desktop/resources/bin/allternit-api
          MANIFEST=surfaces/allternit-desktop/src/main/manifest.ts
          # Compute separate checksums for each arch target
          X64_SHA=$(shasum -a 256 target/x86_64-apple-darwin/release/allternit-api | awk '{print $1}')
          ARM64_SHA=$(shasum -a 256 target/aarch64-apple-darwin/release/allternit-api | awk '{print $1}')
          sed -i '' "s|'x86_64-macos':   *''|'x86_64-macos':   '${X64_SHA}'|g" "$MANIFEST"
          sed -i '' "s|'aarch64-macos':  *''|'aarch64-macos':  '${ARM64_SHA}'|g" "$MANIFEST"

      # ── Step 5: Build and package Electron app ────────────────────────────────
      - name: Build open-connector sidecar bundle
        # services/open-connector is a plain npm project excluded from the
        # pnpm workspace. This step builds its single-file bundle
        # (resources/connector-sidecar/dist/server.mjs), which is what ships
        # inside the app — without it the packaged app has no connector
        # sidecar at all.
        run: node scripts/prepare-connector-sidecar.cjs
        working-directory: surfaces/allternit-desktop

      - name: Build System One (S1) binary + stage Laya scripts
        # bun build --compile tools/system-one-local/src/cli.ts → resources/bin/system-one,
        # tools/system-one-local/laya/*.sh → resources/laya/ (Q28, Q29).
        run: node scripts/prepare-system-one.cjs
        working-directory: surfaces/allternit-desktop

      - name: Install desktop dependencies
        # Deps are already installed by the earlier workspace-wide pnpm
        # install. Use pnpm (not npm): npm reifies over pnpm's symlinked
        # node_modules and runs update-electron-app's `prepare` (husky) even
        # with --ignore-scripts (run 5 failure); pnpm never runs registry
        # deps' prepare scripts.
        run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: surfaces/allternit-desktop

      - name: Build TypeScript
        run: npm run build
        working-directory: surfaces/allternit-desktop

      - name: Package with electron-builder
        # --publish never: publishing happens ONLY in the release job, which
        # collects artifacts from all build jobs. Never publish here.
        # Heap headroom: electron-builder walks/copies multi-GB resources
        # (platform export, sidecars) and died silently after "searching for
        # node modules" on the default heap in run 34311188333.
        env:
          NODE_OPTIONS: --max-old-space-size=12288
        run: npm run build:electron -- --publish never
        working-directory: surfaces/allternit-desktop

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: allternit-desktop-macos
          path: |
            surfaces/allternit-desktop/release/*.dmg
            surfaces/allternit-desktop/release/*.zip
            surfaces/allternit-desktop/release/*.blockmap
            surfaces/allternit-desktop/release/latest-mac.yml
          retention-days: 14

  # Build Windows NSIS installer
  build-windows:
    name: Build Windows
    needs: [unit-tests, release-preflight]
    # windows-latest ships only VS2026 (major 18), which node-gyp 11.x cannot
    # detect; windows-2019 is no longer provisioned. Install the VS2022 C++
    # build tools so native modules (better-sqlite3) can compile.
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install VS2022 C++ build tools (node-gyp)
        # windows-latest images no longer include a node-gyp-detectable Visual
        # Studio (only VS2026, which node-gyp 11.x reports as "unknown version
        # 18"); native modules like better-sqlite3 fail to compile without it.
        shell: pwsh
        run: |
          choco install visualstudio2022buildtools --yes --no-progress `
            --params "--add Microsoft.VisualStudio.Workload.VCTools --includeRecommended"
          choco install protoc --yes --no-progress

      - name: Install pnpm
        run: npm install -g pnpm@10.28.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.1
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: allternit-api-windows

      # ── Step 2: Build gizzi-code for Windows ─────────────────────────────────
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install gizzi-code dependencies
        # Root-level pnpm install (same pattern as publish-gizzi-code-npm.yml):
        # gizzi-code's @allternit/* workspace deps resolve via the root install.
        # A bare `bun install` in cmd/gizzi-code reads the committed bun.lock,
        # whose workspace paths were recorded from a foreign checkout layout,
        # and fails with "Workspace dependency not found" on a fresh clone.
        env:
          # windows-latest now also ships VS18 ("unknown version" to node-gyp
          # 11.x) and its PowerShell-based auto-detection crashes with a
          # maxBuffer RangeError before it ever considers the choco VS2022
          # build tools (run 12). Pinning GYP_MSVS_VERSION makes node-gyp go
          # straight to vswhere for the 17.x toolset we installed above.
          GYP_MSVS_VERSION: "2022"
        run: pnpm install --frozen-lockfile

      - name: Build gizzi-code workspace dependencies
        # Nested workspace packages ship gitignored dist/ output; build them
        # before bundling (orchestrator, request-scorer, gizzi-sdk, ...).
        run: |
          pnpm --filter "@allternit/gizzi-code^..." run build
          pnpm --filter "@allternit/gizzi-sdk" run build

      - name: Build gizzi-code (Windows x64)
        run: bun run script/build-production.js --target=win32-x64
        working-directory: cmd/gizzi-code

      - name: Copy gizzi-code binary
        shell: bash
        run: |
          mkdir -p surfaces/allternit-desktop/resources/bin
          cp cmd/gizzi-code/dist/gizzi-code-win32-x64.exe surfaces/allternit-desktop/resources/bin/gizzi-code.exe
          mkdir -p surfaces/allternit-desktop/resources/bin/vendor/ripgrep/x64-win32
          cp cmd/gizzi-code/vendor/ripgrep/x64-win32/rg.exe surfaces/allternit-desktop/resources/bin/vendor/ripgrep/x64-win32/rg.exe

      - name: Build workspace UI (ai.allternit.com)
        uses: ./.github/actions/build-hosted-ui
        with:
          token: ${{ secrets.ALLTERNIT_AI_CHECKOUT_TOKEN }}

      - name: Build allternit-api (Windows)
        run: cargo build --release --target x86_64-pc-windows-msvc --manifest-path cmd/allternit-api/Cargo.toml

      - name: Copy allternit-api binary
        shell: bash
        run: |
          mkdir -p surfaces/allternit-desktop/resources/bin
          cp target/x86_64-pc-windows-msvc/release/allternit-api.exe \
             surfaces/allternit-desktop/resources/bin/allternit-api.exe

      - name: Setup Go
        # Needed to build the mesh-node sidecar from source (the vendor tree
        # is gitignored, so prepare-mesh-node.cjs runs an equivalent go build
        # for win32-x64, mirroring release-gizzi-code.yml).
        uses: actions/setup-go@v5
        with:
          go-version-file: infrastructure/mesh/tsnet-ios/go.mod
          cache: false

      - name: Stage mesh-node sidecar
        # Stages resources/bin/mesh-node.exe ahead of electron-builder's
        # extraResources packing (src/main/mesh-manager.ts resolves it).
        run: node scripts/prepare-mesh-node.cjs
        working-directory: surfaces/allternit-desktop

      - name: Build voice service sidecar (Windows)
        # Voice is a Rust crate (services/voice, bin name voice-service).
        # STT (Moonshine/Parakeet) and TTS (Kokoro) run inside the binary via
        # sherpa-onnx with statically-linked native libs — no whisper-cli,
        # no onnxruntime DLL to ship. Model files download on first use at
        # runtime into %USERPROFILE%\.allternit\models\voice\.
        # prepare-platform-static requires resources/bin/allternit-voice-service.exe
        # on win32. The x86_64-pc-windows-msvc target is installed by the
        # dtolnay/rust-toolchain step above.
        shell: bash
        run: |
          cargo build --release -p voice-service --target x86_64-pc-windows-msvc
          mkdir -p surfaces/allternit-desktop/resources/bin
          cp target/x86_64-pc-windows-msvc/release/voice-service.exe \
             surfaces/allternit-desktop/resources/bin/allternit-voice-service.exe
          ls -lh surfaces/allternit-desktop/resources/bin/allternit-voice-service.exe

      # No allternit-mux on Windows: its API is a Unix socket (tokio UnixListener)
      # and gizzi's /pty integration dials that socket, so a Windows build would
      # not compile and could not be used. prepare-mux / verify-packaged-resources
      # skip it on win32 to match.

      - name: Build open-connector sidecar bundle
        # services/open-connector is a plain npm project excluded from the
        # pnpm workspace. This step builds its single-file bundle
        # (resources/connector-sidecar/dist/server.mjs), which is what ships
        # inside the app — without it the packaged app has no connector
        # sidecar at all.
        run: node scripts/prepare-connector-sidecar.cjs
        working-directory: surfaces/allternit-desktop

      - name: Build System One (S1) binary + stage Laya scripts
        # bun build --compile tools/system-one-local/src/cli.ts → resources/bin/system-one,
        # tools/system-one-local/laya/*.sh → resources/laya/ (Q28, Q29).
        run: node scripts/prepare-system-one.cjs
        working-directory: surfaces/allternit-desktop

      - name: Install desktop dependencies
        # Deps are already installed by the earlier workspace-wide pnpm
        # install. Use pnpm (not npm): npm reifies over pnpm's symlinked
        # node_modules and runs update-electron-app's `prepare` (husky) even
        # with --ignore-scripts (run 5 failure); pnpm never runs registry
        # deps' prepare scripts.
        run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: surfaces/allternit-desktop

      - name: Build TypeScript
        run: npm run build
        working-directory: surfaces/allternit-desktop

      - name: Package with electron-builder
        # --publish never: publishing happens ONLY in the release job, which
        # collects artifacts from all build jobs. Never publish here.
        # ALLTERNIT_ALLOW_MISSING_LOCAL_ENGINE: the local-engine crate's unix-only
        # deps are untested on the windows runner; 1.1.0 shipped without this
        # sidecar. Follow-up: make local-engine compile for windows and drop this.
        env:
          ALLTERNIT_ALLOW_MISSING_LOCAL_ENGINE: "1"
          NODE_OPTIONS: --max-old-space-size=12288
        run: npm run dist -- --publish never
        working-directory: surfaces/allternit-desktop

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: allternit-desktop-windows
          path: |
            surfaces/allternit-desktop/release/*.exe
            surfaces/allternit-desktop/release/*.blockmap
            surfaces/allternit-desktop/release/latest.yml
          retention-days: 14

  # Build Linux unpacked dir (smoke-test the linux electron-builder target;
  # artifacts are NOT attached to the GitHub release)
  build-linux:
    name: Build Linux
    needs: [unit-tests, release-preflight]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm
        run: npm install -g pnpm@10.28.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.1
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: allternit-api-linux

      # ── Step 2: Build gizzi-code for Linux ─────────────────────────────────
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install gizzi-code dependencies
        # Root-level pnpm install (same pattern as publish-gizzi-code-npm.yml):
        # gizzi-code's @allternit/* workspace deps resolve via the root install.
        # A bare `bun install` in cmd/gizzi-code reads the committed bun.lock,
        # whose workspace paths were recorded from a foreign checkout layout,
        # and fails with "Workspace dependency not found" on a fresh clone.
        run: pnpm install --frozen-lockfile

      - name: Build gizzi-code workspace dependencies
        # Nested workspace packages ship gitignored dist/ output; build them
        # before bundling (orchestrator, request-scorer, gizzi-sdk, ...).
        run: |
          pnpm --filter "@allternit/gizzi-code^..." run build
          pnpm --filter "@allternit/gizzi-sdk" run build

      - name: Build gizzi-code (Linux x64)
        run: bun run script/build-production.js --target=linux-x64
        working-directory: cmd/gizzi-code

      - name: Copy gizzi-code binary
        run: |
          mkdir -p surfaces/allternit-desktop/resources/bin
          cp cmd/gizzi-code/dist/gizzi-code-linux-x64 surfaces/allternit-desktop/resources/bin/gizzi-code
          chmod +x surfaces/allternit-desktop/resources/bin/gizzi-code
          mkdir -p surfaces/allternit-desktop/resources/bin/vendor/ripgrep/x64-linux
          cp cmd/gizzi-code/vendor/ripgrep/x64-linux/rg surfaces/allternit-desktop/resources/bin/vendor/ripgrep/x64-linux/rg
          chmod +x surfaces/allternit-desktop/resources/bin/vendor/ripgrep/x64-linux/rg

      - name: Build workspace UI (ai.allternit.com)
        uses: ./.github/actions/build-hosted-ui
        with:
          token: ${{ secrets.ALLTERNIT_AI_CHECKOUT_TOKEN }}

      - name: Install protobuf compiler
        # prost-build (transitive dep of allternit-api) shells out to protoc;
        # ubuntu runners don't ship it.
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Build allternit-api (Linux)
        run: cargo build --release --target x86_64-unknown-linux-gnu --manifest-path cmd/allternit-api/Cargo.toml

      - name: Copy allternit-api binary
        run: |
          mkdir -p surfaces/allternit-desktop/resources/bin
          cp target/x86_64-unknown-linux-gnu/release/allternit-api \
             surfaces/allternit-desktop/resources/bin/allternit-api
          chmod +x surfaces/allternit-desktop/resources/bin/allternit-api

      - name: Setup Go
        # Needed to build the mesh-node sidecar from source (the vendor tree
        # is gitignored, so prepare-mesh-node.cjs runs an equivalent go build
        # for linux-x64, mirroring release-gizzi-code.yml).
        uses: actions/setup-go@v5
        with:
          go-version-file: infrastructure/mesh/tsnet-ios/go.mod
          cache: false

      - name: Stage mesh-node sidecar
        # Stages resources/bin/mesh-node ahead of electron-builder's
        # extraResources packing (src/main/mesh-manager.ts resolves it).
        run: node scripts/prepare-mesh-node.cjs
        working-directory: surfaces/allternit-desktop

      - name: Build open-connector sidecar bundle
        # services/open-connector is a plain npm project excluded from the
        # pnpm workspace. This step builds its single-file bundle
        # (resources/connector-sidecar/dist/server.mjs), which is what ships
        # inside the app — without it the packaged app has no connector
        # sidecar at all.
        run: node scripts/prepare-connector-sidecar.cjs
        working-directory: surfaces/allternit-desktop

      - name: Build System One (S1) binary + stage Laya scripts
        # bun build --compile tools/system-one-local/src/cli.ts → resources/bin/system-one,
        # tools/system-one-local/laya/*.sh → resources/laya/ (Q28, Q29).
        run: node scripts/prepare-system-one.cjs
        working-directory: surfaces/allternit-desktop

      - name: Install desktop dependencies
        # Deps are already installed by the earlier workspace-wide pnpm
        # install. Use pnpm (not npm): npm reifies over pnpm's symlinked
        # node_modules and runs update-electron-app's `prepare` (husky) even
        # with --ignore-scripts (run 5 failure); pnpm never runs registry
        # deps' prepare scripts.
        run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: surfaces/allternit-desktop

      - name: Stage Cua Driver
        run: npm run prepare:cua-driver
        working-directory: surfaces/allternit-desktop

      - name: Download Lima
        run: npm run download:lima
        working-directory: surfaces/allternit-desktop

      - name: Build TypeScript
        run: npm run build
        working-directory: surfaces/allternit-desktop

      - name: Package with electron-builder
        # --dir: unpacked build only (no AppImage/deb), --publish never:
        # publishing happens ONLY in the release job.
        run: npx electron-builder --linux --dir --publish never
        working-directory: surfaces/allternit-desktop

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: allternit-desktop-linux
          path: |
            surfaces/allternit-desktop/release/linux-unpacked
          retention-days: 14

  # Publish GitHub Release
  release:
    name: Create GitHub Release
    needs: [release-preflight, build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          path: artifacts
          merge-multiple: true

      - name: Resolve version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/desktop-v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/desktop-v}"
          else
            VERSION="dev"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: desktop-v${{ steps.version.outputs.version }}
          name: Allternit Desktop v${{ steps.version.outputs.version }}
          body: |
            ## Allternit Desktop v${{ steps.version.outputs.version }}

            Fully bundled desktop app — no internet required after install.

            ### What's included
            - Allternit Platform UI (Next.js static — loads https://ai.allternit.com)
            - Allternit API backend (Rust, runs locally on :8013)
            - Gizzi AI runtime (Bun, runs locally on :4096)

            ### Downloads
            | Platform | File |
            |----------|------|
            | macOS (arm64 + x64) | `Allternit-*.dmg` |
            | Windows | `Allternit Setup *.exe` |

            Auto-updates are enabled — the app will notify you when a new version is available.
          files: |
            artifacts/*.dmg
            artifacts/*.zip
            artifacts/*.exe
            artifacts/*.blockmap
            artifacts/latest-mac.yml
            artifacts/latest.yml
          draft: ${{ github.event.inputs.draft == 'true' }}
          prerelease: ${{ contains(github.ref, '-alpha') || contains(github.ref, '-beta') || contains(github.ref, '-rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

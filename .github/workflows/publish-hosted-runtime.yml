name: Publish Hosted Runtime Image

on:
  push:
    branches: [main]
    paths:
      - "cmd/allternit-hosted-runtime/**"
      - "cmd/agent-daemon/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".dockerignore"
      - ".github/workflows/publish-hosted-runtime.yml"
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/allternit/allternit-hosted-runtime

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and publish hosted runtime
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cmd/allternit-hosted-runtime/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

name: Deploy allternit-api to Contabo

# Builds the data-plane binary and swaps it on mail (:8013). That restart is
# what applies refinery migrations V124–V130 on the live sqlite.

on:
  push:
    branches: [main]
    paths:
      - 'cmd/allternit-api/**'
      - 'mcp/protocol/**'
      - '.github/workflows/deploy-allternit-api-contabo.yml'
  workflow_dispatch:

jobs:
  # Test gate: the full suite must pass before any deploy. The API is
  # SQLite-based — its tests spin up throwaway sqlite databases (see
  # DbHandle::new_memory in src/db.rs), so unlike the cloud-api workflow no
  # postgres service container is required.
  test:
    # A newer commit supersedes an in-flight test run: cancel the older one.
    concurrency:
      group: deploy-allternit-api-test-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # allternit-api's release build (tests + binary) exceeds the runner's RAM
      # and gets OOM-killed (exit 137/143, 2026-09-30). Add swap and cap
      # parallel rustc jobs so the build finishes.
      - name: Add swap
        run: |
          sudo fallocate -l 12G /swapfile2 && sudo chmod 600 /swapfile2
          sudo mkswap /swapfile2 && sudo swapon /swapfile2
          free -h

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-api-contabo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-api-contabo-

      # Full suite in release mode, mirroring the VPS deploy loop and the
      # cloud-api workflow's test gate.
      - name: Test
        env:
          CARGO_BUILD_JOBS: "2"
        run: cargo test --release --target x86_64-unknown-linux-gnu -p allternit-api --features test-helpers

  deploy:
    needs: test
    # One deploy to Contabo at a time. Never cancel a deploy mid-swap; a newer
    # run waits, and GitHub keeps only the newest waiting run (older pending
    # ones are dropped), so an older build can never land after a newer one.
    concurrency:
      group: deploy-allternit-api-contabo
      cancel-in-progress: false
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # allternit-api's release build (tests + binary) exceeds the runner's RAM
      # and gets OOM-killed (exit 137/143, 2026-09-30). Add swap and cap
      # parallel rustc jobs so the build finishes.
      - name: Add swap
        run: |
          sudo fallocate -l 12G /swapfile2 && sudo chmod 600 /swapfile2
          sudo mkswap /swapfile2 && sudo swapon /swapfile2
          free -h

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-api-contabo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-api-contabo-

      - name: Build release binary
        env:
          CARGO_BUILD_JOBS: "2"
        run: cargo build --release --target x86_64-unknown-linux-gnu -p allternit-api

      # Boot the new binary on a throwaway database BEFORE touching prod. A
      # router panic (duplicate route, 2026-09-30 #1094) or a failing migration
      # (duplicate V205) dies here instead of crash-looping production.
      - name: Boot smoke test (fresh DB, before deploy)
        # /health is 503 here (no gizzi runtime on the runner); /health/live = booted and serving.
        run: |
          D=$(mktemp -d)
          ALLTERNIT_DATA_DIR=$D ALLTERNIT_API_PORT=18999 \
            target/x86_64-unknown-linux-gnu/release/allternit-api > $D/boot.log 2>&1 &
          PID=$!
          ok=""
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:18999/health/live > /dev/null; then ok=1; break; fi
            kill -0 $PID 2>/dev/null || break
            sleep 1
          done
          kill $PID 2>/dev/null || true
          if [ -z "$ok" ]; then
            echo "::error::new allternit-api did not boot on a fresh database; not deploying"
            tail -60 $D/boot.log
            exit 1
          fi
          echo "boot smoke OK in ${i}s"

      - name: Join Tailscale network
        continue-on-error: true
        uses: tailscale/github-action@v3
        with:
          oauth_client_id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth_client_secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci

      - name: Deploy to mail
        env:
          CONTABO_DEPLOY_HOST: 45.84.138.187
          CONTABO_DEPLOY_USER: root
          CONTABO_SSH_KEY: ${{ secrets.CONTABO_SSH_KEY }}
        run: |
          if [ -n "$CONTABO_SSH_KEY" ]; then
            echo "$CONTABO_SSH_KEY" > /tmp/deploy_key
            chmod 600 /tmp/deploy_key
            export CONTABO_SSH_KEY=/tmp/deploy_key
          else
            echo "No CONTABO_SSH_KEY secret — relying on Tailscale SSH."
            unset CONTABO_SSH_KEY
          fi
          bash cmd/allternit-api/deploy-contabo.sh \
            target/x86_64-unknown-linux-gnu/release/allternit-api
          rm -f /tmp/deploy_key

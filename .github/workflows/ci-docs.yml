name: Docs CI

on:
  push:
    branches: [main]
    paths:
      - 'surfaces/docs/**'
      - '.github/workflows/ci-docs.yml'
      - 'scripts/docs-lint.cjs'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'surfaces/docs/**'
      - '.github/workflows/ci-docs.yml'
      - 'scripts/docs-lint.cjs'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-build:
    name: Lint and build docs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install -g pnpm@10.28.0

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint docs links and examples
        run: pnpm docs:lint

      - name: Validate docs build
        run: pnpm --filter @allternit/docs build

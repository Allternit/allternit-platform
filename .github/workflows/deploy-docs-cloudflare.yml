name: Deploy Docs to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'surfaces/docs/**'
      - '.github/workflows/deploy-docs-cloudflare.yml'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  build-and-deploy:
    name: Build and deploy docs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate docs
        run: pnpm --filter @allternit/docs build

      - name: Export static docs
        working-directory: surfaces/docs
        run: pnpm export --output export.zip

      - name: Extract export
        working-directory: surfaces/docs
        run: |
          mkdir -p dist
          unzip -o export.zip -d dist

      # mint export has no robots.txt or sitemap.xml (Pages answered both with
      # the home page HTML). Also drops in the IndexNow key file.
      - name: Write robots.txt, sitemap.xml and IndexNow key
        working-directory: surfaces/docs
        run: node scripts/post-export.cjs dist

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy surfaces/docs/dist --project-name=allternit-docs --branch=main

      - name: Attach docs.allternit.com custom domain
        run: |
          curl -s -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects/allternit-docs/domains" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"name":"docs.allternit.com"}' || true

      # Tell IndexNow (Bing, which ChatGPT search and Copilot read, plus
      # Yandex, Seznam, Naver) about every docs page. Never fails the deploy.
      - name: Ping IndexNow
        continue-on-error: true
        run: node surfaces/docs/scripts/indexnow.mjs docs.allternit.com

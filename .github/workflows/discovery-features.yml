name: Discovery Features

# Disabled 2026-09-15: discovery artifacts live in Allternit/allternit-ai.

on:
  schedule:
    # Every Wednesday at 09:00 UTC (after the weekly news, so it can bundle it)
    - cron: '0 9 * * 3'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  generate:
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Import bookmarks
        run: node .github/scripts/import-bookmarks.cjs

      - name: Generate feature
        env:
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          X_RELAY_TOKEN: ${{ secrets.X_RELAY_TOKEN }}
          NEWSLETTER_SEND_TOKEN: ${{ secrets.NEWSLETTER_SEND_TOKEN }}
        run: node .github/scripts/generate-feature.cjs

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
          run_install: false

      - name: Install PDF renderer
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm exec playwright install --with-deps chromium

      - name: Generate PDF editions
        run: node .github/scripts/generate-pdf-editions.cjs --new

      - name: Commit and push if changed
        id: commit
        run: |
          echo "Discovery artifacts belong in Allternit/allternit-ai, not this public repo."
          echo "changed=false" >> "$GITHUB_OUTPUT"

      - name: Trigger Cloudflare Pages deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-cloudflare-pages.yml --ref main

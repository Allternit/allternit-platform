name: os-image

# AllternitOS Stage 2 step 27: build the pinned-kernel image and boot it in QEMU.
# Gate G2a: the serial log must show "kernel-check ok" and
# "ALLTERNIT-OS READY kernel-interface=1".
# Step 29 / gate G2c: the log must also show "shell-tool-call ok" (static llama.cpp answered
# one shell tool call); tok/s goes to the job summary.
# Step 30a: the disk has two read-only system slots (system-a, system-b) with dm-verity.
# The log must also show "verity: ok slot=a".
# Step 30b: each slot has its own root hash, the A/B boot state lives on the ESP, and the
# state partition is LUKS2 (TEST ONLY key in the initramfs; mkimage uses sudo cryptsetup).
# The good boot must also show "slot: booting slot=a", "state: luks open ok" and
# "slot: confirmed slot=a". A disk with system-a corrupted must print "verity: FAIL slot=a"
# and "slot: fallback from=a to=b" and come up on b, never "verity: ok slot=a". A bad update
# (corrupted image written to system-b by allternit-update, b active + unconfirmed) must
# print "slot: fallback from=b to=a" then READY on a, and confirm a.
# Step 31 (provenance + Secure Boot, TEST keys): every run generates fresh TEST keys (Ed25519
# update-signing key + Secure Boot PK/KEK/db) inside the job; private keys stay in the runner's
# os/target/image/keys and are never uploaded or committed. The UKI is sbsign-signed and booted
# under enforcing OVMF with the test keys enrolled: the log must start with
# "secureboot: enabled" and show "manifest: ok slot=a" and "state: luks digest ok". An unsigned
# UKI must be refused by firmware ("Access Denied"); allternit-update must refuse unsigned or
# mismatched updates; slot A is built twice and the sha256 compared. SBOM, signed manifests and
# the public keys/certs are uploaded as the os-provenance artifact; the Verify step checks the
# signatures with openssl.
# Step 32 (PC target): the boot-pc job builds `mkimage --target pc` (x86_64-pc.config, pinned
# linux-firmware blobs from os/image/firmware) and boots it under enforcing OVMF on emulated PC
# hardware (q35, AHCI then NVMe disk, e1000e, qemu-xhci + usb-kbd, std VGA). It requires the same
# serial lines as the vm job plus "init: partition state: /dev/vda4 -> /dev/" (PID 1 found the
# GPT partitions by name on the non-virtio disk). The vm job above is unchanged.
# Reads no repo or org secrets, deploys nothing.

on:
  pull_request:
    paths:
      - 'os/**'
      - 'domains/kernel/authority/**'
      - '.github/workflows/os-image.yml'
  push:
    branches: [main]
    paths:
      - 'os/**'
      - 'domains/kernel/authority/**'
      - '.github/workflows/os-image.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: os-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install build and boot dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            musl-tools qemu-system-x86 ovmf \
            build-essential cmake git bc bison flex libelf-dev libssl-dev xz-utils cpio curl file \
            systemd-ukify systemd-boot-efi python3-pefile gdisk dosfstools mtools e2fsprogs \
            cryptsetup-bin sbsigntool jq openssl uuid-runtime pipx
          # virt-fw-vars enrolls the test keys into a copy of the OVMF vars.
          pipx install virt-firmware
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Rust toolchain with the musl target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-unknown-linux-musl

      - name: Unit tests
        run: cargo test --manifest-path os/Cargo.toml

      - name: Cache kernel source and build tree
        uses: actions/cache@v4
        with:
          path: |
            os/target/image/cache
            os/target/image/kbuild
          key: os-kernel-${{ hashFiles('os/image/kernel/VERSION', 'os/image/kernel/x86_64-vm.config') }}

      - name: Cache static llama-server
        id: llama-cache
        uses: actions/cache@v4
        with:
          path: os/target/llama/llama-server
          key: os-llama-${{ hashFiles('os/model/LLAMA', 'os/model/build-llama.sh') }}

      - name: Build static llama-server
        if: steps.llama-cache.outputs.cache-hit != 'true'
        run: sh os/model/build-llama.sh

      - name: Cache the model GGUF
        id: model-cache
        uses: actions/cache@v4
        with:
          path: os/target/model/model.gguf
          key: os-model-${{ hashFiles('os/model/MODEL') }}

      - name: Download and verify the model GGUF
        run: |
          . os/model/MODEL
          mkdir -p os/target/model
          if [ ! -f os/target/model/model.gguf ]; then
            curl -fsSL -o os/target/model/model.gguf.part "$MODEL_URL"
            mv os/target/model/model.gguf.part os/target/model/model.gguf
          fi
          echo "$MODEL_SHA256  os/target/model/model.gguf" | sha256sum -c -

      - name: Build the image
        run: |
          sh os/tools/mkimage/mkimage.sh \
            --llama os/target/llama/llama-server --model os/target/model/model.gguf

      - name: Verify provenance (signatures, reproducibility, SBOM)
        run: |
          P=os/target/image/provenance
          for n in a b; do
            sh os/provenance/provenance.sh verify $P/update-pub.pem $P/manifest-$n.json $P/manifest-$n.sig
            jq -e '.slot == "'$n'" and .schema == 1' $P/manifest-$n.json
          done
          # the manifests name the SBOM and UKI that were really produced
          SBOM=$(sha256sum $P/sbom.spdx.json | cut -d' ' -f1)
          UKI=$(sha256sum os/target/image/allternit-os.efi | cut -d' ' -f1)
          jq -e --arg s "$SBOM" --arg u "$UKI" '.sbom_sha256 == $s and .uki_sha256 == $u' $P/manifest-a.json
          jq -e '.packages | length > 10' $P/sbom.spdx.json
          jq -e '.packages[] | select(.name == "llama.cpp" and .versionInfo == "b12823")' $P/sbom.spdx.json
          cat $P/reproducibility.txt
          # Run 46135958677 showed reproducible=yes after the debugfs time pinning: keep it a gate.
          grep -q '^reproducible=yes' $P/reproducibility.txt
          # no private key may sit in the upload folder
          if ls $P | grep -E '\.key$' | grep -v '^update-pub\.key$'; then echo 'private key in provenance folder'; exit 1; fi
          if grep -l 'PRIVATE KEY' $P/* 2>/dev/null; then echo 'private key material in provenance folder'; exit 1; fi

      - name: Check for /dev/kvm
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm || true
          fi
          ls -l /dev/kvm || echo "no /dev/kvm: the boot step falls back to TCG (600 s limit)"

      - name: Boot in QEMU, check the serial log, record tok/s
        run: sh os/tools/mkimage/qemu-boot.sh

      - name: Corrupted system-a must not boot; falls back to system-b (dm-verity negative case)
        run: sh os/tools/mkimage/qemu-boot.sh --corrupt-slot a

      - name: Bad update to system-b falls back to system-a (step 30b)
        run: sh os/tools/mkimage/qemu-boot.sh --bad-update

      - name: allternit-update refuses unsigned or mismatched updates (step 31)
        run: sh os/tools/mkimage/qemu-boot.sh --refused-update

      - name: Unsigned UKI must not boot under enforcing Secure Boot (step 31)
        run: sh os/tools/mkimage/qemu-boot.sh --unsigned-uki

      - name: Upload serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: os-serial-log
          path: |
            os/target/image/serial.log
            os/target/image/serial-bad-a.log
            os/target/image/serial-bad-update.log
            os/target/image/serial-unsigned-uki.log
          if-no-files-found: warn

      - name: Upload image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: os-image
          path: |
            os/target/image/bzImage
            os/target/image/allternit-os.efi
            os/target/image/allternit-os.img
            os/target/image/boot.env
          if-no-files-found: warn

      # Public files only: SBOM, signed manifests + signatures, public certs, update-pub.key/.pem.
      - name: Upload provenance (SBOM, signed manifests, public keys)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: os-provenance
          path: os/target/image/provenance/
          if-no-files-found: warn

  boot-pc:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install build and boot dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            musl-tools qemu-system-x86 ovmf \
            build-essential cmake git bc bison flex libelf-dev libssl-dev xz-utils cpio curl file \
            systemd-ukify systemd-boot-efi python3-pefile gdisk dosfstools mtools e2fsprogs \
            cryptsetup-bin sbsigntool jq openssl uuid-runtime pipx
          pipx install virt-firmware
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Rust toolchain with the musl target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-unknown-linux-musl

      - name: Cache kernel source, build tree and firmware tarball
        uses: actions/cache@v4
        with:
          path: |
            os/target/image-pc/cache
            os/target/image-pc/kbuild
          key: os-pc-kernel-${{ hashFiles('os/image/kernel/VERSION', 'os/image/kernel/x86_64-vm.config', 'os/image/kernel/x86_64-pc.config', 'os/image/firmware/LINUX_FIRMWARE', 'os/image/firmware/MANIFEST') }}

      - name: Cache static llama-server
        id: llama-cache
        uses: actions/cache@v4
        with:
          path: os/target/llama/llama-server
          key: os-llama-${{ hashFiles('os/model/LLAMA', 'os/model/build-llama.sh') }}

      - name: Build static llama-server
        if: steps.llama-cache.outputs.cache-hit != 'true'
        run: sh os/model/build-llama.sh

      - name: Cache the model GGUF
        id: model-cache
        uses: actions/cache@v4
        with:
          path: os/target/model/model.gguf
          key: os-model-${{ hashFiles('os/model/MODEL') }}

      - name: Download and verify the model GGUF
        run: |
          . os/model/MODEL
          mkdir -p os/target/model
          if [ ! -f os/target/model/model.gguf ]; then
            curl -fsSL -o os/target/model/model.gguf.part "$MODEL_URL"
            mv os/target/model/model.gguf.part os/target/model/model.gguf
          fi
          echo "$MODEL_SHA256  os/target/model/model.gguf" | sha256sum -c -

      - name: Build the PC image (--target pc)
        run: |
          sh os/tools/mkimage/mkimage.sh --target pc --out os/target/image-pc \
            --llama os/target/llama/llama-server --model os/target/model/model.gguf

      - name: Verify provenance and firmware (signatures, SBOM, licences, reproducibility)
        run: |
          P=os/target/image-pc/provenance
          F=os/target/image-pc/firmware
          for n in a b; do
            sh os/provenance/provenance.sh verify $P/update-pub.pem $P/manifest-$n.json $P/manifest-$n.sig
          done
          . os/image/firmware/LINUX_FIRMWARE
          # the SBOM names the pinned linux-firmware tag, its tarball sha256 and one package + licence per group
          jq -e --arg t "$FW_TAG" --arg s "$FW_SHA256" '.packages[] | select(.name == "linux-firmware" and .versionInfo == $t and .checksums[0].checksumValue == $s)' $P/sbom.spdx.json
          jq -e '[.packages[] | select(.name | startswith("linux-firmware-"))] | length >= 5' $P/sbom.spdx.json
          jq -e '[.packages[] | select(.name | startswith("linux-firmware-")) | .licenseDeclared | startswith("LicenseRef-")] | all' $P/sbom.spdx.json
          jq -e '.hasExtractedLicensingInfos | length >= 5' $P/sbom.spdx.json
          # every blob listed is in the image tree, and nothing else is
          test "$(wc -l < $F/firmware.list)" = "$(find $F/lib-firmware -type f | wc -l)"
          cat $F/groups.tsv
          ls -l os/target/image-pc/allternit-os.efi
          cat $P/reproducibility.txt
          grep -q '^reproducible=yes' $P/reproducibility.txt
          if grep -l 'PRIVATE KEY' $P/* 2>/dev/null; then echo 'private key material in provenance folder'; exit 1; fi

      - name: Check for /dev/kvm
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm || true
          fi
          ls -l /dev/kvm || echo "no /dev/kvm: the boot steps fall back to TCG (long limit)"

      - name: Boot the PC image in QEMU, disk on AHCI
        run: sh os/tools/mkimage/qemu-boot.sh --out os/target/image-pc --disk-bus ahci

      - name: Boot the PC image in QEMU, disk on NVMe
        run: sh os/tools/mkimage/qemu-boot.sh --out os/target/image-pc --disk-bus nvme

      - name: Upload serial logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: os-pc-serial-log
          path: |
            os/target/image-pc/serial-pc-ahci.log
            os/target/image-pc/serial-pc-nvme.log
          if-no-files-found: warn

      # Public files only. The image itself is large (it carries the firmware): not uploaded.
      - name: Upload provenance and firmware list
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: os-pc-provenance
          path: |
            os/target/image-pc/provenance/
            os/target/image-pc/firmware/firmware.list
            os/target/image-pc/firmware/groups.tsv
          if-no-files-found: warn

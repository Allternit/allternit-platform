name: os-image

# AllternitOS Stage 2 step 27: build the pinned-kernel image and boot it in QEMU.
# Gate G2a: the serial log must show "kernel-check ok" and
# "ALLTERNIT-OS READY kernel-interface=1".
# Step 29 / gate G2c: the log must also show "shell-tool-call ok" (static llama.cpp answered
# one shell tool call); tok/s goes to the job summary. Reads no secrets, deploys nothing.

on:
  pull_request:
    paths:
      - 'os/**'
      - '.github/workflows/os-image.yml'
  push:
    branches: [main]
    paths:
      - 'os/**'
      - '.github/workflows/os-image.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: os-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install build and boot dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            musl-tools qemu-system-x86 ovmf \
            build-essential cmake git bc bison flex libelf-dev libssl-dev xz-utils cpio curl file \
            systemd-ukify systemd-boot-efi python3-pefile gdisk dosfstools mtools e2fsprogs

      - name: Rust toolchain with the musl target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-unknown-linux-musl

      - name: Unit tests
        run: cargo test --manifest-path os/Cargo.toml

      - name: Cache kernel source and build tree
        uses: actions/cache@v4
        with:
          path: |
            os/target/image/cache
            os/target/image/kbuild
          key: os-kernel-${{ hashFiles('os/image/kernel/VERSION', 'os/image/kernel/x86_64-vm.config') }}

      - name: Cache static llama-server
        id: llama-cache
        uses: actions/cache@v4
        with:
          path: os/target/llama/llama-server
          key: os-llama-${{ hashFiles('os/model/LLAMA', 'os/model/build-llama.sh') }}

      - name: Build static llama-server
        if: steps.llama-cache.outputs.cache-hit != 'true'
        run: sh os/model/build-llama.sh

      - name: Cache the model GGUF
        id: model-cache
        uses: actions/cache@v4
        with:
          path: os/target/model/model.gguf
          key: os-model-${{ hashFiles('os/model/MODEL') }}

      - name: Download and verify the model GGUF
        run: |
          . os/model/MODEL
          mkdir -p os/target/model
          if [ ! -f os/target/model/model.gguf ]; then
            curl -fsSL -o os/target/model/model.gguf.part "$MODEL_URL"
            mv os/target/model/model.gguf.part os/target/model/model.gguf
          fi
          echo "$MODEL_SHA256  os/target/model/model.gguf" | sha256sum -c -

      - name: Build the image
        run: |
          sh os/tools/mkimage/mkimage.sh \
            --llama os/target/llama/llama-server --model os/target/model/model.gguf

      - name: Check for /dev/kvm
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm || true
          fi
          ls -l /dev/kvm || echo "no /dev/kvm: the boot step falls back to TCG (600 s limit)"

      - name: Boot in QEMU, check the serial log, record tok/s
        run: sh os/tools/mkimage/qemu-boot.sh

      - name: Upload serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: os-serial-log
          path: os/target/image/serial.log
          if-no-files-found: warn

      - name: Upload image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: os-image
          path: |
            os/target/image/bzImage
            os/target/image/allternit-os.efi
            os/target/image/allternit-os.img
            os/target/image/boot.env
          if-no-files-found: warn

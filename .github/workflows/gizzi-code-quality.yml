name: Gizzi Code Quality

on:
  push:
    branches: [main]
    paths:
      - 'cmd/gizzi-code/**'
      - '.github/workflows/gizzi-code-quality.yml'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'cmd/gizzi-code/**'
      - '.github/workflows/gizzi-code-quality.yml'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        # Full workspace install: gizzi-code imports packages it doesn't
        # declare (they resolve via the root node_modules, same as local
        # builds). A filtered install misses them and typecheck fails.
        run: |
          corepack enable
          corepack prepare pnpm@10.28.0 --activate
          pnpm install --frozen-lockfile

      - name: Build workspace package dependencies
        # Nested workspace packages ship gitignored dist/ output; build them
        # before typechecking. gizzi-sdk is used by imports but never declared
        # in package.json, so it needs an explicit build invocation.
        run: |
          pnpm --filter "@allternit/gizzi-code^..." run build
          pnpm --filter "@allternit/gizzi-sdk" run build

      - name: Typecheck
        working-directory: cmd/gizzi-code
        run: NODE_OPTIONS=--max-old-space-size=8192 bun run typecheck

  smoke:
    name: CI smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.28.0 --activate
          pnpm install --frozen-lockfile

      - name: Install bubblewrap (bash sandbox driver)
        # gizzi sandboxes Bash by default and fails closed without a driver
        # (bwrap on Linux). Ubuntu 24.04 blocks unprivileged user namespaces
        # through AppArmor, which bwrap needs; this runner is throwaway.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --ro-bind / / --dev /dev --proc /proc true && echo "bwrap ok"

      - name: Configure git identity
        # Test fixtures create temp repos and run `git commit`; runners have
        # no global identity, which fails those tests with exit 128.
        run: |
          git config --global user.email "ci@gizziio.com"
          git config --global user.name "Gizzi CI"

      - name: CI smoke test
        working-directory: cmd/gizzi-code
        shell: bash
        env:
          # Same as publish-gizzi-code-npm.yml: no usable bwrap on the runner,
          # and bash fails closed without it.
          GIZZI_SANDBOX_DISABLE: "1"
        run: |
          if [ ! -f script/ci-smoke-test.sh ]; then
            echo "::error::cmd/gizzi-code/script/ci-smoke-test.sh is missing."
            exit 1
          fi
          bash script/ci-smoke-test.sh

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.28.0 --activate
          pnpm install --frozen-lockfile

      # TODO(security-gates): `bun audit` currently reports known-vulnerable
      # dependencies that are NOT yet fixed upstream of the dependency-upgrade
      # wave. After that wave lands, make this job fail the build
      # (remove continue-on-error) and treat any new finding as a hard gate.
      - name: bun audit
        id: audit
        continue-on-error: true
        working-directory: cmd/gizzi-code
        run: |
          bun audit --json > bun-audit-report.json || true
          bun audit || true

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: gizzi-code-bun-audit
          path: cmd/gizzi-code/bun-audit-report.json
          if-no-files-found: warn

  ts-nocheck-ratchet:
    name: "@ts-nocheck ratchet"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Ratchet on `// @ts-nocheck` usage under cmd/gizzi-code/src: the count
      # may shrink but never grow (script/ts-nocheck-baseline.txt). Script only
      # needs bash+grep, so no toolchain setup here.
      #
      # continue-on-error is ON while the baseline is still huge (~3.7k files,
      # legacy mass-suppression). TODO(ratchet-hardening): remove
      # continue-on-error once the count is driven down to the agreed target
      # and make any increase a hard gate.
      - name: Check @ts-nocheck count
        continue-on-error: true
        working-directory: cmd/gizzi-code
        shell: bash
        run: bash script/check-ts-nocheck.sh

  # Secret scanning lives in .github/workflows/secrets.yml, which already scans
  # every pull request and push (this package included). A second copy here
  # spent CI minutes on the same diff.

name: Deploy Desktop Cloud VPS

on:
  push:
    branches: [main]
    paths:
      - 'cmd/allternit-api/**'
      - 'cmd/allternit-computer-cloud/**'
      - 'cmd/allternit-factory/**'
      - 'infrastructure/vps-desktop-cloud/**'
      - '.github/workflows/deploy-desktop-cloud-vps.yml'
  workflow_dispatch:

jobs:
  deploy-and-e2e:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Build release binary
        run: cargo build -p allternit-api --release

      - name: Check VPS secrets
        id: vps
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          HOST=$(printf '%s' "$VPS_HOST" | tr -d '\r\n')
          if [ -n "$HOST" ] && [ -n "$VPS_SSH_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "host=$HOST" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::VPS_HOST or VPS_SSH_KEY is empty; skipping remote deploy and e2e. Rust build already succeeded."
          fi

      - name: Install SSH key
        if: steps.vps.outputs.present == 'true'
        env:
          VPS_HOST: ${{ steps.vps.outputs.host }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps.key
          chmod 600 ~/.ssh/vps.key
          cat >> ~/.ssh/config <<EOF
          Host vps
            HostName ${VPS_HOST}
            User root
            IdentityFile ~/.ssh/vps.key
            StrictHostKeyChecking no
          EOF

      - name: Deploy binary and service
        if: steps.vps.outputs.present == 'true'
        run: |
          ssh vps "mkdir -p /opt/allternit-src/target/release /opt/allternit-src/infrastructure/vps-desktop-cloud"
          scp target/release/allternit-api vps:/opt/allternit-src/target/release/allternit-api
          scp infrastructure/vps-desktop-cloud/deploy.sh vps:/opt/allternit-src/infrastructure/vps-desktop-cloud/deploy.sh
          ssh vps "chmod +x /opt/allternit-src/infrastructure/vps-desktop-cloud/deploy.sh && cd /opt/allternit-src/infrastructure/vps-desktop-cloud && ./deploy.sh local"

      - name: Extract self-hosted setup token
        if: steps.vps.outputs.present == 'true'
        id: token
        run: |
          TOKEN=$(ssh vps "grep '^ALLTERNIT_SELF_HOSTED_SETUP_TOKEN=' /etc/allternit-api/api.env | cut -d= -f2")
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Seed e2e bot and templates
        if: steps.vps.outputs.present == 'true'
        env:
          SETUP_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          ssh vps "cd /opt/allternit-src/infrastructure/vps-desktop-cloud && SELF_HOSTED_TOKEN='$SETUP_TOKEN' ./seed-e2e.sh"

      # Workspace Playwright lived in Allternit/allternit-ai. This public repo
      # no longer has that tree. VPS seed above is the remaining check here.
      - name: Skip workspace Playwright (UI not in this repo)
        if: steps.vps.outputs.present == 'true'
        run: echo "desktop-cloud.spec.ts lives in Allternit/allternit-ai, not this public repo."

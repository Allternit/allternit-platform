name: Deploy Desktop Cloud VPS

on:
  push:
    branches: [main]
    paths:
      - 'cmd/allternit-api/**'
      - 'cmd/allternit-computer-cloud/**'
      - 'cmd/allternit-factory/**'
      - 'services/office-engine/**'
      - 'platform/packages/office-xlsx-engine/**'
      - 'infrastructure/vps-desktop-cloud/**'
      - '.github/workflows/deploy-desktop-cloud-vps.yml'
  workflow_dispatch:

jobs:
  deploy-and-e2e:
    # Own group: sharing deploy-allternit-api-contabo's group let each workflow
    # cancel the other's waiting run (2026-11-10). Both install the same
    # binary; deploy.sh takes the host lock and skips the binary when a newer
    # commit's build is already live (DEPLOY_SHA / DEPLOY_EPOCH below).
    concurrency:
      group: deploy-desktop-cloud-vps
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install protobuf compiler
        timeout-minutes: 10
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Build release binary
        run: cargo build -p allternit-api --release

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The engine bundle and the xlsx sidecar it runs. Node on the host runs the
      # bundle; the sidecar links against the runner's glibc (ubuntu-24.04, as prod).
      # Its failure must not hold up the API deploy: no release just means the
      # host keeps the engine it has.
      - name: Build office engine release
        # Off until the engine passes its two-account test and Eoj turns it on.
        if: ${{ vars.OFFICE_ENGINE_ENABLED == 'true' }}
        continue-on-error: true
        run: |
          cargo build --release --manifest-path platform/packages/office-xlsx-engine/crate/Cargo.toml
          pnpm install --frozen-lockfile --filter @allternit/office-engine-service...
          pnpm --filter @allternit/office-engine-service run build
          mkdir -p office-engine-release/engine/dist office-engine-release/bin
          cd services/office-engine
          pnpm dlx esbuild@0.25.12 dist/index.js --bundle --platform=node --format=esm --target=node20 \
            --external:@firecrawl/anydoc --external:@firecrawl/anydoc-* --external:canvas \
            --outfile=../../office-engine-release/engine/dist/index.js \
            "--banner:js=import{createRequire as __oeCreateRequire}from'node:module';const require=__oeCreateRequire(import.meta.url);"
          cd ../..
          echo '{"name":"@allternit/office-engine-bundled","private":true,"type":"module"}' > office-engine-release/engine/package.json
          cp target/release/allternit-xlsx-sidecar office-engine-release/bin/
          tar -czf office-engine.tar.gz -C office-engine-release .

      - name: Check VPS secrets
        id: vps
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          HOST=$(printf '%s' "$VPS_HOST" | tr -d '\r\n')
          if [ -n "$HOST" ] && [ -n "$VPS_SSH_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "host=$HOST" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::VPS_HOST or VPS_SSH_KEY is empty; skipping remote deploy and e2e. Rust build already succeeded."
          fi

      - name: Install SSH key
        if: steps.vps.outputs.present == 'true'
        env:
          VPS_HOST: ${{ steps.vps.outputs.host }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps.key
          chmod 600 ~/.ssh/vps.key
          cat >> ~/.ssh/config <<EOF
          Host vps
            HostName ${VPS_HOST}
            User root
            IdentityFile ~/.ssh/vps.key
            StrictHostKeyChecking no
          EOF

      - name: Deploy binary and service
        if: steps.vps.outputs.present == 'true'
        run: |
          ssh vps "mkdir -p /opt/allternit-src/target/release /opt/allternit-src/infrastructure/vps-desktop-cloud"
          scp target/release/allternit-api vps:/opt/allternit-src/target/release/allternit-api
          # A cut-short copy must stop here, before it reaches the service.
          HASH=$(sha256sum target/release/allternit-api | cut -d' ' -f1)
          ssh vps "echo '$HASH  /opt/allternit-src/target/release/allternit-api' | sha256sum -c -"
          scp infrastructure/vps-desktop-cloud/deploy.sh vps:/opt/allternit-src/infrastructure/vps-desktop-cloud/deploy.sh
          scp infrastructure/vps-desktop-cloud/allternit-office-engine.service vps:/opt/allternit-src/infrastructure/vps-desktop-cloud/allternit-office-engine.service
          if [ -f office-engine.tar.gz ]; then
            scp office-engine.tar.gz vps:/opt/allternit-src/infrastructure/vps-desktop-cloud/office-engine.tar.gz
            ENGINE_HASH=$(sha256sum office-engine.tar.gz | cut -d' ' -f1)
            ssh vps "echo '$ENGINE_HASH  /opt/allternit-src/infrastructure/vps-desktop-cloud/office-engine.tar.gz' | sha256sum -c -"
          fi
          DEPLOY_EPOCH="$(git log -1 --format=%ct "$GITHUB_SHA")"
          ssh vps "chmod +x /opt/allternit-src/infrastructure/vps-desktop-cloud/deploy.sh && cd /opt/allternit-src/infrastructure/vps-desktop-cloud && DEPLOY_SHA='$GITHUB_SHA' DEPLOY_EPOCH='$DEPLOY_EPOCH' ./deploy.sh local"

      - name: Extract self-hosted setup token
        if: steps.vps.outputs.present == 'true'
        id: token
        run: |
          TOKEN=$(ssh vps "grep '^ALLTERNIT_SELF_HOSTED_SETUP_TOKEN=' /etc/allternit-api/api.env | cut -d= -f2")
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Seed e2e bot and templates
        if: steps.vps.outputs.present == 'true'
        env:
          SETUP_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          ssh vps "cd /opt/allternit-src/infrastructure/vps-desktop-cloud && SELF_HOSTED_TOKEN='$SETUP_TOKEN' ./seed-e2e.sh"

      # Workspace Playwright lived in Allternit/allternit-ai. This public repo
      # no longer has that tree. VPS seed above is the remaining check here.
      - name: Skip workspace Playwright (UI not in this repo)
        if: steps.vps.outputs.present == 'true'
        run: echo "desktop-cloud.spec.ts lives in Allternit/allternit-ai, not this public repo."

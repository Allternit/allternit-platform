# Headscale configuration for allternit-headscale (Fly.io).
# Schema verified against headscale v0.29.2 config-example.yaml.
#
# NOTE (2026-10-17): this app is LEGACY. Production runs on the mail VPS
# (/etc/headscale/config.yaml there); the DERP block below was updated to
# match production (embedded DERP region 999 "allternit", no Tailscale-run
# relays) so the checked-in config stays truthful. This file is not deployed
# anywhere automatically.

# Public URL clients (tailscaled / tsnet) use to reach this control server.
# Fly terminates TLS at the edge and forwards plain HTTP to :8080.
server_url: https://allternit-headscale.fly.dev

listen_addr: 0.0.0.0:8080

# Metrics/debug endpoint; loopback-only (reach via `fly ssh` if needed).
metrics_listen_addr: 127.0.0.1:9090

# gRPC admin interface. Bound to all interfaces but NOT mapped in fly.toml
# [[services]], so it is reachable only over Fly's private 6PN network
# (allternit-headscale.internal:50443) — used by allternit-cloud-api to mint
# preauth keys. Insecure allowed because 6PN is WireGuard-encrypted already
# and there is no TLS cert for the .internal name.
grpc_listen_addr: 0.0.0.0:50443
grpc_allow_insecure: true

noise:
  private_key_path: /var/lib/headscale/noise_private.key

# Tailnet address space (standard Tailscale ranges; do not change).
prefixes:
  v4: 100.64.0.0/10
  v6: fd7a:115c:a1e0::/48
  allocation: sequential

# Relay map: match production — our own embedded DERP relay (region 999
# "allternit") plus STUN, and NO Tailscale-run relays (urls: []). On the VPS
# this serves derp over the same listener as the control plane and
# stun_listen_addr answers UDP :3478.
derp:
  server:
    enabled: true
    region_id: 999
    region_code: allternit
    region_name: allternit
    stun_listen_addr: 0.0.0.0:3478
  urls: []
  paths: []
  auto_update_enabled: false
  update_frequency: 3h

# We pin the image tag instead of self-checking for updates.
disable_check_updates: true

database:
  type: sqlite
  sqlite:
    path: /var/lib/headscale/db.sqlite
    write_ahead_log: true

log:
  level: info
  format: text

# Per-customer isolation: nodes may reach only nodes owned by the same
# headscale user (= the same customer); everything else is default-deny.
# See policy.hujson for the model and why it uses autogroup:self over
# user-owned nodes instead of per-customer ACL tags. The file is baked into
# the image by the Dockerfile.
policy:
  mode: file
  path: /etc/headscale/policy.hujson

dns:
  magic_dns: true
  # MagicDNS suffix for nodes, e.g. joes-mac.ts.allternit.internal
  # Must differ from the server_url domain.
  base_domain: ts.allternit.internal
  # Do not clobber client DNS; with no global nameservers configured,
  # only the MagicDNS base domain is resolved via the tailnet resolver.
  override_local_dns: false
  nameservers:
    global: []
    split: {}
  search_domains: []
  extra_records: []

# Unix socket the `headscale` CLI uses inside the machine (via `fly ssh`).
unix_socket: /var/run/headscale/headscale.sock
unix_socket_permission: "0770"

# Don't send node logs to Tailscale Inc.
logtail:
  enabled: false

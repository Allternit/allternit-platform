[package]
name = "uhp-gateway"
version = "0.1.0"
edition = "2021"
description = "UHP (Unified Harness Protocol) 2026-08-11 gateway over the factory pane engine (herdr fork) Unix-socket JSON-RPC API"

[dependencies]
axum = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
interprocess = "2.4.2"

[dev-dependencies]
tempfile = "3"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"

[lib]
name = "uhp_gateway"
path = "src/lib.rs"

[[bin]]
name = "uhp-gateway"
path = "src/bin/uhp-gateway.rs"

[package]
name = "allternit-cron-parser"
version = "0.1.0"
edition = "2021"
description = "Natural language schedule parser - converts human-readable descriptions to cron expressions"
authors = ["Allternit Team"]
license = "MIT"
repository = "https://github.com/Allternit/allternit-platform"
homepage = "https://github.com/Allternit/allternit-platform"
keywords = ["cron", "schedule", "parser", "natural-language", "recurrence"]
categories = ["date-and-time", "parser-implementations"]
rust-version = "1.80"

[dependencies]
chrono = { workspace = true }
regex = { workspace = true }
once_cell = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
cron = { workspace = true }
chrono-tz = "0.9"

[dev-dependencies]
tokio-test = { workspace = true }

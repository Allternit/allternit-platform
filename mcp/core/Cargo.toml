[package]
name = "mcp"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/allternitchitect/allternit"
description = "Allternit integration layer (policy, tool bridge, tools-gateway provider) over the mcp-client crate"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["full"] }
thiserror = "1.0"
async-trait = "0.1"
tracing = "0.1"
reqwest = { workspace = true, features = ['json', 'stream'] }
chrono = { version = "0.4", features = ["serde"] }
base64 = { workspace = true }
sha2 = "0.10"
rand = "0.8"
futures = "0.3"
futures-util = "0.3"
uuid = { version = "1.6", features = ["v4"] }

# The one MCP client implementation (protocol, transports, OAuth, registry)
mcp-client = { workspace = true }

# Specific dependencies
sqlx = { workspace = true }
bytes = "1.5"

# Allternit SDK dependencies
allternit-sdk-core = { workspace = true }
allternit-sdk-policy = { workspace = true }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.8"
axum = { workspace = true }

[lib]
name = "mcp"
path = "src/lib.rs"

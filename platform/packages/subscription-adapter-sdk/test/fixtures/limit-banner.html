<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>fixture-web — limit banners</title></head>
  <body data-state="limited">
    <header>
      <div data-testid="fw-user-menu" class="fw-user-menu">fixture-user</div>
    </header>
    <main>
      <div data-testid="fw-banner-soft" class="fw-banner fw-banner-soft" role="alert">
        You are approaching your usage limit for this period.
      </div>
      <div data-testid="fw-banner-hard" class="fw-banner fw-banner-hard" role="alert">
        Limit reached. Your usage limit resets at midnight.
      </div>
      <div
        id="fw-composer"
        data-testid="fw-composer"
        role="textbox"
        aria-label="Message fixture-web"
        contenteditable="true"
      ></div>
      <button id="fw-send" data-testid="fw-send" type="button">Send</button>
    </main>
    <script>
      document.getElementById("fw-send").addEventListener("click", () => {
        document.body.dataset.fwSubmitted = "click";
        // Like real providers: Send takes the prompt out of the composer.
        document.getElementById("fw-composer").textContent = "";
        const ta = document.getElementById("fw-composer-textarea");
        if (ta) ta.value = "";
      });
    </script>
  </body>
</html>

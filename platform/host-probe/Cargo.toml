[package]
name = "host-probe"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Read-only host collector for the Computers console: CPU, memory, disks, network, OS (GET /v1/host/snapshot)."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
regex = { workspace = true }
dirs = { workspace = true }
uuid = { workspace = true }
sysinfo = "0.30"
# Cloud approval ids (approval.rs): HMAC-SHA256 keyed by the relay key.
hmac = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
# Feature `http`: the shared /v1/host/* axum routes (allternit-api, ao shim).
axum = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }

[features]
http = ["dep:axum", "dep:tokio", "dep:futures-util"]

[dev-dependencies]
tokio = { workspace = true }
tower = { workspace = true, features = ["util"] }

[target.'cfg(windows)'.dependencies]
# Named pipe channel to the SYSTEM helper (elevation/win.rs).
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

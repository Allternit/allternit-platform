[package]
name = "allternit-protocol"
version = "0.1.0"
edition = "2021"
authors = ["Allternit Team <team@allternit.io>"]
license = "MIT OR Apache-2.0"
description = "Shared protocol types for Allternit node-control plane communication"
repository = "https://github.com/Allternit/allternit-platform"
homepage = "https://github.com/Allternit/allternit-platform"
keywords = ["protocol", "messaging", "control-plane", "agent"]
categories = ["network-programming"]
rust-version = "1.80"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }

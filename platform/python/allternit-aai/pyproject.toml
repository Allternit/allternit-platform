[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "allternit-aai"
version = "0.1.0"
description = "Python client for the Allternit Agent Interface (AAI) REST surface."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/allternit_aai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

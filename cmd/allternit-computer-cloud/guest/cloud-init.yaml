#cloud-config
#
# Reproducible Ubuntu 24.04 desktop guest for Allternit Computer Cloud.
# Designed for Incus containers (works on VMs too). Boots into an XFCE
# desktop on Xvfb with x11vnc on TCP/5900.

package_update: true

packages:
  - xfce4
  - xvfb
  - x11vnc
  - scrot
  - xdotool
  - dbus-x11
  - xfonts-base
  - fonts-dejavu-core
  - curl
  - ca-certificates
  - wget
  - gnupg
  # Allternit Driver runtime (phase D1b): the structured computer-toolset
  # sidecar. The driver package itself lands at /opt/allternit-driver from
  # the CI image pipeline, like the allternit-factory binary; the unit is
  # inert until then (ConditionPathExists).
  - python3
  - python3-pyatspi
  - at-spi2-core
  - libatk-adaptor
  - libatk-bridge2.0-0
  - python3-pil

# Let Incus DHCP supply the bridge-local DNS resolver (10.1.x.1). Hard-coding
# public DNS here broke outbound resolution on this host because the container
# network is NATed through incusbr0 and the public resolvers are not reachable.

write_files:
  - path: /opt/allternit-desktop/run.sh
    owner: root:root
    permissions: "0755"
    content: |
      #!/bin/bash
      set -e
      export DISPLAY=:0
      export HOME=/root
      mkdir -p /var/log/allternit-desktop /run/allternit

      # Start the in-memory X server.
      Xvfb :0 -screen 0 1280x720x24 -ac +extension GLX +render -noreset \
        >/var/log/allternit-desktop/xvfb.log 2>&1 &

      # Give Xvfb a moment to come up.
      sleep 2

      # One D-Bus session for the whole desktop, published where system
      # services (the Allternit Driver) can find it: AT-SPI's registry
      # answers on this bus.
      if [ -z "${DBUS_SESSION_BUS_ADDRESS:-}" ]; then
        eval "$(dbus-launch --sh-syntax)"
      fi
      printf 'DBUS_SESSION_BUS_ADDRESS=%s\n' "${DBUS_SESSION_BUS_ADDRESS}" \
        > /run/allternit/session-bus.env
      chmod 0644 /run/allternit/session-bus.env
      export GTK_MODULES=atk-bridge

      # Start the XFCE session (on this bus, so its apps expose AT-SPI trees).
      xfce4-session >/var/log/allternit-desktop/xfce.log 2>&1 &

      # Share the display over VNC (password = allternit for the MVP).
      x11vnc -display :0 -rfbport 5900 -forever -shared -passwd allternit \
        >/var/log/allternit-desktop/x11vnc.log 2>&1 &

      # Keep the service alive so systemd does not kill the cgroup.
      wait

  - path: /etc/systemd/system/allternit-desktop.service
    owner: root:root
    permissions: "0644"
    content: |
      [Unit]
      Description=Allternit agent desktop
      After=network.target systemd-user-sessions.service

      [Service]
      Type=simple
      ExecStart=/opt/allternit-desktop/run.sh
      ExecStop=/bin/kill -TERM $MAINPID
      KillMode=mixed
      Restart=on-failure
      RestartSec=5

      [Install]
      WantedBy=multi-user.target

  - path: /etc/systemd/system/allternit-factory-pane.service
    owner: root:root
    permissions: "0644"
    content: |
      [Unit]
      Description=Allternit Factory pane engine (guest terminals)
      After=network.target systemd-user-sessions.service
      ConditionPathExists=/opt/allternit-factory/allternit-factory

      [Service]
      Type=simple
      Environment="HOME=/root"
      Environment="HERDR_SESSION=ao"
      ExecStart=/opt/allternit-factory/allternit-factory pane server
      ExecStop=/bin/kill -TERM $MAINPID
      KillMode=mixed
      Restart=on-failure
      RestartSec=5

      [Install]
      WantedBy=multi-user.target

  - path: /etc/systemd/system/allternit-driver.service
    owner: root:root
    permissions: "0644"
    content: |
      # The Allternit Driver (phase D1b). Enabled here; starts once the CI
      # image pipeline places the package at /opt/allternit-driver (the same
      # pipeline that places the allternit-factory binary).
      [Unit]
      Description=Allternit Driver (computer-use sidecar)
      After=allternit-desktop.service network.target
      ConditionPathExists=/opt/allternit-driver/allternit_driver

      [Service]
      Type=simple
      Environment=DISPLAY=:0
      Environment=HOME=/root
      Environment=PYTHONPATH=/opt/allternit-driver
      EnvironmentFile=-/run/allternit/session-bus.env
      ExecStart=/usr/bin/python3 -m allternit_driver --listen unix:/run/allternit/driver.sock --engine auto --state-dir /var/lib/allternit/driver
      ExecStop=/bin/kill -TERM $MAINPID
      KillMode=mixed
      Restart=on-failure
      RestartSec=5
      RuntimeDirectory=allternit
      StateDirectory=allternit/driver

      [Install]
      WantedBy=multi-user.target

  - path: /usr/local/bin/allternit-driver-rpc
    owner: root:root
    permissions: "0755"
    content: |
      #!/bin/sh
      # allternit-api -> guest agent -> this -> the driver's local socket.
      exec /usr/bin/python3 /opt/allternit-driver/guest-rpc.py "$@"

runcmd:
  # Install Google Chrome stable for remote CDP browser automation.
  - wget -q -O /usr/share/keyrings/google-chrome.gpg https://dl-ssl.google.com/linux/linux_signing_key.pub
  - echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" > /etc/apt/sources.list.d/google-chrome.list
  - apt-get update -y
  - apt-get install -y google-chrome-stable
  - systemctl daemon-reload
  - systemctl enable allternit-desktop.service
  - systemctl start allternit-desktop.service
  - systemctl enable allternit-factory-pane.service
  - systemctl enable allternit-driver.service
  # Do not start allternit-factory-pane here; the binary is placed by the CI
  # image pipeline (Phase 15). When present, systemd will start it on next boot.

final_message: "Allternit desktop guest is ready."

[package]
name = "allternit-api"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "allternit-api"
path = "src/main.rs"

[dependencies]
# Vendored OpenSSL: allternit-api links openssl transitively (webauthn-rs-core),
# and CI cross-compiles x86_64-apple-darwin from arm64 hosts where no
# x86_64 Homebrew openssl exists. Vendoring builds openssl from source for
# whatever target is being compiled.
openssl = { version = "0.10", features = ["vendored"] }
# Web framework
axum = { workspace = true, features = ["ws"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# OpenTelemetry: workspace-pinned, off by default — activated only when
# OTEL_EXPORTER_OTLP_ENDPOINT is set (see src/otel.rs).
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-http = { workspace = true, features = ["reqwest"] }
tracing-opentelemetry = { workspace = true }
tower = { workspace = true }
reqwest = { workspace = true, features = ['json', 'stream'] }
async-stream = { workspace = true }
axum-extra = { version = "0.9", features = ["typed-header"] }
urlencoding = { workspace = true }
tokio-util = { workspace = true }
http-body-util = { workspace = true }
bytes = { workspace = true }
regex = { workspace = true }
# VNC "VNC authentication" (DES) challenge-response for the ws proxy's
# server-side password injection (guest x11vnc password never reaches the browser)
des = "0.8"
cipher = "0.4"

# Internal crates - the Factory engine & Cowork
allternit-factory-engine = { path = "../../factory/engine" }
allternit-cowork-runtime = { path = "../../infrastructure/executor/cowork/cowork/allternit-cowork-runtime" }
allternit-cowork-scheduler = { path = "../../infrastructure/executor/cowork/cowork/allternit-cowork-scheduler" }
allternit-gc-agents = { workspace = true }

# Internal crates - Execution
allternit-driver-interface = { path = "../../platform/contracts/driver-interface" }
allternit-session-manager = { path = "../../services/session-manager" }
allternit-computer-cloud = { path = "../../cmd/allternit-computer-cloud" }
allternitos-cloud-contracts = { workspace = true }

# WebSocket
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
futures = "0.3"

# SQLite
rusqlite = { version = "0.31", features = ["bundled", "chrono"] }
refinery = { version = "0.9", features = ["rusqlite"] }

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.9"
thiserror = "1"
rand = "0.8"
anyhow = "1"
dirs = "5"
include_dir = "0.7"
# v10 requires an explicit crypto-provider feature; aws_lc_rs matches the
# provider `auth`'s RS256 path already uses process-wide.
jsonwebtoken = { version = "10", features = ["aws_lc_rs"] }
aws-lc-rs = "1"
async-trait = "0.1"
hostname = "0.4"
hex = "0.4"
once_cell = { workspace = true }
rustls-pemfile = "2"

# HTTP middleware
tower-http = { workspace = true, features = ["fs", "cors", "set-header"] }

# Metrics
prometheus = { workspace = true }

# Crypto
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
md5 = "0.7"
aes-gcm = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
webauthn-rs = "0.5"
url = "2"

# SSH client
russh = "0.60"

# PNG Rendering dependencies
resvg = "0.41"
usvg = "0.41"
tiny-skia = "0.11"
image = "0.24"
base64 = "0.22"
mcp-client = { workspace = true }
mcp-protocol = { workspace = true }

# PDF Rendering dependencies
printpdf = "0.6"

# Token counting
tiktoken-rs = "0.12.0"
instant-distance = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
allternit-apple-vf-driver = { path = "../../drivers/apple-vf" }

# Firecracker is Unix-only (tokio::net::UnixStream, nix); the driver never
# compiles for Windows and the api only mounts it under cfg(target_os = "linux").
[target.'cfg(unix)'.dependencies]
allternit-firecracker-driver = { path = "../../drivers/firecracker" }

# PR_SET_PDEATHSIG for the cloud computer's mesh-node (cloud_computer_peer).
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
axum-test = "14"
tempfile = "3"
# `ServiceExt::oneshot` for in-process route tests (workspace tower is 0.5;
# the util feature is additive and matches axum 0.7's service traits).
tower = { workspace = true, features = ["util"] }

[features]
default = ["vm-driver"]
vm-driver = []
# Exposes `allternit_api::test_helpers` to the integration tests in `tests/`
# when they're built in release mode (no debug_assertions), e.g. the deploy
# workflow's `cargo test --release --features test-helpers`. Never enabled
# for the shipped binary.
test-helpers = []

# Make this package independent from the root workspace so it can build
# even when other workspace members have broken manifests.
# [workspace]

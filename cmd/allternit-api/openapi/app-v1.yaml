openapi: 3.1.0
info:
  title: Allternit App API (allternit-api)
  version: "1.0.0"
  summary: The first-party app routes the native phone apps call on allternit-api.
  description: |
    Internal contract for Allternit's own apps (iOS, Android), not the public
    developer API (that is `cmd/allternit-cloud-api/openapi/platform-v1.yaml`,
    which a router test pins to `/v1` routes only, so these routes cannot live
    there). Not published to the docs site.

    Base URLs, chosen per operation with `x-base`:
    - `api`: `https://api.allternit.com/api/v1` (the app's `ApiConfig.apiBaseUrl`);
      paths are relative to it.
    - `instance`: the origin of the user's connected computer (relay, mesh or
      direct gizzi-code); paths are absolute on that origin.

    Every route takes `Authorization: Bearer <Clerk session JWT or API token>`.
    Errors are `{ "error": "<code>", "message"?: "<text>" }`.

    Source of truth for shapes is the Rust handler named in each operation's
    `x-handler`. Kotlin is generated from this file by
    `contracts/mobile-api/generate.mjs` (operations listed in
    `contracts/mobile-api/operations.json`).
servers:
  - url: https://api.allternit.com/api/v1
security:
  - bearerAuth: []
paths:
  /me:
    get:
      operationId: getMe
      summary: The signed-in user and their resolved organization
      x-base: api
      x-handler: cmd/allternit-api/src/me_routes.rs get_current_user
      tags: [Account]
      responses:
        "200":
          description: The profile, wrapped in `user`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeResponse" }
        default: { $ref: "#/components/responses/Error" }
  /me/organization:
    post:
      operationId: createPersonalOrganization
      summary: Create a personal organization (no-op when one exists)
      x-base: api
      x-handler: cmd/allternit-api/src/me_routes.rs create_personal_organization
      tags: [Account]
      responses:
        "200":
          description: The organization id; `created` is false when it already existed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreateOrganizationResponse" }
        default: { $ref: "#/components/responses/Error" }
  /agent-sessions:
    get:
      operationId: listAgentSessions
      summary: List chat sessions (ephemeral ones are left out)
      x-base: api
      x-handler: cmd/allternit-api/src/agent_session_routes.rs list_sessions
      tags: [Sessions]
      responses:
        "200":
          description: Sessions and their count.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentSessionList" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createAgentSession
      summary: Create a chat session
      x-base: api
      x-handler: cmd/allternit-api/src/agent_session_routes.rs create_session
      tags: [Sessions]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAgentSessionRequest" }
      responses:
        "201":
          description: The new session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentSession" }
        default: { $ref: "#/components/responses/Error" }
  /agent-sessions/{id}:
    get:
      operationId: getAgentSession
      summary: One chat session
      x-base: api
      x-handler: cmd/allternit-api/src/agent_session_routes.rs get_session
      tags: [Sessions]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentSession" }
        default: { $ref: "#/components/responses/Error" }
  /agent-sessions/{id}/messages:
    get:
      operationId: listAgentSessionMessages
      summary: Every message of a session, oldest first (a bare array)
      x-base: api
      x-handler: cmd/allternit-api/src/agent_session_routes.rs list_messages
      tags: [Sessions]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The messages.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AgentSessionMessage" }
        default: { $ref: "#/components/responses/Error" }
  /models:
    get:
      operationId: listModels
      summary: The flattened runtime model catalog (a bare array)
      description: Read live from the connected gizzi runtime. 503 `models_unavailable` when it cannot be read.
      x-base: api
      x-handler: cmd/allternit-api/src/v1_routes.rs list_available_models
      tags: [Models]
      responses:
        "200":
          description: The catalog.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RuntimeModel" }
        default: { $ref: "#/components/responses/Error" }
  /providers:
    get:
      operationId: listProviders
      summary: Model providers (live from gizzi, else the static merge)
      x-base: api
      x-handler: cmd/allternit-api/src/provider_routes.rs list_providers
      tags: [Models]
      responses:
        "200":
          description: The providers.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderList" }
        default: { $ref: "#/components/responses/Error" }
  /api/agent-chat:
    post:
      operationId: agentChat
      summary: Send a chat turn and stream the reply (server-sent events)
      description: |
        Served by the user's connected computer (gizzi-code `agent-compat.ts`,
        or allternit-api's bridge), not the gateway. The body is an SSE stream
        of JSON `data:` frames (see `AgentChatStream.kt` for the frame types);
        `data: [DONE]` ends it. 409 with `no_brain` when the computer has no
        model signed in.
      x-base: instance
      x-stream: sse
      x-handler: cmd/allternit-api/src/v1_routes.rs agent_chat_bridge
      tags: [Chat]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentChatRequest" }
      responses:
        "200":
          description: The event stream.
          content:
            text/event-stream:
              schema: { type: string }
        default: { $ref: "#/components/responses/Error" }
  /memory/sleep/status:
    get:
      operationId: getSleepStatus
      summary: Allternit Sleep status for the signed-in user (stub until each stage lands; all stages off by default)
      x-base: api
      x-handler: cmd/allternit-api/src/sleep/routes.rs status
      tags: [Memory]
      responses:
        "200":
          description: Status. `available` is true wherever the runtime has the sleep module.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SleepStatus" }
        default: { $ref: "#/components/responses/Error" }
  /memory/sleep/cycles:
    get:
      operationId: listSleepCycles
      summary: Recent Sleep cycles (the report list), newest first
      x-base: api
      x-handler: cmd/allternit-api/src/sleep/routes.rs list_cycles
      tags: [Memory]
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer } }
        - { name: state, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: Cycles and their count.
          content:
            application/json:
              schema:
                type: object
                required: [cycles, count]
                properties:
                  cycles: { type: array, items: { $ref: "#/components/schemas/SleepCycle" } }
                  count: { type: integer }
        default: { $ref: "#/components/responses/Error" }
  /memory/sleep/cycles/{id}:
    get:
      operationId: getSleepCycle
      summary: One Sleep cycle with its report (null while it runs)
      x-base: api
      x-handler: cmd/allternit-api/src/sleep/routes.rs get_cycle
      tags: [Memory]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The cycle and its report (per-stage outcome, counts, spend, undo info).
          content:
            application/json:
              schema:
                type: object
                required: [cycle]
                properties:
                  cycle: { $ref: "#/components/schemas/SleepCycle" }
                  report: { type: [object, "null"] }
        default: { $ref: "#/components/responses/Error" }
  /memory/sleep/run:
    post:
      operationId: runSleep
      summary: Start a sleep now (queues a nap or daydream). 409 with `accepted:false` while Sleep is off or the kind is not built
      x-base: api
      x-handler: cmd/allternit-api/src/sleep/routes.rs run
      tags: [Memory]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                kind: { type: string, enum: [nap, daydream] }
      responses:
        "202": { description: Queued. }
        "409":
          description: Refused.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SleepNotAccepted" }
        default: { $ref: "#/components/responses/Error" }
  /memory/sleep/cycles/{id}/undo:
    post:
      operationId: undoSleepCycle
      summary: Undo one cycle (restores the previous page manifest). 409 with `accepted:false` while the stage is off or not built
      x-base: api
      x-handler: cmd/allternit-api/src/sleep/routes.rs undo_cycle
      tags: [Memory]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Undone. }
        "409":
          description: Refused; `reason` is `sleep_disabled` or `stage_not_built`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SleepNotAccepted" }
        default: { $ref: "#/components/responses/Error" }
  /memory/disputes:
    get:
      operationId: listMemoryDisputes
      summary: Memory disputes (two claims that disagree), newest first
      x-base: api
      x-handler: cmd/allternit-api/src/sleep/routes.rs list_disputes
      tags: [Memory]
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer } }
        - { name: state, in: query, required: false, schema: { type: string, enum: [open, needs_user, resolved] } }
      responses:
        "200":
          description: Disputes and their count.
          content:
            application/json:
              schema:
                type: object
                required: [disputes, count]
                properties:
                  disputes: { type: array, items: { $ref: "#/components/schemas/MemoryDispute" } }
                  count: { type: integer }
        default: { $ref: "#/components/responses/Error" }
  /memory/disputes/{id}/resolve:
    post:
      operationId: resolveMemoryDispute
      summary: The user picks a side. 409 with `accepted:false` while the disputes stage is off or not built
      x-base: api
      x-handler: cmd/allternit-api/src/sleep/routes.rs resolve_dispute
      tags: [Memory]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [choice]
              properties:
                choice: { type: string, enum: [a, b, both_scoped, neither] }
                reason: { type: string }
      responses:
        "200": { description: Resolved. }
        "409":
          description: Refused.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SleepNotAccepted" }
        default: { $ref: "#/components/responses/Error" }
  /memory/sleep/settings:
    get:
      operationId: getSleepSettings
      summary: The user's Sleep switches and daily spend cap
      x-base: api
      x-handler: cmd/allternit-api/src/sleep/routes.rs get_settings
      tags: [Memory]
      responses:
        "200":
          description: Settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SleepSettings" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: putSleepSettings
      summary: Change switches (written as owner rows, all-or-nothing; an unknown stage is 400)
      x-base: api
      x-handler: cmd/allternit-api/src/sleep/routes.rs put_settings
      tags: [Memory]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean }
                stages: { type: object, additionalProperties: { type: boolean } }
                daily_spend_cap_usd: { type: number }
      responses:
        "200":
          description: The settings after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SleepSettings" }
        default: { $ref: "#/components/responses/Error" }
  /computers/{id}/toolset/events:
    get:
      operationId: streamComputerToolsetEvents
      summary: Live run events for one computer (SSE), the stream every surface reads for cursors, approvals, human windows and blocked pages
      description: |
        Server-sent events, one JSON object per `data:` line, shaped
        `{ "type": "<event type>", "ts": "<RFC 3339>", "data": { ... } }`.
        Types and their `data` schemas:
        - `computer.action`: `ComputerActionEventData`
        - `computer.confirmation_required`: `ComputerConfirmationRequiredEventData`
        - `computer.human_requested` / `computer.human_resumed`: `ComputerHumanEventData`
        - `computer.block_detected`: `ComputerBlockDetectedEventData`
        - `computer.block_resolved`: `ComputerBlockResolvedEventData`
        - `computer.agent_display`: `ComputerAgentDisplayEventData`
        The SSE `event:` name is `computer.action` on every frame (kept for
        older listeners), so read `type` from the JSON. Clients ignore types
        they don't know. The same frames go out on the computer's events
        websocket. The approval, human and block events also have a push
        kind (see `AciPushNotify`).
      x-base: api
      x-stream: sse
      x-handler: cmd/allternit-api/src/computer_toolset.rs get_toolset_events
      tags: [Computers]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The event stream.
          content:
            text/event-stream:
              schema: { $ref: "#/components/schemas/ComputerRunEvent" }
        default: { $ref: "#/components/responses/Error" }
  /computers/{id}/block-resolve:
    post:
      operationId: resolveComputerBlock
      summary: Answer a `computer.block_detected` hold (continue, stop, or re-run on the person's Mac)
      description: |
        `continue`: the person signed in or solved the page; the run goes on and
        the same domain + kind won't hold this run again. `stop`: the run ends.
        `rerun`: the run ends here and the CLIENT starts a new run on
        `rerun_target` (one of the event's `rerun_targets`) with
        `rerun_of` set to the returned `run_id` on its toolset calls. The server
        never moves a run between computers. 409 `no_block_pending` when no hold
        is waiting; 400 `invalid_rerun_target` for a computer not listed.
      x-base: api
      x-handler: cmd/allternit-api/src/computer_toolset.rs post_block_resolve
      tags: [Computers]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BlockResolveRequest" }
      responses:
        "200":
          description: The hold was answered.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlockResolveResponse" }
        default: { $ref: "#/components/responses/Error" }
  /api/aci/handoff/{id}/approve:
    post:
      operationId: approveAciHandoff
      summary: Approve a pending approval (`approval_id` from `computer.confirmation_required` or the 409 body)
      description: |
        Mounted at `/api/aci/...` on the same host, not under `/api/v1`, so
        the path is absolute. The body is optional. `{ "scope": "run" }` on a
        credential approval (`kind: "credential"`) is "Allow for this run":
        later fills of the same credential name into the same domain in the
        same run skip the prompt. It lives in memory only and ends with the
        run; nothing is remembered per site. Any other approval is single-use
        and answers `scope: "once"`. Deny is `POST /api/aci/handoff/{id}/deny`.
        Only the run's owner may approve or deny: the user the approval was
        raised for, the owner of the computer it names, or the Desktop app on
        this device (its local access token, not relayed). Anyone else gets
        403 `not_run_owner` and the approval stays pending.
      x-base: instance
      x-handler: cmd/allternit-api/src/aci_routes.rs aci_handoff_approve
      tags: [Computers]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HandoffApproveRequest" }
      responses:
        "200":
          description: Approved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HandoffApproveResponse" }
        "403":
          description: "`not_run_owner`: the caller doesn't own this run or computer."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        default: { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    Error:
      description: An error.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
  schemas:
    ErrorBody:
      type: object
      required: [error]
      properties:
        error: { type: string, description: The error code. }
        message: { type: string }
    UserProfile:
      type: object
      description: me_routes.rs `UserProfile`. The fallback row (user not yet in the DB) has no `clerk_id`, `avatar_url` or `created_at`.
      required: [id, role, status]
      properties:
        id: { type: string }
        clerk_id: { type: [string, "null"] }
        email: { type: [string, "null"] }
        name: { type: [string, "null"] }
        avatar_url: { type: [string, "null"] }
        role: { type: string }
        status: { type: string }
        created_at: { type: string }
        organization_id: { type: [string, "null"] }
        organization_role: { type: [string, "null"] }
    MeResponse:
      type: object
      required: [user]
      properties:
        user: { $ref: "#/components/schemas/UserProfile" }
    CreateOrganizationResponse:
      type: object
      required: [organization_id, created]
      properties:
        organization_id: { type: string }
        created: { type: boolean }
    AgentSession:
      type: object
      description: agent_session_routes.rs `transform_session` always sends every field below; only `id` is required because the apps also decode sessions from other producers (cloud plan threads, a computer's gizzi directly), which can leave the rest out.
      required: [id]
      properties:
        id: { type: string }
        name: { type: [string, "null"] }
        description: { type: [string, "null"] }
        created_at: { type: [string, "null"] }
        updated_at: { type: [string, "null"] }
        last_accessed: { type: [string, "null"] }
        message_count: { type: integer }
        active: { type: boolean }
        tags:
          type: array
          items: { type: string }
        environment:
          description: Code environment status, passed through from gizzi unchanged.
          x-kotlin-raw: true
        metadata:
          description: Open bag. Server-synthesized keys (agentId, originSurface, ephemeral, paused, glance, mission, ...) merged with whatever the client stored at create/patch time, so values are any JSON type.
          x-kotlin-raw: true
    AgentSessionList:
      type: object
      required: [sessions, count]
      properties:
        sessions:
          type: array
          items: { $ref: "#/components/schemas/AgentSession" }
        count: { type: integer }
    CreateAgentSessionRequest:
      type: object
      description: agent_session_routes.rs `CreateSessionBody`. Every field is optional on the server.
      properties:
        name: { type: string }
        agent_id: { type: string }
        agent_name: { type: string }
        origin_surface: { type: string }
        ephemeral: { type: boolean }
        metadata:
          description: The client metadata bag (agentModeId, permissionMode, projectId, persona, ephemeral, ...). Stored as-is.
          x-kotlin-raw: true
        model:
          description: gizzi `GizziModelRef`, forwarded as-is.
          x-kotlin-raw: true
        project_id: { type: string }
        environmentId: { type: string }
        repos:
          description: "`[{ url, branch? }]`, forwarded as-is."
          x-kotlin-raw: true
    AgentSessionMessage:
      type: object
      description: agent_session_routes.rs `transform_message_with`.
      required: [id, role, content]
      properties:
        id: { type: string }
        role: { type: string }
        content: { type: string }
        thinking: { type: [string, "null"] }
        timestamp: { type: [string, "null"] }
        metadata:
          description: "`{ agent, model, telemetry, handoff, cloudContinue, parts, error }`; `parts` are gizzi message parts, passed through unchanged."
          x-kotlin-raw: true
    RuntimeModelTier:
      type: string
      enum: [flagship, standard, fast, legacy]
    ThinkingLevel:
      type: object
      required: [id, label]
      properties:
        id: { type: string }
        label: { type: string }
    ModelThinking:
      type: object
      description: model_thinking.rs `thinking_json`.
      required: [vendor, levels, default]
      properties:
        vendor: { type: string }
        vendor_name: { type: [string, "null"] }
        term: { type: string }
        note: { type: string }
        toggle: { type: boolean }
        levels:
          type: array
          items: { $ref: "#/components/schemas/ThinkingLevel" }
        default: { type: string }
        fast: { type: boolean }
        source:
          description: Where the entry came from; its type is not pinned by the handler.
          x-kotlin-raw: true
    RuntimeModel:
      type: object
      description: v1_routes.rs `live_model_catalog` row.
      required: [id, name, provider]
      properties:
        id: { type: string }
        name: { type: string }
        provider: { type: string }
        description: { type: [string, "null"] }
        tier: { $ref: "#/components/schemas/RuntimeModelTier" }
        supports_effort: { type: boolean }
        thinking: { $ref: "#/components/schemas/ModelThinking" }
        default: { type: boolean }
        rank: { type: [integer, "null"] }
        hidden: { type: boolean }
    ProviderModel:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
    ProviderInfo:
      type: object
      description: provider_routes.rs `ProviderInfo`.
      required: [id, name, provider_type, api_key_set, models, status]
      properties:
        id: { type: string }
        name: { type: string }
        provider_type: { type: string }
        base_url: { type: [string, "null"] }
        api_key_set: { type: boolean }
        models:
          type: array
          items: { $ref: "#/components/schemas/ProviderModel" }
        status: { type: string }
    ProviderList:
      type: object
      required: [providers]
      properties:
        providers:
          type: array
          items: { $ref: "#/components/schemas/ProviderInfo" }
        all:
          type: array
          items: { $ref: "#/components/schemas/ProviderInfo" }
    AttachmentRef:
      type: object
      description: A file for the turn (iOS `AttachmentRef`); the bridge turns it into a gizzi file part.
      required: [mediaType]
      properties:
        url: { type: string }
        dataBase64: { type: string }
        mediaType: { type: string }
        name: { type: string }
    AgentChatMetadata:
      type: object
      properties:
        tools:
          description: The "+" sheet's tool options, forwarded to the runtime as-is.
          x-kotlin-raw: true
        form_factor: { type: string, description: '"phone" adds the small-screen reply block.' }
        time_zone: { type: string, description: IANA zone name. }
        screen_context: { type: string, description: '"available" while the app is in front.' }
        answer_cards: { type: string, description: '"widgets": the app draws the writing/lookup cards.' }
    AgentChatRequest:
      type: object
      description: v1_routes.rs `agent_chat_bridge` reads these keys from the JSON body.
      required: [chatId, message]
      properties:
        chatId: { type: string, description: The agent session id. }
        message: { type: string }
        agentId: { type: string }
        systemPrompt: { type: string }
        runtimeModelId: { type: string }
        effort: { type: string }
        fast: { type: boolean }
        attachments:
          type: array
          items: { $ref: "#/components/schemas/AttachmentRef" }
        metadata: { $ref: "#/components/schemas/AgentChatMetadata" }
        workdir: { type: string, description: The session's working folder; "" clears it. }
    SleepStatus:
      type: object
      description: sleep/types.rs `SleepStatus`.
      required: [available, enabled, stages, debt, spend_today_usd, daily_spend_cap_usd, open_disputes, tracks]
      properties:
        available: { type: boolean }
        enabled: { type: boolean }
        stages: { type: object, additionalProperties: { type: boolean } }
        debt: { type: number }
        last_cycle: { oneOf: [{ $ref: "#/components/schemas/SleepCycle" }, { type: "null" }] }
        spend_today_usd: { type: number }
        daily_spend_cap_usd: { type: number }
        manifest_id: { type: [string, "null"] }
        open_disputes: { type: integer }
        tracks:
          type: object
          required: [track1, track2]
          properties:
            track1: { type: string }
            track2: { type: string }
    SleepCycle:
      type: object
      description: sleep/types.rs `CycleSummary`.
      required: [id, trigger, kind, state, spend_usd, started_at]
      properties:
        id: { type: string }
        trigger: { type: string }
        kind: { type: string }
        state: { type: string }
        stage: { type: [string, "null"] }
        session_id: { type: [string, "null"] }
        spend_usd: { type: number }
        manifest_before: { type: [string, "null"] }
        manifest_after: { type: [string, "null"] }
        started_at: { type: string }
        finished_at: { type: [string, "null"] }
        undone_at: { type: [string, "null"] }
    MemoryDispute:
      type: object
      description: sleep/types.rs `DisputeView`.
      required: [id, side_a, side_b, state, created_at]
      properties:
        id: { type: string }
        topic_id: { type: [string, "null"] }
        side_a: { $ref: "#/components/schemas/MemoryDisputeSide" }
        side_b: { $ref: "#/components/schemas/MemoryDisputeSide" }
        scope: { type: [string, "null"] }
        stakes: { type: [number, "null"] }
        margin: { type: [number, "null"] }
        pick: { type: [string, "null"] }
        reason: { type: [string, "null"] }
        state: { type: string, enum: [open, needs_user, resolved] }
        created_at: { type: string }
    MemoryDisputeSide:
      type: object
      required: [kind, id]
      properties:
        kind: { type: string }
        id: { type: string }
    SleepSettings:
      type: object
      required: [enabled, stages, daily_spend_cap_usd]
      properties:
        enabled: { type: boolean }
        stages: { type: object, additionalProperties: { type: boolean } }
        daily_spend_cap_usd: { type: number }
        entries: { type: object }
    SleepNotAccepted:
      type: object
      required: [accepted, reason]
      properties:
        accepted: { type: boolean, const: false }
        reason: { type: string, enum: [sleep_disabled, stage_not_built] }
        stage: { type: string }
        error: { type: string }
    ComputerRunEvent:
      type: object
      description: One toolset-events SSE frame. `data` is one of the `Computer*EventData` schemas, picked by `type`.
      required: [type, ts, data]
      properties:
        type:
          type: string
          enum: [computer.action, computer.confirmation_required, computer.human_requested, computer.human_resumed, computer.block_detected, computer.block_resolved, computer.agent_display]
        ts: { type: string }
        data:
          type: object
          x-kotlin-raw: true
          description: The event's data; its shape depends on `type`.
    ComputerActionEventData:
      type: object
      description: computer_toolset.rs `emit_action`.
      required: [toolset, member, ok]
      properties:
        toolset: { type: string, enum: [computer, browser] }
        member: { type: string }
        x: { type: [integer, "null"] }
        y: { type: [integer, "null"] }
        screen_w: { type: [integer, "null"] }
        screen_h: { type: [integer, "null"] }
        run_id: { type: [string, "null"] }
        ok: { type: boolean }
        actor: { type: [object, "null"], x-kotlin-raw: true, description: "`{agent_id, name}` for the cursor badge." }
        step: { type: [string, "null"] }
        rerun_of: { type: [string, "null"], description: "The run this run re-runs, when the client started it with `rerun_of`." }
    CredentialRef:
      type: object
      description: A vault credential named for an approval. Never carries the value.
      required: [name, domain]
      properties:
        name: { type: string }
        domain: { type: [string, "null"], description: "Where it types (declared `domain`, else the vault binding): lower case, no scheme or `www.`." }
    ComputerConfirmationRequiredEventData:
      type: object
      description: computer_toolset.rs `emit_confirmation_required`. Also pushed as `aci_approval`. Approve with `POST /api/aci/handoff/{approval_id}/approve`, then the agent retries with the grant.
      required: [computer_id, approval_id, kind, member, message]
      properties:
        run_id: { type: [string, "null"] }
        computer_id: { type: string }
        approval_id: { type: string }
        kind: { type: string, enum: [action, credential] }
        credential: { oneOf: [{ $ref: "#/components/schemas/CredentialRef" }, { type: "null" }], description: "Set when `kind` is `credential`." }
        confirmation_class: { type: [string, "null"], description: "`risky` or `irreversible`." }
        member: { type: string }
        message: { type: string }
    ConfirmationRequiredBody:
      type: object
      description: aci_safety.rs `enforce_confirmation_with_details`. The refusal body the toolset route answers 409 `approval_required` (other ACI routes 403 `confirmation_required`) with, among the toolset result fields.
      required: [error, approval_id, action_hash, confirmation_class, kind, message]
      properties:
        error: { type: string }
        approval_id: { type: string }
        action_hash: { type: string }
        confirmation_class: { type: string }
        kind: { type: string, enum: [action, credential] }
        credential: { $ref: "#/components/schemas/CredentialRef" }
        message: { type: string }
    ComputerHumanEventData:
      type: object
      description: computer_v2.rs `emit_human_event` (`human_requested` / `human_resumed`). `human_requested` is also pushed as `aci_human`. Done is `POST /computers/{id}/human-done`.
      required: [computer_id, reason, run_id, live_view, input_enabled]
      properties:
        computer_id: { type: string }
        reason: { type: string }
        run_id: { type: string }
        live_view: { type: boolean }
        input_enabled: { type: boolean }
        timeout_ms: { type: integer }
        resumed: { type: boolean }
        timed_out: { type: boolean }
        held_by: { type: [string, "null"] }
    RerunTarget:
      type: object
      description: One of the person's online Macs (this-device computers) a blocked run can be re-run on.
      required: [computer_id, name]
      properties:
        computer_id: { type: string }
        name: { type: string }
    ComputerBlockDetectedEventData:
      type: object
      description: computer_block.rs `hold`. The run waits until `POST /computers/{computer_id}/block-resolve` (or `timeout_ms`, after which it goes on with a note). Also pushed as `aci_blocked`.
      required: [run_id, computer_id, domain, kind, rerun_targets, timeout_ms]
      properties:
        run_id: { type: string }
        computer_id: { type: string }
        domain: { type: [string, "null"] }
        kind: { type: string, enum: [login, two_factor, captcha, block_page, rate_limited] }
        rerun_targets: { type: array, items: { $ref: "#/components/schemas/RerunTarget" }, description: "Empty when no Mac is online." }
        timeout_ms: { type: integer }
    ComputerBlockResolvedEventData:
      type: object
      description: computer_block.rs `hold`, when the hold ends.
      required: [run_id, computer_id, domain, kind, action, rerun_target]
      properties:
        run_id: { type: string }
        computer_id: { type: string }
        domain: { type: [string, "null"] }
        kind: { type: string, enum: [login, two_factor, captcha, block_page, rate_limited] }
        action: { type: string, enum: [continue, stop, rerun, timed_out] }
        rerun_target: { type: [string, "null"] }
    ComputerAgentDisplayEventData:
      type: object
      description: computer_agent_display.rs, when a run on a Linux cloud computer gets (`started`) or gives back (`stopped`) its own X display and browser. Point the run's live view at `display` (VNC on `vnc_port` on the desktop image; `GET /api/v1/computers/{id}/screenshot?run_id=`).
      required: [run_id, computer_id, agent_id, display, state]
      properties:
        run_id: { type: string }
        computer_id: { type: string }
        agent_id: { type: string }
        display: { type: string, description: "`:N`" }
        vnc_port: { type: [integer, "null"] }
        state: { type: string, enum: [started, stopped] }
    BlockResolveRequest:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [continue, stop, rerun] }
        rerun_target: { type: string, description: "With `rerun`: a `computer_id` from the event's `rerun_targets`." }
    BlockResolveResponse:
      type: object
      required: [ok, action, run_id, domain, kind, rerun_target]
      properties:
        ok: { type: boolean }
        action: { type: string, enum: [continue, stop, rerun] }
        run_id: { type: string, description: "The held run; send it as `rerun_of` on the new run." }
        domain: { type: [string, "null"] }
        kind: { type: string, enum: [login, two_factor, captcha, block_page, rate_limited] }
        rerun_target: { type: [string, "null"] }
    HandoffApproveRequest:
      type: object
      properties:
        scope: { type: string, enum: [once, run], description: "`run` = Allow for this run (credential approvals only)." }
    HandoffApproveResponse:
      type: object
      required: [approval_id, status, scope]
      properties:
        approval_id: { type: string }
        status: { type: string, const: approved }
        scope: { type: string, enum: [once, run] }
    AciPushNotify:
      type: object
      description: |
        computer_block.rs `push_to_owner`: what allternit-api POSTs to cloud-api
        `POST /push/notify/{runtime_id}` (host root, `routes/aci_push.rs`) for a
        run event. Relay-signed exactly like `/api/v1/runtime/events` (signed
        path `/push/notify/{runtime_id}`, `x-allternit-runtime-id` header) and
        sent only when the runtime is paired to the run's owner. cloud-api
        rebuilds `data` from an allowlist and fans it out to web push, APNs and
        FCM (categories ACI_APPROVAL, ACI_HUMAN, ACI_BLOCKED).
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/AciPushData" }
        bot_name: { type: string, description: "The driving agent's name, when the run named one." }
    AciPushData:
      type: object
      description: "One of three kinds. A credential goes by name + domain only, never its value."
      required: [kind, run_id, computer_id]
      properties:
        kind: { type: string, enum: [aci_approval, aci_human, aci_blocked] }
        run_id: { type: string }
        computer_id: { type: string }
        approval_id: { type: string, description: "aci_approval only." }
        approval_kind: { type: string, enum: [action, credential], description: "aci_approval only." }
        credential: { $ref: "#/components/schemas/CredentialRef" }
        message: { type: string, description: "aci_approval only." }
        reason: { type: string, description: "aci_human only: what the agent asked for." }
        secret: { type: boolean, description: "aci_human only: true for a masked-box secret request." }
        domain: { type: [string, "null"], description: "aci_blocked only." }
        block_kind: { type: string, enum: [login, two_factor, captcha, block_page, rate_limited], description: "aci_blocked only." }
        rerun_targets: { type: array, items: { type: string }, description: "aci_blocked only: computer ids of the person's online Macs." }

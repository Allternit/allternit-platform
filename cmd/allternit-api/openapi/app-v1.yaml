          application/json:
            schema:
              type: object
              required: [target_kind, target_ref, title, body, origin]
              properties:
                target_kind: { type: string, enum: [skill, domain, data_access] }
                target_ref: { type: string, description: "Slug of letters, digits, '-', '_', '.'; skills may also use ':' and '/'." }
                title: { type: string, maxLength: 200 }
                body: { type: string }
                base: { type: string }
                evidence: { type: array, items: { $ref: "#/components/schemas/KnowledgeEvidence" } }
                origin: { type: string, enum: [curator, agent, skill_growth] }
                eval: { type: object }
      responses:
        "200":
          description: The new proposal.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgeProposalResponse" }
        "400": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /knowledge/proposals/{id}/eval:
    post:
      operationId: setKnowledgeProposalEval
      summary: Attach or replace the evaluation of a proposed proposal (skill growth evaluates after it proposes). 409 once decided
      x-base: api
      x-handler: cmd/allternit-api/src/knowledge_routes.rs set_eval
      tags: [Knowledge]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eval]
              properties:
                eval: { type: object, additionalProperties: true, description: "Skill growth sends {score, report}." }
      responses:
        "200":
          description: The proposal after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgeProposalResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /knowledge/proposals/{id}/approve:
    post:
      operationId: approveKnowledgeProposal
      summary: Approve (proposed → approved). domain/data_access write the knowledge file in the personal Memory Drive (step 16); skill is activated by the client. Linked flags become resolved
      x-base: api
      x-handler: cmd/allternit-api/src/knowledge_routes.rs approve
      tags: [Knowledge]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The proposal after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgeProposalResponse" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /knowledge/proposals/{id}/reject:
    post:
      operationId: rejectKnowledgeProposal
      summary: Reject (proposed → rejected). Linked flags become resolved
      x-base: api
      x-handler: cmd/allternit-api/src/knowledge_routes.rs reject
      tags: [Knowledge]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The proposal after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgeProposalResponse" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /knowledge/proposals/{id}/activated:
    post:
      operationId: markKnowledgeProposalActivated
      summary: The client turned an approved proposal on (approved → active)
      x-base: api
      x-handler: cmd/allternit-api/src/knowledge_routes.rs activated
      tags: [Knowledge]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The proposal after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgeProposalResponse" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /knowledge/proposals/{id}/rollback:
    post:
      operationId: rollbackKnowledgeProposal
      summary: Roll back (approved or active → rolled_back)
      x-base: api
      x-handler: cmd/allternit-api/src/knowledge_routes.rs rollback
      tags: [Knowledge]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The proposal after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgeProposalResponse" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /memory/v2/raw-search:
    post:
      operationId: rawSearchPastChats
      summary: Search the user's raw past chat turns (headed windows, reranked on the local sidecar, expanded to full turns, budgeted)
      description: |
        Candidates are the user's turn windows (keyword + vector, RRF); the local sidecar's `/v1/rerank`
        reorders them (`auto` 600 ms / `search` 1,500 ms timeout; on timeout, error or 503 the fused order
        stands and `reranked` is false). Incognito sessions and deleted turns never come back. With
        `calling_session` (or the `x-allternit-session-id` header) the turns returned are recorded in that
        session's Memory activity as `past_chat` items.
      x-base: api
      x-handler: cmd/allternit-api/src/memory_routes.rs raw_search_v2_handler
      tags: [Memory]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RawSearchRequest" }
      responses:
        "200":
          description: Turns best first, a separate knowledge block (empty until knowledge files are indexed), and whether rerank ran.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RawSearchResult" }
        "400": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /memory/v2/turns/{id}/neighbors:
    get:
      operationId: getTurnNeighbors
      summary: Same-session turns around one past turn, in time order (the turn included). 404 unless it is the caller's
      x-base: api
      x-handler: cmd/allternit-api/src/memory_routes.rs turn_neighbors_v2_handler
      tags: [Memory]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: before, in: query, required: false, schema: { type: integer, default: 2, maximum: 20 } }
        - { name: after, in: query, required: false, schema: { type: integer, default: 2, maximum: 20 } }
      responses:
        "200":
          description: The turns.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TurnNeighbors" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    Error:
      description: An error.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
  schemas:
    ErrorBody:
      type: object
      required: [error]
      properties:
        error: { type: string, description: The error code. }
        message: { type: string }
    UserProfile:
      type: object
      description: me_routes.rs `UserProfile`. The fallback row (user not yet in the DB) has no `clerk_id`, `avatar_url` or `created_at`.
      required: [id, role, status]
      properties:
        id: { type: string }
        clerk_id: { type: [string, "null"] }
        email: { type: [string, "null"] }
        name: { type: [string, "null"] }
        avatar_url: { type: [string, "null"] }
        role: { type: string }
        status: { type: string }
        created_at: { type: string }
        organization_id: { type: [string, "null"] }
        organization_role: { type: [string, "null"] }
    MeResponse:
      type: object
      required: [user]
      properties:
        user: { $ref: "#/components/schemas/UserProfile" }
    CreateOrganizationResponse:
      type: object
      required: [organization_id, created]
      properties:
        organization_id: { type: string }
        created: { type: boolean }
    AgentSession:
      type: object
      description: agent_session_routes.rs `transform_session` always sends every field below; only `id` is required because the apps also decode sessions from other producers (cloud plan threads, a computer's gizzi directly), which can leave the rest out.
      required: [id]
      properties:
        id: { type: string }
        name: { type: [string, "null"] }
        description: { type: [string, "null"] }
        created_at: { type: [string, "null"] }
        updated_at: { type: [string, "null"] }
        last_accessed: { type: [string, "null"] }
        message_count: { type: integer }
        active: { type: boolean }
        tags:
          type: array
          items: { type: string }
        environment:
          description: Code environment status, passed through from gizzi unchanged.
          x-kotlin-raw: true
        metadata:
          description: Open bag. Server-synthesized keys (agentId, originSurface, ephemeral, paused, glance, mission, ...) merged with whatever the client stored at create/patch time, so values are any JSON type.
          x-kotlin-raw: true
    AgentSessionList:
      type: object
      required: [sessions, count]
      properties:
        sessions:
          type: array
          items: { $ref: "#/components/schemas/AgentSession" }
        count: { type: integer }
    CreateAgentSessionRequest:
      type: object
      description: agent_session_routes.rs `CreateSessionBody`. Every field is optional on the server.
      properties:
        name: { type: string }
        agent_id: { type: string }
        agent_name: { type: string }
        origin_surface: { type: string }
        ephemeral: { type: boolean }
        metadata:
          description: The client metadata bag (agentModeId, permissionMode, projectId, persona, ephemeral, ...). Stored as-is.
          x-kotlin-raw: true
        model:
          description: gizzi `GizziModelRef`, forwarded as-is.
          x-kotlin-raw: true
        project_id: { type: string }
        environmentId: { type: string }
        repos:
          description: "`[{ url, branch? }]`, forwarded as-is."
          x-kotlin-raw: true
    AgentSessionMessage:
      type: object
      description: agent_session_routes.rs `transform_message_with`.
      required: [id, role, content]
      properties:
        id: { type: string }
        role: { type: string }
        content: { type: string }
        thinking: { type: [string, "null"] }
        timestamp: { type: [string, "null"] }
        metadata:
          description: "`{ agent, model, telemetry, handoff, cloudContinue, parts, error }`; `parts` are gizzi message parts, passed through unchanged."
          x-kotlin-raw: true
    RuntimeModelTier:
      type: string
      enum: [flagship, standard, fast, legacy]
    ThinkingLevel:
      type: object
      required: [id, label]
      properties:
        id: { type: string }
        label: { type: string }
    ModelThinking:
      type: object
      description: model_thinking.rs `thinking_json`.
      required: [vendor, levels, default]
      properties:
        vendor: { type: string }
        vendor_name: { type: [string, "null"] }
        term: { type: string }
        note: { type: string }
        toggle: { type: boolean }
        levels:
          type: array
          items: { $ref: "#/components/schemas/ThinkingLevel" }
        default: { type: string }
        fast: { type: boolean }
        source:
          description: Where the entry came from; its type is not pinned by the handler.
          x-kotlin-raw: true
    RuntimeModel:
      type: object
      description: v1_routes.rs `live_model_catalog` row.
      required: [id, name, provider]
      properties:
        id: { type: string }
        name: { type: string }
        provider: { type: string }
        description: { type: [string, "null"] }
        tier: { $ref: "#/components/schemas/RuntimeModelTier" }
        supports_effort: { type: boolean }
        thinking: { $ref: "#/components/schemas/ModelThinking" }
        default: { type: boolean }
        rank: { type: [integer, "null"] }
        hidden: { type: boolean }
    ProviderModel:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
    ProviderInfo:
      type: object
      description: provider_routes.rs `ProviderInfo`.
      required: [id, name, provider_type, api_key_set, models, status]
      properties:
        id: { type: string }
        name: { type: string }
        provider_type: { type: string }
        base_url: { type: [string, "null"] }
        api_key_set: { type: boolean }
        models:
          type: array
          items: { $ref: "#/components/schemas/ProviderModel" }
        status: { type: string }
    ProviderList:
      type: object
      required: [providers]
      properties:
        providers:
          type: array
          items: { $ref: "#/components/schemas/ProviderInfo" }
        all:
          type: array
          items: { $ref: "#/components/schemas/ProviderInfo" }
    AttachmentRef:
      type: object
      description: A file for the turn (iOS `AttachmentRef`); the bridge turns it into a gizzi file part.
      required: [mediaType]
      properties:
        url: { type: string }
        dataBase64: { type: string }
        mediaType: { type: string }
        name: { type: string }
    AgentChatMetadata:
      type: object
      properties:
        tools:
          description: The "+" sheet's tool options, forwarded to the runtime as-is.
          x-kotlin-raw: true
        form_factor: { type: string, description: '"phone" adds the small-screen reply block.' }
        time_zone: { type: string, description: IANA zone name. }
        screen_context: { type: string, description: '"available" while the app is in front.' }
        answer_cards: { type: string, description: '"widgets": the app draws the writing/lookup cards.' }
    AgentChatRequest:
      type: object
      description: v1_routes.rs `agent_chat_bridge` reads these keys from the JSON body.
      required: [chatId, message]
      properties:
        chatId: { type: string, description: The agent session id. }
        message: { type: string }
        agentId: { type: string }
        systemPrompt: { type: string }
        runtimeModelId: { type: string }
        effort: { type: string }
        fast: { type: boolean }
        attachments:
          type: array
          items: { $ref: "#/components/schemas/AttachmentRef" }
        metadata: { $ref: "#/components/schemas/AgentChatMetadata" }
        workdir: { type: string, description: The session's working folder; "" clears it. }
    SleepStatus:
      type: object
      description: sleep/types.rs `SleepStatus`.
      required: [available, enabled, stages, debt, spend_today_usd, daily_spend_cap_usd, open_disputes, tracks]
      properties:
        available: { type: boolean }
        enabled: { type: boolean }
        stages: { type: object, additionalProperties: { type: boolean } }
        debt: { type: number }
        last_cycle: { oneOf: [{ $ref: "#/components/schemas/SleepCycle" }, { type: "null" }] }
        spend_today_usd: { type: number }
        daily_spend_cap_usd: { type: number }
        manifest_id: { type: [string, "null"] }
        open_disputes: { type: integer }
        tracks:
          type: object
          required: [track1, track2]
          properties:
            track1: { type: string }
            track2: { type: string }
    SleepCycle:
      type: object
      description: sleep/types.rs `CycleSummary`.
      required: [id, trigger, kind, state, spend_usd, started_at]
      properties:
        id: { type: string }
        trigger: { type: string }
        kind: { type: string }
        state: { type: string }
        stage: { type: [string, "null"] }
        session_id: { type: [string, "null"] }
        spend_usd: { type: number }
        manifest_before: { type: [string, "null"] }
        manifest_after: { type: [string, "null"] }
        started_at: { type: string }
        finished_at: { type: [string, "null"] }
        undone_at: { type: [string, "null"] }
    MemoryDispute:
      type: object
      description: sleep/types.rs `DisputeView`.
      required: [id, side_a, side_b, state, created_at]
      properties:
        id: { type: string }
        topic_id: { type: [string, "null"] }
        side_a: { $ref: "#/components/schemas/MemoryDisputeSide" }
        side_b: { $ref: "#/components/schemas/MemoryDisputeSide" }
        scope: { type: [string, "null"] }
        stakes: { type: [number, "null"] }
        margin: { type: [number, "null"] }
        pick: { type: [string, "null"] }
        reason: { type: [string, "null"] }
        state: { type: string, enum: [open, needs_user, resolved] }
        created_at: { type: string }
    MemoryDisputeSide:
      type: object
      required: [kind, id]
      properties:
        kind: { type: string }
        id: { type: string }
    SleepSettings:
      type: object
      required: [enabled, stages, daily_spend_cap_usd]
      properties:
        enabled: { type: boolean }
        stages: { type: object, additionalProperties: { type: boolean } }
        daily_spend_cap_usd: { type: number }
        entries: { type: object }
    SleepNotAccepted:
      type: object
      required: [accepted, reason]
      properties:
        accepted: { type: boolean, const: false }
        reason: { type: string, enum: [sleep_disabled, stage_not_built] }
        stage: { type: string }
        error: { type: string }
    ComputerRunEvent:
      type: object
      description: One toolset-events SSE frame. `data` is one of the `Computer*EventData` schemas, picked by `type`.
      required: [type, ts, data]
      properties:
        type:
          type: string
          enum: [computer.action, computer.confirmation_required, computer.human_requested, computer.human_resumed, computer.block_detected, computer.block_resolved, computer.agent_display]
        ts: { type: string }
        data:
          type: object
          x-kotlin-raw: true
          description: The event's data; its shape depends on `type`.
    ComputerActionEventData:
      type: object
      description: computer_toolset.rs `emit_action`.
      required: [toolset, member, ok]
      properties:
        toolset: { type: string, enum: [computer, browser] }
        member: { type: string }
        x: { type: [integer, "null"] }
        y: { type: [integer, "null"] }
        screen_w: { type: [integer, "null"] }
        screen_h: { type: [integer, "null"] }
        run_id: { type: [string, "null"] }
        ok: { type: boolean }
        actor: { type: [object, "null"], x-kotlin-raw: true, description: "`{agent_id, name}` for the cursor badge." }
        step: { type: [string, "null"] }
        rerun_of: { type: [string, "null"], description: "The run this run re-runs, when the client started it with `rerun_of`." }
    CredentialRef:
      type: object
      description: A vault credential named for an approval. Never carries the value.
      required: [name, domain]
      properties:
        name: { type: string }
        domain: { type: [string, "null"], description: "Where it types (declared `domain`, else the vault binding): lower case, no scheme or `www.`." }
    ComputerConfirmationRequiredEventData:
      type: object
      description: computer_toolset.rs `emit_confirmation_required`. Also pushed as `aci_approval`. Approve with `POST /api/aci/handoff/{approval_id}/approve`, then the agent retries with the grant.
      required: [computer_id, approval_id, kind, member, message]
      properties:
        run_id: { type: [string, "null"] }
        computer_id: { type: string }
        approval_id: { type: string }
        kind: { type: string, enum: [action, credential] }
        credential: { oneOf: [{ $ref: "#/components/schemas/CredentialRef" }, { type: "null" }], description: "Set when `kind` is `credential`." }
        confirmation_class: { type: [string, "null"], description: "`risky` or `irreversible`." }
        member: { type: string }
        message: { type: string }
    ConfirmationRequiredBody:
      type: object
      description: aci_safety.rs `enforce_confirmation_with_details`. The refusal body the toolset route answers 409 `approval_required` (other ACI routes 403 `confirmation_required`) with, among the toolset result fields.
      required: [error, approval_id, action_hash, confirmation_class, kind, message]
      properties:
        error: { type: string }
        approval_id: { type: string }
        action_hash: { type: string }
        confirmation_class: { type: string }
        kind: { type: string, enum: [action, credential] }
        credential: { $ref: "#/components/schemas/CredentialRef" }
        message: { type: string }
    ComputerHumanEventData:
      type: object
      description: computer_v2.rs `emit_human_event` (`human_requested` / `human_resumed`). `human_requested` is also pushed as `aci_human`. Done is `POST /computers/{id}/human-done`.
      required: [computer_id, reason, run_id, live_view, input_enabled]
      properties:
        computer_id: { type: string }
        reason: { type: string }
        run_id: { type: string }
        live_view: { type: boolean }
        input_enabled: { type: boolean }
        timeout_ms: { type: integer }
        resumed: { type: boolean }
        timed_out: { type: boolean }
        held_by: { type: [string, "null"] }
        kind: { type: string, enum: [safari_profile], description: "`safari_profile`: a browser run on this Mac needs the \"Allternit Agent\" Safari profile; show `steps`, then Continue (`human-done`)." }
        steps: { type: array, items: { type: string }, description: "With `kind: safari_profile`: the driver's setup steps." }
        setup_reason: { type: string, description: "With `kind: safari_profile`: why the driver couldn't make the profile." }
    RerunTarget:
      type: object
      description: |
        One of the person's online Macs a blocked run can be re-run on: a
        this-device computer of the same allternit-api, or (from cloud-api
        `GET /api/v1/runtime-presence/computers`) a Desktop runtime on macOS
        whose heartbeat is under two minutes old. Start the re-run with
        `POST /computers/{computer_id}/runs` on the runtime `runtime_id`.
      required: [computer_id, name]
      properties:
        computer_id: { type: string, description: "A computer id, or a runtime id for a Mac listed from cloud-api." }
        name: { type: string }
        runtime_id: { type: [string, "null"], description: The runtime that Mac's allternit-api is paired as. }
    ComputerBlockDetectedEventData:
      type: object
      description: computer_block.rs `hold`. The run waits until `POST /computers/{computer_id}/block-resolve` (or `timeout_ms`, after which it goes on with a note). Also pushed as `aci_blocked`.
      required: [run_id, computer_id, domain, kind, rerun_targets, timeout_ms]
      properties:
        run_id: { type: string }
        computer_id: { type: string }
        domain: { type: [string, "null"] }
        kind: { type: string, enum: [login, two_factor, captcha, block_page, rate_limited] }
        rerun_targets: { type: array, items: { $ref: "#/components/schemas/RerunTarget" }, description: "Empty when no Mac is online." }
        timeout_ms: { type: integer }
    ComputerBlockResolvedEventData:
      type: object
      description: computer_block.rs `hold`, when the hold ends.
      required: [run_id, computer_id, domain, kind, action, rerun_target]
      properties:
        run_id: { type: string }
        computer_id: { type: string }
        domain: { type: [string, "null"] }
        kind: { type: string, enum: [login, two_factor, captcha, block_page, rate_limited] }
        action: { type: string, enum: [continue, stop, rerun, timed_out] }
        rerun_target: { type: [string, "null"] }
    ComputerAgentDisplayEventData:
      type: object
      description: computer_agent_display.rs, when a run on a Linux cloud computer gets (`started`) or gives back (`stopped`) its own X display and browser. Point the run's live view at `display` (VNC on `vnc_port` on the desktop image; `GET /api/v1/computers/{id}/screenshot?run_id=`).
      required: [run_id, computer_id, agent_id, display, state]
      properties:
        run_id: { type: string }
        computer_id: { type: string }
        agent_id: { type: string }
        display: { type: string, description: "`:N`" }
        vnc_port: { type: [integer, "null"] }
        state: { type: string, enum: [started, stopped] }
    BlockResolveRequest:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [continue, stop, rerun] }
        rerun_target: { type: string, description: "With `rerun`: a `computer_id` from the event's `rerun_targets`." }
    BlockResolveResponse:
      type: object
      required: [ok, action, run_id, domain, kind, rerun_target]
      properties:
        ok: { type: boolean }
        action: { type: string, enum: [continue, stop, rerun] }
        run_id: { type: string, description: "The held run; send it as `rerun_of` on the new run." }
        domain: { type: [string, "null"] }
        kind: { type: string, enum: [login, two_factor, captcha, block_page, rate_limited] }
        rerun_target: { type: [string, "null"] }
    ComputerRunRequest:
      type: object
      required: [task]
      properties:
        task: { type: string, description: The task in plain words. }
        rerun_of: { type: string, description: "The blocked run this run re-runs (`run_id` from `block-resolve` or `computer.block_detected`)." }
        bot_id: { type: string, description: The bot the run is for (names the agent cursor). }
    AciRunRequest:
      type: object
      required: [goal]
      properties:
        goal: { type: string }
        model: { type: string }
        botId: { type: string }
        threadId: { type: string }
        allowedSites: { x-kotlin-raw: true, description: "A host or a list of hosts." }
        credentialNames: { type: array, items: { type: string } }
        approvalId: { type: string }
        targetDevice: { type: string, description: "`app:<phoneId>` for the iPhone app's browser; absent = this runtime." }
        rerunOf: { type: string, description: "Also accepted as `rerun_of`." }
    AciRunStarted:
      type: object
      required: [sessionId, run_id, adapterId]
      properties:
        sessionId: { type: string, description: The run id (older name). }
        run_id: { type: string }
        adapterId: { type: string, enum: [browser, phone-browser] }
        computer_id: { type: [string, "null"], description: The computer the run drives; null = this device. }
        rerun_of: { type: [string, "null"] }
    ControlHolder:
      type: object
      required: [kind, id]
      properties:
        kind: { type: string, enum: [user, agent, session, bot] }
        id: { type: string }
        label: { type: [string, "null"] }
        device_id: { type: [string, "null"] }
    ControlLease:
      type: object
      required: [computer_id, holder, acquired_at, expires_at]
      properties:
        computer_id: { type: string }
        holder: { $ref: "#/components/schemas/ControlHolder" }
        acquired_at: { type: string }
        expires_at: { type: string }
    ComputerControlState:
      type: object
      required: [control, handoffs]
      properties:
        control: { oneOf: [{ $ref: "#/components/schemas/ControlLease" }, { type: "null" }] }
        handoffs: { type: array, items: { type: object, x-kotlin-raw: true }, description: "Pending control handoffs (`{id, computer_id, direction, from, to, note, created_at, expires_at}`)." }
    ComputerControlTaken:
      type: object
      required: [control]
      properties:
        control: { $ref: "#/components/schemas/ControlLease" }
    ComputerControlHeld:
      type: object
      required: [error, message, control]
      properties:
        error: { type: string, const: computer_controlled_elsewhere }
        message: { type: string }
        control: { $ref: "#/components/schemas/ControlLease" }
    ComputerControlReleased:
      type: object
      required: [released]
      properties:
        released: { type: boolean }
        control: { type: "null" }
    ComputerSecretRequest:
      type: object
      properties:
        text: { type: string, description: The value. Required unless `cancel`. }
        save_as: { type: string, description: Store it in the vault under this name. }
        cancel: { type: boolean }
    ComputerSecretPending:
      type: object
      required: [pending]
      properties:
        pending: { type: boolean }
        label: { type: string }
        waiting_s: { type: integer }
    OkResponse:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
    HandoffApproveRequest:
      type: object
      properties:
        scope: { type: string, enum: [once, run], description: "`run` = Allow for this run (credential approvals only)." }
    HandoffApproveResponse:
      type: object
      required: [approval_id, status, scope]
      properties:
        approval_id: { type: string }
        status: { type: string, const: approved }
        scope: { type: string, enum: [once, run] }
    AciPushNotify:
      type: object
      description: |
        computer_block.rs `push_to_owner`: what allternit-api POSTs to cloud-api
        `POST /push/notify/{runtime_id}` (host root, `routes/aci_push.rs`) for a
        run event. Relay-signed exactly like `/api/v1/runtime/events` (signed
        path `/push/notify/{runtime_id}`, `x-allternit-runtime-id` header) and
        sent only when the runtime is paired to the run's owner. cloud-api
        rebuilds `data` from an allowlist and fans it out to web push, APNs and
        FCM (categories ACI_APPROVAL, ACI_HUMAN, ACI_BLOCKED).
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/AciPushData" }
        bot_name: { type: string, description: "The driving agent's name, when the run named one." }
    AciPushData:
      type: object
      description: "One of three kinds. A credential goes by name + domain only, never its value."
      required: [kind, run_id, computer_id]
      properties:
        kind: { type: string, enum: [aci_approval, aci_human, aci_blocked] }
        run_id: { type: string }
        computer_id: { type: string }
        approval_id: { type: string, description: "aci_approval only." }
        approval_kind: { type: string, enum: [action, credential], description: "aci_approval only." }
        credential: { $ref: "#/components/schemas/CredentialRef" }
        message: { type: string, description: "aci_approval only." }
        reason: { type: string, description: "aci_human only: what the agent asked for." }
        secret: { type: boolean, description: "aci_human only: true for a masked-box secret request." }
        domain: { type: [string, "null"], description: "aci_blocked only." }
        block_kind: { type: string, enum: [login, two_factor, captcha, block_page, rate_limited], description: "aci_blocked only." }
        rerun_targets: { type: array, items: { type: string }, description: "aci_blocked only: computer ids of the person's online Macs." }
    KnowledgeFlag:
      type: object
      description: knowledge_store.rs `Flag` (the `knowledge_flags` row).
      required: [id, user_id, kind, target_kind, evidence, status, created_at, updated_at]
      properties:
        id: { type: string }
        user_id: { type: string }
        agent_id: { type: [string, "null"] }
        session_id: { type: [string, "null"] }
        turn_id: { type: [string, "null"] }
        kind: { type: string, enum: [missing, wrong, stale] }
        target_kind: { type: string, enum: [skill, domain, data_access] }
        target_ref: { type: [string, "null"] }
        evidence: { type: string }
        suggested_fix: { type: [string, "null"] }
        status: { type: string, enum: [open, proposed, resolved, dismissed] }
        proposal_id: { type: [string, "null"] }
        created_at: { type: string }
        updated_at: { type: string }
    KnowledgeFlagResponse:
      type: object
      required: [flag]
      properties:
        flag: { $ref: "#/components/schemas/KnowledgeFlag" }
    KnowledgeEvidence:
      type: object
      description: Exactly one of the two ids.
      properties:
        flag_id: { type: string }
        observation_id: { type: string }
    KnowledgeProposal:
      type: object
      description: knowledge_store.rs `Proposal` (the `knowledge_proposals` row; `evidence_json` and `eval_json` are returned parsed as `evidence` and `eval`).
      required: [id, user_id, target_kind, target_ref, title, body, evidence, origin, status, created_at, updated_at]
      properties:
        id: { type: string }
        user_id: { type: string }
        target_kind: { type: string, enum: [skill, domain, data_access] }
        target_ref: { type: string }
        title: { type: string }
        body: { type: string }
        base: { type: [string, "null"] }
        evidence: { type: array, items: { $ref: "#/components/schemas/KnowledgeEvidence" } }
        origin: { type: string, enum: [curator, agent, skill_growth] }
        eval: { type: [object, "null"] }
        status: { type: string, enum: [proposed, approved, rejected, active, rolled_back] }
        decided_at: { type: [string, "null"] }
        created_at: { type: string }
        updated_at: { type: string }
    KnowledgeProposalResponse:
      type: object
      required: [proposal]
      properties:
        proposal: { $ref: "#/components/schemas/KnowledgeProposal" }
    RawSearchRequest:
      type: object
      required: [query]
      properties:
        query: { type: string }
        from:
          type: [string, "null"]
          description: "YYYY-MM-DD or RFC 3339; inclusive"
        to:
          type: [string, "null"]
          description: "YYYY-MM-DD (includes that whole day) or RFC 3339 (inclusive)"
        session_id: { type: [string, "null"] }
        exclude_sessions: { type: array, items: { type: string } }
        limit:
          type: [integer, "null"]
          maximum: 32
          description: "Windows kept after rerank; default 8 (auto) or 12 (search)"
        include_knowledge: { type: boolean, default: false }
        mode: { type: string, enum: [auto, search], default: search }
        calling_session:
          type: [string, "null"]
          description: "The session asking; its activity records the past chats returned"
    RawTurn:
      type: object
      required: [observation_id, speaker, timestamp, text, score, window_ids]
      properties:
        observation_id: { type: string }
        session_id: { type: [string, "null"] }
        speaker:
          type: string
          description: "user, assistant or tool:<name>"
        timestamp: { type: string, format: date-time }
        source: { type: [string, "null"] }
        text:
          type: string
          description: "The full turn, clipped at 1,200 chars (marked)"
        score: { type: number }
        window_ids: { type: array, items: { type: string } }
    KnowledgeHit:
      type: object
      required: [path, kind, text, score]
      properties:
        path: { type: string }
        kind: { type: string, enum: [domain, data_access] }
        text: { type: string }
        score: { type: number }
    RawSearchResult:
      type: object
      required: [turns, knowledge, reranked]
      properties:
        turns: { type: array, items: { $ref: "#/components/schemas/RawTurn" } }
        knowledge: { type: array, items: { $ref: "#/components/schemas/KnowledgeHit" } }
        reranked: { type: boolean }
    TurnNeighbors:
      type: object
      required: [turns]
      properties:
        turns: { type: array, items: { $ref: "#/components/schemas/RawTurn" } }

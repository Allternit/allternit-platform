openapi: 3.1.0
info:
  title: Allternit App API (allternit-api)
  version: "1.0.0"
  summary: The first-party app routes the native phone apps call on allternit-api.
  description: |
    Internal contract for Allternit's own apps (iOS, Android), not the public
    developer API (that is `cmd/allternit-cloud-api/openapi/platform-v1.yaml`,
    which a router test pins to `/v1` routes only, so these routes cannot live
    there). Not published to the docs site.

    Base URLs, chosen per operation with `x-base`:
    - `api`: `https://api.allternit.com/api/v1` (the app's `ApiConfig.apiBaseUrl`);
      paths are relative to it.
    - `instance`: the origin of the user's connected computer (relay, mesh or
      direct gizzi-code); paths are absolute on that origin.

    Every route takes `Authorization: Bearer <Clerk session JWT or API token>`.
    Errors are `{ "error": "<code>", "message"?: "<text>" }`.

    Source of truth for shapes is the Rust handler named in each operation's
    `x-handler`. Kotlin is generated from this file by
    `contracts/mobile-api/generate.mjs` (operations listed in
    `contracts/mobile-api/operations.json`).
servers:
  - url: https://api.allternit.com/api/v1
security:
  - bearerAuth: []
paths:
  /me:
    get:
      operationId: getMe
      summary: The signed-in user and their resolved organization
      x-base: api
      x-handler: cmd/allternit-api/src/me_routes.rs get_current_user
      tags: [Account]
      responses:
        "200":
          description: The profile, wrapped in `user`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeResponse" }
        default: { $ref: "#/components/responses/Error" }
  /me/organization:
    post:
      operationId: createPersonalOrganization
      summary: Create a personal organization (no-op when one exists)
      x-base: api
      x-handler: cmd/allternit-api/src/me_routes.rs create_personal_organization
      tags: [Account]
      responses:
        "200":
          description: The organization id; `created` is false when it already existed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreateOrganizationResponse" }
        default: { $ref: "#/components/responses/Error" }
  /agent-sessions:
    get:
      operationId: listAgentSessions
      summary: List chat sessions (ephemeral ones are left out)
      x-base: api
      x-handler: cmd/allternit-api/src/agent_session_routes.rs list_sessions
      tags: [Sessions]
      responses:
        "200":
          description: Sessions and their count.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentSessionList" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createAgentSession
      summary: Create a chat session
      x-base: api
      x-handler: cmd/allternit-api/src/agent_session_routes.rs create_session
      tags: [Sessions]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAgentSessionRequest" }
      responses:
        "201":
          description: The new session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentSession" }
        default: { $ref: "#/components/responses/Error" }
  /agent-sessions/{id}:
    get:
      operationId: getAgentSession
      summary: One chat session
      x-base: api
      x-handler: cmd/allternit-api/src/agent_session_routes.rs get_session
      tags: [Sessions]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentSession" }
        default: { $ref: "#/components/responses/Error" }
  /agent-sessions/{id}/messages:
    get:
      operationId: listAgentSessionMessages
      summary: Every message of a session, oldest first (a bare array)
      x-base: api
      x-handler: cmd/allternit-api/src/agent_session_routes.rs list_messages
      tags: [Sessions]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The messages.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AgentSessionMessage" }
        default: { $ref: "#/components/responses/Error" }
  /agent-evals/cases:
    get:
      operationId: listAgentEvalCases
      summary: "List saved eval cases (`?session_id=&suite=`)"
      x-base: api
      x-handler: cmd/allternit-api/src/agent_eval_routes.rs list_cases
      tags: [Evals]
      parameters:
        - name: session_id
          in: query
          required: false
          schema: { type: string }
        - name: suite
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: "`{cases}`."
          content:
            application/json:
              schema: { type: object }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createAgentEvalCase
      summary: Save a chat session as an eval case
      x-base: api
      x-handler: cmd/allternit-api/src/agent_eval_routes.rs create_case
      tags: [Evals]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: "`{session_id, label, note?, through_message_id?, quick_check?, suite?}`" }
      responses:
        "201":
          description: "`{case, self_test, needs_check}`."
          content:
            application/json:
              schema: { type: object }
        "404":
          description: "`session_not_found`."
          content:
            application/json:
              schema: { type: object }
        "409":
          description: "`case_limit`."
          content:
            application/json:
              schema: { type: object }
        "422":
          description: "`empty_session`."
          content:
            application/json:
              schema: { type: object }
        default: { $ref: "#/components/responses/Error" }
  /agent-evals/cases/{id}:
    get:
      operationId: getAgentEvalCase
      summary: One full eval case
      x-base: api
      x-handler: cmd/allternit-api/src/agent_eval_routes.rs get_case
      tags: [Evals]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: "`{case}`."
          content:
            application/json:
              schema: { type: object }
        "404":
          description: Not found.
          content:
            application/json:
              schema: { type: object }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteAgentEvalCase
      summary: Delete an eval case
      x-base: api
      x-handler: cmd/allternit-api/src/agent_eval_routes.rs delete_case
      tags: [Evals]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted.
        "404":
          description: Not found.
          content:
            application/json:
              schema: { type: object }
        default: { $ref: "#/components/responses/Error" }
  /agent-evals/suites:
    get:
      operationId: listAgentEvalSuites
      summary: List eval suites with their last run
      x-base: api
      x-handler: cmd/allternit-api/src/agent_eval_routes.rs list_suites
      tags: [Evals]
      responses:
        "200":
          description: "`{suites}`."
          content:
            application/json:
              schema: { type: object }
        default: { $ref: "#/components/responses/Error" }
  /agent-evals/runs/estimate:
    post:
      operationId: estimateAgentEvalRun
      summary: Estimate what a live run costs before starting it
      x-base: api
      x-handler: cmd/allternit-api/src/agent_eval_routes.rs estimate_run
      tags: [Evals]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: "`{suite, case_ids?, k?, model?}`" }
      responses:
        "200":
          description: The estimate; its `estimate_id` is valid for 10 minutes.
          content:
            application/json:
              schema: { type: object }
        default: { $ref: "#/components/responses/Error" }
  /agent-evals/runs:
    get:
      operationId: listAgentEvalRuns
      summary: "List eval runs, newest first (`?suite=`)"
      x-base: api
      x-handler: cmd/allternit-api/src/agent_eval_routes.rs list_runs
      tags: [Evals]
      parameters:
        - name: suite
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: "`{runs}`."
          content:
            application/json:
              schema: { type: object }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createAgentEvalRun
      summary: Start an eval run (replay or live)
      x-base: api
      x-handler: cmd/allternit-api/src/agent_eval_routes.rs create_run
      tags: [Evals]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: "`{suite, mode, case_ids?, k?, model?, estimate_id?, fraction?, seed?}`" }
      responses:
        "200":
          description: "Replay: `{run_id, report}`."
          content:
            application/json:
              schema: { type: object }
        "202":
          description: "Live: `{run_id}`."
          content:
            application/json:
              schema: { type: object }
        "409":
          description: "`estimate_required`: a live run needs a fresh estimate."
          content:
            application/json:
              schema: { type: object }
        default: { $ref: "#/components/responses/Error" }
  /agent-evals/runs/{id}:
    get:
      operationId: getAgentEvalRun
      summary: State, progress and report of one run
      x-base: api
      x-handler: cmd/allternit-api/src/agent_eval_routes.rs get_run
      tags: [Evals]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The run.
          content:
            application/json:
              schema: { type: object }
        "404":
          description: Not found.
          content:
            application/json:
              schema: { type: object }
        default: { $ref: "#/components/responses/Error" }
  /agent-evals/runs/{id}/cancel:
    post:
      operationId: cancelAgentEvalRun
      summary: Cancel a running eval
      x-base: api
      x-handler: cmd/allternit-api/src/agent_eval_routes.rs cancel_run
      tags: [Evals]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "202":
          description: Cancel requested.
        "404":
          description: Not found.
          content:
            application/json:
              schema: { type: object }
        default: { $ref: "#/components/responses/Error" }
  /models:
    get:
      operationId: listModels
      summary: The flattened runtime model catalog (a bare array)
      description: Read live from the connected gizzi runtime. 503 `models_unavailable` when it cannot be read.
      x-base: api
      x-handler: cmd/allternit-api/src/v1_routes.rs list_available_models
      tags: [Models]
      responses:
        "200":
          description: The catalog.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RuntimeModel" }
        default: { $ref: "#/components/responses/Error" }
  /providers:
    get:
      operationId: listProviders
      summary: Model providers (live from gizzi, else the static merge)
      x-base: api
      x-handler: cmd/allternit-api/src/provider_routes.rs list_providers
      tags: [Models]
      responses:
        "200":
          description: The providers.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderList" }
        default: { $ref: "#/components/responses/Error" }
  /api/agent-chat:
    post:
      operationId: agentChat
      summary: Send a chat turn and stream the reply (server-sent events)
      description: |
        Served by the user's connected computer (gizzi-code `agent-compat.ts`,
        or allternit-api's bridge), not the gateway. The body is an SSE stream
        of JSON `data:` frames (see `AgentChatStream.kt` for the frame types);
        `data: [DONE]` ends it. 409 with `no_brain` when the computer has no
        model signed in.
      x-base: instance
      x-stream: sse
      x-handler: cmd/allternit-api/src/v1_routes.rs agent_chat_bridge
      tags: [Chat]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentChatRequest" }
      responses:
        "200":
          description: The event stream.
          content:
            text/event-stream:
              schema: { type: string }
        default: { $ref: "#/components/responses/Error" }
  /memory/sleep/status:
    get:
      operationId: getSleepStatus
      summary: Allternit Sleep status for the signed-in user (stub until each stage lands; all stages off by default)
      x-base: api
      x-handler: cmd/allternit-api/src/sleep/routes.rs status
      tags: [Memory]
      responses:
        "200":
          description: Status. `available` is true wherever the runtime has the sleep module.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SleepStatus" }
        default: { $ref: "#/components/responses/Error" }
  /memory/sleep/cycles:
    get:
      operationId: listSleepCycles
      summary: Recent Sleep cycles (the report list), newest first
      x-base: api
      x-handler: cmd/allternit-api/src/sleep/routes.rs list_cycles
      tags: [Memory]
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer } }
        - { name: state, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: Cycles and their count.
          content:
            application/json:
              schema:
                type: object
                required: [cycles, count]
                properties:
                  cycles: { type: array, items: { $ref: "#/components/schemas/SleepCycle" } }
                  count: { type: integer }
        default: { $ref: "#/components/responses/Error" }
  /memory/sleep/cycles/{id}:
    get:
      operationId: getSleepCycle
      summary: One Sleep cycle with its report (null while it runs)
      x-base: api
      x-handler: cmd/allternit-api/src/sleep/routes.rs get_cycle
      tags: [Memory]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The cycle and its report (per-stage outcome, counts, spend, undo info).
          content:
            application/json:
              schema:
                type: object
                required: [cycle]
                properties:
                  cycle: { $ref: "#/components/schemas/SleepCycle" }
                  report: { type: [object, "null"] }
        default: { $ref: "#/components/responses/Error" }
  /memory/sleep/run:
    post:
      operationId: runSleep
      summary: Start a sleep now (queues a nap or daydream). 409 with `accepted:false` while Sleep is off or the kind is not built
      x-base: api
      x-handler: cmd/allternit-api/src/sleep/routes.rs run
      tags: [Memory]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                kind: { type: string, enum: [nap, daydream] }
      responses:
        "202": { description: Queued. }
        "409":
          description: Refused.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SleepNotAccepted" }
        default: { $ref: "#/components/responses/Error" }
  /memory/sleep/cycles/{id}/undo:
    post:
      operationId: undoSleepCycle
      summary: Undo one cycle (restores the previous page manifest). 409 with `accepted:false` while the stage is off or not built
      x-base: api
      x-handler: cmd/allternit-api/src/sleep/routes.rs undo_cycle
      tags: [Memory]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Undone. }
        "409":
          description: Refused; `reason` is `sleep_disabled` or `stage_not_built`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SleepNotAccepted" }
        default: { $ref: "#/components/responses/Error" }
  /memory/disputes:
    get:
      operationId: listMemoryDisputes
      summary: Memory disputes (two claims that disagree), newest first
      x-base: api
      x-handler: cmd/allternit-api/src/sleep/routes.rs list_disputes
      tags: [Memory]
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer } }
        - { name: state, in: query, required: false, schema: { type: string, enum: [open, needs_user, resolved] } }
      responses:
        "200":
          description: Disputes and their count.
          content:
            application/json:
              schema:
                type: object
                required: [disputes, count]
                properties:
                  disputes: { type: array, items: { $ref: "#/components/schemas/MemoryDispute" } }
                  count: { type: integer }
        default: { $ref: "#/components/responses/Error" }
  /memory/disputes/{id}/resolve:
    post:
      operationId: resolveMemoryDispute
      summary: The user picks a side. 409 with `accepted:false` while the disputes stage is off or not built
      x-base: api
      x-handler: cmd/allternit-api/src/sleep/routes.rs resolve_dispute
      tags: [Memory]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [choice]
              properties:
                choice: { type: string, enum: [a, b, both_scoped, neither] }
                reason: { type: string }
      responses:
        "200": { description: Resolved. }
        "409":
          description: Refused.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SleepNotAccepted" }
        default: { $ref: "#/components/responses/Error" }
  /memory/sleep/settings:
    get:
      operationId: getSleepSettings
      summary: The user's Sleep switches and daily spend cap
      x-base: api
      x-handler: cmd/allternit-api/src/sleep/routes.rs get_settings
      tags: [Memory]
      responses:
        "200":
          description: Settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SleepSettings" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: putSleepSettings
      summary: Change switches (written as owner rows, all-or-nothing; an unknown stage is 400)
      x-base: api
      x-handler: cmd/allternit-api/src/sleep/routes.rs put_settings
      tags: [Memory]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean }
                stages: { type: object, additionalProperties: { type: boolean } }
                daily_spend_cap_usd: { type: number }
      responses:
        "200":
          description: The settings after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SleepSettings" }
        default: { $ref: "#/components/responses/Error" }
  /computers/{id}/toolset/events:
    get:
      operationId: streamComputerToolsetEvents
      summary: Live run events for one computer (SSE), the stream every surface reads for cursors, approvals, human windows and blocked pages
      description: |
        Server-sent events, one JSON object per `data:` line, shaped
        `{ "type": "<event type>", "ts": "<RFC 3339>", "data": { ... } }`.
        Types and their `data` schemas:
        - `computer.action`: `ComputerActionEventData`
        - `computer.confirmation_required`: `ComputerConfirmationRequiredEventData`
        - `computer.human_requested` / `computer.human_resumed`: `ComputerHumanEventData`
        - `computer.block_detected`: `ComputerBlockDetectedEventData`
        - `computer.block_resolved`: `ComputerBlockResolvedEventData`
        - `computer.agent_display`: `ComputerAgentDisplayEventData`
        The SSE `event:` name is `computer.action` on every frame (kept for
        older listeners), so read `type` from the JSON. Clients ignore types
        they don't know. The same frames go out on the computer's events
        websocket. The approval, human and block events also have a push
        kind (see `AciPushNotify`).
      x-base: api
      x-stream: sse
      x-handler: cmd/allternit-api/src/computer_toolset.rs get_toolset_events
      tags: [Computers]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The event stream.
          content:
            text/event-stream:
              schema: { $ref: "#/components/schemas/ComputerRunEvent" }
        default: { $ref: "#/components/responses/Error" }
  /computers/{id}/block-resolve:
    post:
      operationId: resolveComputerBlock
      summary: Answer a `computer.block_detected` hold (continue, stop, or re-run on the person's Mac)
      description: |
        `continue`: the person signed in or solved the page; the run goes on and
        the same domain + kind won't hold this run again. `stop`: the run ends.
        `rerun`: the run ends here and the CLIENT starts a new run on
        `rerun_target` (one of the event's `rerun_targets`) with
        `rerun_of` set to the returned `run_id` on its toolset calls. The server
        never moves a run between computers. 409 `no_block_pending` when no hold
        is waiting; 400 `invalid_rerun_target` for a computer not listed.
      x-base: api
      x-handler: cmd/allternit-api/src/computer_toolset.rs post_block_resolve
      tags: [Computers]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BlockResolveRequest" }
      responses:
        "200":
          description: The hold was answered.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlockResolveResponse" }
        default: { $ref: "#/components/responses/Error" }
  /computers/{id}/runs:
    post:
      operationId: startComputerRun
      summary: Start an agent run on one computer ("Re-run on my Mac" from a blocked page)
      description: |
        Starts an agent run the same way `POST /api/aci/run` does (safety
        gate, handoff, planning loop, run buffer, run cards), with the
        engine's toolset calls aimed at this computer. `rerun_of` records the
        blocked run this one re-runs: the new run's audit rows and
        `computer.action` events carry it. A re-run starts fresh (no logins
        carried over). `{id}` is a computer id, `this-device`, or the target
        runtime's own runtime id (a `rerun_targets` entry listed from
        cloud-api carries `runtime_id`; address that runtime). Stream the run
        with `GET /api/aci/stream/{run_id}`. A run on this device (macOS)
        opens its own Safari window on its first call; a missing agent
        profile shows as `computer.human_requested` with `kind:
        "safari_profile"`. 202 `handoff_required` (same body as
        `/api/aci/run`) when the task needs approval first; 404
        `computer_unavailable`; 400 `invalid_rerun_of`.
      x-base: api
      x-handler: cmd/allternit-api/src/aci_routes.rs start_computer_run
      tags: [Computers]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ComputerRunRequest" }
      responses:
        "200":
          description: The run started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AciRunStarted" }
        "202":
          description: "`handoff_required`: approve `approval_id`, then send the same body again with it."
          content:
            application/json:
              schema: { type: object, x-kotlin-raw: true }
        default: { $ref: "#/components/responses/Error" }
  /api/aci/run:
    post:
      operationId: startAciRun
      summary: Start an agent browser run on this runtime
      description: |
        Mounted at `/api/aci/...` on the same host, not under `/api/v1`.
        camelCase body (`goal`, `botId`, `threadId`, `allowedSites`,
        `credentialNames`, `approvalId`, `targetDevice`, ...). `rerunOf` (or
        `rerun_of`) records the blocked run this one re-runs, the same as on
        `POST /computers/{id}/runs`. The answer now also carries `run_id`,
        `computer_id` and `rerun_of`.
      x-base: instance
      x-handler: cmd/allternit-api/src/aci_routes.rs aci_run
      tags: [Computers]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AciRunRequest" }
      responses:
        "200":
          description: The run started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AciRunStarted" }
        "202":
          description: "`handoff_required`."
          content:
            application/json:
              schema: { type: object, x-kotlin-raw: true }
        default: { $ref: "#/components/responses/Error" }
  /computers/{id}/control:
    get:
      operationId: getComputerControl
      summary: Who controls this computer now, and pending control handoffs
      x-base: api
      x-handler: cmd/allternit-api/src/computer_routes.rs get_computer_control
      tags: [Computers]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The current lease (null when nobody holds control) and pending handoffs.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComputerControlState" }
        default: { $ref: "#/components/responses/Error" }
  /computers/{id}/control/take:
    post:
      operationId: takeComputerControl
      summary: Take over (or renew) control of a computer
      description: |
        The caller becomes the holder (`kind: user`; the device from the
        `x-allternit-device-id` header). A lease lasts 120 s without a renew,
        so a surface that keeps control calls this again before it ends. A
        person may take over from an agent (the agent's next action answers
        423 and it can `request_human`); 423 `computer_controlled_elsewhere`
        (with `control`) when another person holds it. On this device, taking
        control is how a person lets agents drive their own screen.
      x-base: api
      x-handler: cmd/allternit-api/src/computer_routes.rs take_computer_control
      tags: [Computers]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The caller holds control.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComputerControlTaken" }
        "423":
          description: "`computer_controlled_elsewhere`: someone else holds control."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComputerControlHeld" }
        default: { $ref: "#/components/responses/Error" }
  /computers/{id}/control/release:
    post:
      operationId: releaseComputerControl
      summary: Hand control back
      x-base: api
      x-handler: cmd/allternit-api/src/computer_routes.rs release_computer_control
      tags: [Computers]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: "`released` is false when the caller wasn't holding control."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComputerControlReleased" }
        default: { $ref: "#/components/responses/Error" }
  /computers/{id}/secret:
    post:
      operationId: supplyComputerSecret
      summary: Answer the masked secret box (`request_human` with `secret`)
      description: |
        `{ "text", "save_as"? }` sends the value; the waiting call writes it
        into the field and the agent never sees it. `{ "cancel": true }`
        cancels. Owner auth only. 409 `no_secret_request` when no request is
        pending (never asked, answered, cancelled or expired); 400
        `invalid_secret` for an empty or over-long (4096) value; 502
        `secret_failed` when writing it failed. `save_as` stores the value in
        the vault under that name, bound to the request's domain.
      x-base: api
      x-handler: cmd/allternit-api/src/computer_toolset.rs post_secret
      tags: [Computers]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ComputerSecretRequest" }
      responses:
        "200":
          description: Delivered (or cancelled).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkResponse" }
        "409":
          description: "`no_secret_request`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        default: { $ref: "#/components/responses/Error" }
    get:
      operationId: getComputerSecretPending
      summary: Is a masked secret box waiting (for a surface that connected late)?
      x-base: api
      x-handler: cmd/allternit-api/src/computer_toolset.rs get_secret
      tags: [Computers]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Never carries a value.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComputerSecretPending" }
        default: { $ref: "#/components/responses/Error" }
  /computers/{id}/screenshot:
    get:
      operationId: getComputerScreenshot
      summary: One PNG of the computer's screen (or one agent run's own display)
      description: |
        `run_id` shows that run's own display on a Linux cloud computer (see
        `computer.agent_display`). Without it: the one run on that computer
        that has its own display, else the shared desktop. 409 for a paired
        computer (view it live instead).
      x-base: api
      x-handler: cmd/allternit-api/src/computer_routes.rs computer_screenshot
      tags: [Computers]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: run_id, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: The screenshot.
          content:
            image/png:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Error" }
  /api/aci/handoff/{id}/approve:
    post:
      operationId: approveAciHandoff
      summary: Approve a pending approval (`approval_id` from `computer.confirmation_required` or the 409 body)
      description: |
        Mounted at `/api/aci/...` on the same host, not under `/api/v1`, so
        the path is absolute. The body is optional. `{ "scope": "run" }` on a
        credential approval (`kind: "credential"`) is "Allow for this run":
        later fills of the same credential name into the same domain in the
        same run skip the prompt. It lives in memory only and ends with the
        run; nothing is remembered per site. Any other approval is single-use
        and answers `scope: "once"`. Deny is `POST /api/aci/handoff/{id}/deny`.
        Only the run's owner may approve or deny: the user the approval was
        raised for, the owner of the computer it names, or the Desktop app on
        this device (its local access token, not relayed). Anyone else gets
        403 `not_run_owner` and the approval stays pending.
      x-base: instance
      x-handler: cmd/allternit-api/src/aci_routes.rs aci_handoff_approve
      tags: [Computers]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HandoffApproveRequest" }
      responses:
        "200":
          description: Approved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HandoffApproveResponse" }
        "403":
          description: "`not_run_owner`: the caller doesn't own this run or computer."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        default: { $ref: "#/components/responses/Error" }
  /knowledge/flags:
    get:
      operationId: listKnowledgeFlags
      summary: The signed-in user's knowledge flags, newest first
      x-base: api
      x-handler: cmd/allternit-api/src/knowledge_routes.rs list_flags
      tags: [Knowledge]
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [open, proposed, resolved, dismissed] } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200 } }
      responses:
        "200":
          description: Flags.
          content:
            application/json:
              schema:
                type: object
                required: [flags]
                properties:
                  flags: { type: array, items: { $ref: "#/components/schemas/KnowledgeFlag" } }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createKnowledgeFlag
      summary: File a flag (knowledge was missing, wrong or stale). Never include secrets
      x-base: api

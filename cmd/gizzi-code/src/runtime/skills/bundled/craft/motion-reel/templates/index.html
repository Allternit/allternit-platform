<!doctype html>
<html><head><meta charset="utf-8"><title>Motion Reel</title>
<style>
/* Two font roles the engine uses: "Display" (headlines/body) and "Mono" (labels, HUD, code).
   Point these at the brand's real font files (url(fonts/Brand.woff2)). The defaults try the macOS
   system fonts, then common local fonts; the engine also falls back to system-ui / monospace. */
@font-face{font-family:Display;src:url(file:///System/Library/Fonts/SFNS.ttf),local("Inter"),local("Helvetica Neue"),local("DejaVu Sans");font-weight:100 1000}
@font-face{font-family:Mono;src:url(file:///System/Library/Fonts/SFNSMono.ttf),local("JetBrains Mono"),local("Menlo"),local("DejaVu Sans Mono");font-weight:100 1000}
html,body{margin:0;background:#000;overflow:hidden}
canvas{display:block;width:100vw;height:auto}
</style></head>
<body><canvas id="c"></canvas>
<script src="engine.js"></script>
<script src="assets.js"></script>
<script src="scenes.js"></script>
</body></html>

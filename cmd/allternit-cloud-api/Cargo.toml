[package]
name = "allternit-cloud-api"
version = "0.1.0"
edition = "2021"
description = "Allternit Cloud API - Backend API for cloud deployment"

[[bin]]
name = "allternit-cloud-api"
path = "src/main.rs"

# Operator tool, not built by default (the deploy build skips it):
# cargo run -p allternit-cloud-api --features stripe-plan-cli --bin platform-stripe-plan
[[bin]]
name = "platform-stripe-plan"
path = "src/bin/platform_stripe_plan.rs"
required-features = ["stripe-plan-cli"]

[features]
stripe-plan-cli = []

[dependencies]
# Allternit internal
allternit-cloud-core = { path = "../../infrastructure/cloud" }
allternit-cloud-ssh = { path = "../../infrastructure/cloud/allternit-cloud-ssh" }
allternit-cloud-hetzner = { path = "../../infrastructure/providers/hetzner" }
allternit-cloud-wizard = { path = "../allternit-cloud-wizard" }

# Web framework
axum = { workspace = true, features = ["ws", "tokio"] }
tower = { workspace = true }
tower-http = { workspace = true, features = ["cors", "trace"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Async runtime
tokio = { workspace = true, features = ["full"] }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["json", "env-filter"] }

# Time
chrono = { workspace = true }
chrono-tz = "0.9"

# UUID
uuid = { workspace = true }

# Database (PostgreSQL control plane; `macros`+`migrate` power sqlx::migrate!)
sqlx = { workspace = true, features = ['chrono', 'uuid', 'postgres', 'macros', 'migrate'] }

# WebSocket
# rustls so the Discord gateway can open wss:// (the workspace default has no TLS)
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
futures-util = { workspace = true }
async-trait = { workspace = true }
tokio-stream = { workspace = true, features = ["sync"] }
futures = { workspace = true }
rand = { workspace = true }
# Legacy api_tokens rows hold MD5 digests; needed for the sha256 upgrade path.
md5 = "0.7"
base64 = { workspace = true }
mcp-protocol = { workspace = true }
bytes = { workspace = true }
sha2 = { workspace = true }
sha1 = { workspace = true }
urlencoding = { workspace = true }
hmac = { workspace = true }
hex = { workspace = true }
ed25519-dalek = { workspace = true }
jsonwebtoken = { version = "10", features = ["aws_lc_rs"] }
aws-lc-rs = "1"
reqwest = { workspace = true, default-features = false, features = ["json", "rustls-tls"] }
cron = "0.12"
tempfile = { workspace = true }
regex = { workspace = true }
lazy_static = { workspace = true }
# Photo avatars: decode + downscale the uploaded photo in memory (routes::photo_avatars).
image = { version = "0.24", default-features = false, features = ["png", "jpeg", "webp"] }

# gRPC (Headscale admin API)
tonic = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }

# Streaming body adapter for inference metering (http_body::Body re-export)
hyper = { workspace = true }

[build-dependencies]
tonic-build = { workspace = true }
protoc-bin-vendored = { workspace = true }

[dev-dependencies]
tokio-test = { workspace = true }
reqwest = { workspace = true, features = ['json'] }
assert_matches = "1.5"
serial_test = "3.2"
tempfile = { workspace = true }
tower = { workspace = true, features = ["util"] }
http-body-util = { workspace = true }
hyper = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

openapi: 3.1.0
info:
  title: Allternit Device Tokens API
  version: "1.0.0"
  summary: Push token registration for the Allternit phone apps.
  description: |
    Internal contract for Allternit's own apps, not the public developer API
    (`platform-v1.yaml` is pinned to `/v1` routes by a router test). Base URL
    `https://api.allternit.com` (the app's `ApiConfig.cloudBaseUrl`); paths are
    absolute on it (`x-base: cloud`). Handler: `src/routes/apns.rs`.

    Auth: a Clerk session JWT or an `allternit_*` API token with the `compute`
    scope. Errors are `{ "error": "<code>" }`: `apns_not_configured` (503, iOS),
    `fcm_not_configured` (503, Android), `unsupported_platform`, `bad_token`
    (400), `too_many_devices` (429), `internal` (500).

    `platform` is `"ios"` (the default: an APNs hex token, 32–200 hex
    characters, stored lowercased) or `"android"` (an FCM registration token,
    32–4096 characters of `[A-Za-z0-9_:-]`, case kept; `environment` is
    ignored). Android pushes go out through FCM HTTP v1 (`src/routes/fcm.rs`)
    once `FCM_SERVICE_ACCOUNT_JSON` is set on cloud-api. Both share the
    10-device cap per person (migration `152_device_token_platform.sql`).
servers:
  - url: https://api.allternit.com
security:
  - bearerAuth: []
paths:
  /api/v1/device-tokens:
    post:
      operationId: registerDeviceToken
      summary: Register (or move) this device's push token
      x-base: cloud
      x-handler: cmd/allternit-cloud-api/src/routes/apns.rs register_route
      tags: [Push]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterDeviceTokenRequest" }
      responses:
        "201":
          description: Registered; `readToken` is handed out once.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegisterDeviceTokenResponse" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: unregisterDeviceToken
      summary: Remove this device's push token (sign-out)
      x-base: cloud
      x-handler: cmd/allternit-cloud-api/src/routes/apns.rs unregister_route
      tags: [Push]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UnregisterDeviceTokenRequest" }
      responses:
        "200":
          description: Removed (the body is not read by the app).
        default: { $ref: "#/components/responses/Error" }
  /push/notify/{runtime_id}:
    post:
      operationId: notifyAciPush
      summary: Agent-browser push (aci_approval, aci_human, aci_blocked)
      description: |
        allternit-api forwards these from a runtime (`internal_routes.rs` notify_push). Auth is the
        runtime relay signature (`x-allternit-runtime-id`, `-ts`, `-sig`; the signed path is this one).
        The data is rebuilt from an allowlist: a credential value never reaches a device.
        APNs categories `ACI_APPROVAL` (APPROVE needs auth, DENY destructive), `ACI_HUMAN` (CONTINUE, STOP)
        and `ACI_BLOCKED` (OPEN). Web push and FCM carry the same ids in `data.actions`.
      x-base: cloud
      x-handler: cmd/allternit-cloud-api/src/routes/aci_push.rs notify_route
      tags: [Push]
      security: []
      parameters:
        - { name: runtime_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                bot_name: { type: string }
                data:
                  oneOf:
                    - { $ref: "#/components/schemas/AciApprovalPush" }
                    - { $ref: "#/components/schemas/AciHumanPush" }
                    - { $ref: "#/components/schemas/AciBlockedPush" }
                  discriminator: { propertyName: kind }
      responses:
        "200": { description: Sent. }
        "401": { $ref: "#/components/responses/Error" }
        "422": { description: "Unknown kind or missing run_id, computer_id or approval_id." }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    Error:
      description: An error.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/DeviceTokenError" }
  schemas:
    AciApprovalPush:
      type: object
      description: Title "<bot> needs your OK"; body "Fill your <name> login on <domain>?" or `message`. Never carries a credential value.
      required: [kind, run_id, computer_id, approval_id, approval_kind, message]
      properties:
        kind: { type: string, enum: [aci_approval] }
        run_id: { type: string }
        computer_id: { type: string }
        approval_id: { type: string }
        approval_kind: { type: string, enum: [action, credential] }
        credential:
          type: object
          required: [name, domain]
          properties:
            name: { type: string }
            domain: { type: string }
        message: { type: string }
    AciHumanPush:
      type: object
      description: Title "<bot> needs you"; body is `reason`.
      required: [kind, run_id, computer_id, reason, secret]
      properties:
        kind: { type: string, enum: [aci_human] }
        run_id: { type: string }
        computer_id: { type: string }
        reason: { type: string }
        secret: { type: boolean }
    AciBlockedPush:
      type: object
      description: Title "<domain> blocked <bot>"; body "Open to continue, stop or run it on your Mac".
      required: [kind, run_id, computer_id, domain, block_kind, rerun_targets]
      properties:
        kind: { type: string, enum: [aci_blocked] }
        run_id: { type: string }
        computer_id: { type: string }
        domain: { type: string }
        block_kind: { type: string, enum: [login, two_factor, captcha, block_page, rate_limited] }
        rerun_targets:
          type: array
          items: { type: string }
    DeviceTokenError:
      type: object
      required: [error]
      properties:
        error: { type: string }
    RegisterDeviceTokenRequest:
      type: object
      description: apns.rs `RegisterBody` (serde rename_all camelCase).
      required: [token]
      properties:
        token: { type: string }
        platform: { type: string, description: '"ios" (default) or "android".' }
        environment: { type: string, description: '"sandbox" or "production" (iOS only).' }
        deviceId: { type: string }
        osVersion: { type: string }
        appBuild: { type: string }
        capabilities:
          type: array
          items: { type: string }
    RegisterDeviceTokenResponse:
      type: object
      required: [ok, id, readToken]
      properties:
        ok: { type: boolean }
        id: { type: string }
        readToken: { type: string }
    UnregisterDeviceTokenRequest:
      type: object
      required: [token]
      properties:
        token: { type: string }

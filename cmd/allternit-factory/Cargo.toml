[package]
name = "allternit-factory"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Allternit Factory engine binary (internal; users run gizzi)"

[[bin]]
name = "allternit-factory"
path = "src/main.rs"

[dependencies]
allternit-factory-engine = { workspace = true }
allternit-factory-pane = { path = "../../factory/pane" }
anyhow = { workspace = true }
clap = { workspace = true }
crossterm = "0.29"
reqwest = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
tracing-subscriber = { workspace = true }

# reqwest's default TLS is native-tls, i.e. the build host's libssl (libssl.so.3 on
# Ubuntu 24.04, absent on Ubuntu 18.04/20.04 and Debian 10/11). On Linux, vendored
# OpenSSL links it statically, the same as allternit-api, so the binary runs on every
# glibc >= 2.27 (scripts/build-linux-sidecars.sh builds it with cargo-zigbuild at 2.17).
[target.'cfg(target_os = "linux")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }

[dev-dependencies]
tempfile = { workspace = true }
# Tests moved from the engine crate that drive the binary end to end.
reqwest = { workspace = true }

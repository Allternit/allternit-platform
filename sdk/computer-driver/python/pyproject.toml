[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "allternit-computer-driver"
version = "0.1.0"
description = "Drop-in drivers for Allternit hosted computers: a plain client plus Anthropic (computer/browser toolset), OpenAI computer-use and Gemini computer_use adapters."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic"]

[project.urls]
Documentation = "https://docs.allternit.com/api/platform/sdks/python"

[tool.setuptools]
packages = ["allternit_computer_driver"]

[tool.setuptools.package-data]
allternit_computer_driver = ["py.typed"]
